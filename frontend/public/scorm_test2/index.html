<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PptxGenJS Presentation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #fff;
            overflow: hidden;
        }
        
        #player-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        #slide-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #0f0f1a;
            overflow: hidden;
        }
        
        #slide-container {
            width: 1280px;
            height: 720px;
            background: #fff;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 50px rgba(0,0,0,0.5);
            transform-origin: center center;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            /* Scale will be calculated dynamically by JS */
        }
        
        .slide-element {
            position: absolute;
            overflow: hidden;
        }
        
        .text-element {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
        .image-element {
            object-fit: contain;
        }
        
        .image-element img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        .video-element {
            border: none;
            background: #000;
        }
        
        .video-element iframe,
        .video-element video {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        #controls {
            height: 60px;
            background: #16213e;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-top: 1px solid #0f3460;
        }
        
        .nav-buttons {
            display: flex;
            gap: 10px;
        }
        
        .control-btn {
            background: #0f3460;
            border: none;
            color: #fff;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        
        .control-btn:hover:not(:disabled) {
            background: #1a4980;
        }
        
        .control-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        #progress-container {
            flex: 1;
            margin: 0 20px;
            height: 6px;
            background: #0f3460;
            border-radius: 3px;
            overflow: hidden;
        }
        
        #progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #7c3aed, #06b6d4);
            width: 0%;
            transition: width 0.3s ease;
        }
        
        #slide-counter {
            font-size: 14px;
            color: #94a3b8;
            min-width: 80px;
            text-align: center;
        }
        
        .icon-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            padding: 8px;
            cursor: pointer;
            border-radius: 4px;
            transition: color 0.2s, background 0.2s;
        }
        
        .icon-btn:hover {
            color: #fff;
            background: rgba(255,255,255,0.1);
        }
        
        #global-audio {
            display: none;
        }
    </style>
</head>
<body>
    <div id="player-container">
        <div id="slide-wrapper">
            <div id="slide-container"></div>
        </div>
        <div id="controls">
            <div class="nav-buttons">
                <button class="control-btn" id="prev-btn" onclick="CoursePlayer.prev()">
                    ← Previous
                </button>
                <button class="control-btn" id="next-btn" onclick="CoursePlayer.next()">
                    Next →
                </button>
            </div>
            <div id="progress-container">
                <div id="progress-bar"></div>
            </div>
            <span id="slide-counter">1 / 1</span>
            <div class="nav-buttons">
                <button class="icon-btn" onclick="CoursePlayer.playAudio()" title="Play Audio">
                    🔊
                </button>
                <button class="icon-btn" onclick="CoursePlayer.fullscreen()" title="Fullscreen">
                    ⛶
                </button>
            </div>
        </div>
    </div>
    <audio id="global-audio"></audio>
    <script src="scripts/scorm-api.js"></script>
    <script src="scripts/player.js"></script>
</body>
</html>
