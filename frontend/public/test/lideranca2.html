e acaba de finalizar o projeto 'Nexus', um sucesso que superou todas as metas e prazos, trazendo um retorno significativo para a empresa. Tradicionalmente, projetos de alto impacto como o Nexus renderiam um bônus substancial para a equipe. No entanto, a TechSolutions está passando por um período de reestruturação financeira e cortes orçamentários severos. O bônus da equipe Alpha foi congelado, e você precisa comunicar e gerir essa situação sem desmotivar seu time.", "characters": [{"name": "Você", "role": "Gerente de Projetos da Equipe Alpha", "personality": "Você é um líder dedicado e valoriza o desempenho de sua equipe. Está determinado a manter a motivação, mesmo em tempos difíceis.", "avatar_description": "Uma pessoa de semblante sério, mas acolhedor, vestindo um blazer e camisa social. Expressão pensativa."}, {"name": "Sofia Mendes", "role": "Gerente de Recursos Humanos", "personality": "Pragmática e orientada a políticas, Sofia é a voz da razão e das restrições orçamentárias. Busca soluções justas, mas dentro dos limites da empresa.", "avatar_description": "Mulher na faixa dos 40 anos, com óculos elegantes e um blazer bem cortado. Postura profissional e direta."}, {"name": "Lucas Costa", "role": "Líder Técnico da Equipe Alpha", "personality": "Leal à equipe e à empresa, Lucas é um excelente técnico e um bom termômetro do moral do time. Espera reconhecimento pelo trabalho duro e se preocupa com o bem-estar dos colegas.", "avatar_description": "Homem na faixa dos 30 anos, com camisa polo e calça jeans. Possui um sorriso amigável, mas atualmente com uma expressão preocupada."}], "learning_objectives": ["Diferenciar incentivos financeiros de reconhecimento emocional e seu impacto na motivação.", "Aplicar técnicas de motivação intrínseca em cenários de escassez de recursos.", "Gerir expectativas da equipe de forma transparente e construtiva em tempos de crise orçamentária."], "competencies_evaluated": ["Liderança Situacional", "Comunicação Efetiva", "Gestão de Crises", "Desenvolvimento e Engajamento de Equipes"], "nodes": [{"id": "node_1", "type": "narrative", "title": "O Choque da Notícia", "narrative": "Você está na sala de reuniões com Sofia Mendes, Gerente de RH. Ela acaba de te dar a notícia: apesar do sucesso estrondoso do projeto Nexus, o bônus da sua equipe foi congelado devido a cortes orçamentários.\n\n\"Sei que não é o que esperávamos, mas a situação financeira da empresa exige medidas drásticas. Não há verba para bônus este trimestre. Precisamos encontrar uma forma de reconhecer a equipe Alpha sem envolver dinheiro. Como você pretende comunicar isso e manter o moral alto?\" - diz Sofia, com um tom sério, mas compreensivo.", "character_speaking": "Sofia Mendes", "is_ending": false, "ending_type": null, "score": null, "choices": [{"id": "choice_1_1", "text": "Comunicar a situação orçamentária diretamente à equipe, sendo transparente sobre a impossibilidade do bônus.", "next_node_id": "node_2_direct_comm", "feedback": "A transparência é valorizada, mas a forma de comunicar é crucial. Uma comunicação muito focada na 'negatividade' pode abalar a confiança.", "is_optimal": false, "points": 5}, {"id": "choice_1_2", "text": "Reconhecer publicamente o esforço da equipe e, em seguida, iniciar uma conversa para juntos buscarem alternativas de reconhecimento não financeiro.", "next_node_id": "node_3_collab_sol", "feedback": "Envolver a equipe na solução mostra respeito e valoriza suas ideias. É um bom caminho para a motivação intrínseca e o senso de pertencimento.", "is_optimal": true, "points": 20}, {"id": "choice_1_3", "text": "Adiar a comunicação, buscando por conta própria alguma verba mínima ou um benefício surpresa sem o envolvimento da equipe.", "next_node_id": "node_4_solo_search", "feedback": "Adiar pode criar uma expectativa que não será cumprida. Agir sozinho pode levar a uma solução que não ressoa com a equipe, ignorando a oportunidade de envolvimento.", "is_optimal": false, "points": -5}]}, {"id": "node_2_direct_comm", "type": "narrative", "title": "A Transparência Fria", "narrative": "Você reúne a equipe e, de forma direta, explica a crise orçamentária da empresa e o congelamento dos bônus. O silêncio na sala é pesado. Lucas Costa, seu líder técnico, levanta a mão.\n\n\"Entendemos a situação da empresa, mas nosso esforço foi gigante. É frustrante não ter o reconhecimento que esperávamos. O que isso significa para o futuro? Nosso trabalho vale a pena?\" - pergunta Lucas, a voz carregada de desapontamento. O moral parece ter caído drasticamente.", "character_speaking": "Lucas Costa", "is_ending": false, "ending_type": null, "score": null, "choices": [{"id": "choice_2_1", "text": "Reafirmar a importância do trabalho da equipe, mas reforçar que a situação da empresa é inegociável e que precisam entender.", "next_node_id": "node_final_bad_blame_team", "feedback": "Embora a sinceridade seja um ponto, reforçar a 'dureza' da situação sem oferecer um caminho ou reconhecimento alternativo pode desmotivar ainda mais, transmitindo uma sensação de impotência.", "is_optimal": false, "points": -10}, {"id": "choice_2_2", "text": "Pedir desculpas pela forma como a notícia foi dada e abrir um espaço para ouvir as frustrações da equipe e buscar ideias juntos.", "next_node_id": "node_3_collab_sol", "feedback": "Um pedido de desculpas sincero e a abertura para a colaboração podem mitigar parte do dano, mostrando que você valoriza a equipe e suas opiniões. É uma tentativa de reverter a situação inicial.", "is_optimal": true, "points": 15}, {"id": "choice_2_3", "text": "Prometer que, assim que o orçamento melhorar, o bônus será a primeira prioridade, tentando acalmar a situação com uma promessa futura.", "next_node_id": "node_5_false_hope", "feedback": "Fazer promessas futuras em tempos de incerteza é arriscado. Pode gerar falsas expectativas e, se não cumpridas, corroer a confiança da equipe de forma irreversível.", "is_optimal": false, "points": 0}]}, {"id": "node_3_collab_sol", "type": "narrative", "title": "Brainstorming de Valor", "narrative": "Você começa a reunião reconhecendo o trabalho excepcional da equipe. \"Sei que esperavam algo diferente, e me desculpo por não poder entregar o que seria justo financeiramente. Mas quero que saibam o quanto vocês são valiosos. Vamos pensar juntos: como podemos nos sentir reconhecidos e valorizados, mesmo sem o bônus? Quais são as formas de reconhecimento que realmente importam para vocês?\" - você pergunta. Lucas e o resto da equipe parecem mais receptivos, mas ainda cautelosos.", "character_speaking": "Você", "is_ending": false, "ending_type": null, "score": null, "choices": [{"id": "choice_3_1", "text": "Sugerir a criação de um programa de mentoria interna e sessões de treinamento específicas para o desenvolvimento de carreira.", "next_node_id": "node_6_develop", "feedback": "Focar no desenvolvimento de carreira e crescimento profissional é uma excelente forma de motivação intrínseca, mostrando que a empresa investe no futuro de seus talentos, mesmo sem dinheiro.", "is_optimal": true, "points": 25}, {"id": "choice_3_2", "text": "Propor flexibilidade no trabalho, como dias de trabalho remoto adicionais ou horários mais adaptados às necessidades individuais.", "next_node_id": "node_6_flex", "feedback": "A flexibilidade é um benefício de grande valor percebido, que melhora a qualidade de vida e o bem-estar, sendo um reconhecimento prático e de baixo custo para a empresa.", "is_optimal": true, "points": 25}, {"id": "choice_3_3", "text": "Oferecer pequenos presentes simbólicos, como canetas personalizadas ou cestas de café da manhã, como gesto de agradecimento.", "next_node_id": "node_final_neutral_symbolic", "feedback": "Embora a intenção seja boa, presentes simbólicos podem ser vistos como insuficientes ou até um insulto dado o nível de esforço e expectativa. O impacto motivacional é limitado.", "is_optimal": false, "points": 5}]}, {"id": "node_4_solo_search", "type": "narrative", "title": "A Surpresa Insuficiente", "narrative": "Após alguns dias de busca, você consegue alocar uma verba mínima – apenas o suficiente para comprar alguns vouchers de café ou refeição. Você reúne a equipe, entrega os vouchers e tenta explicar o gesto:\n\n\"Sei que não é o bônus que esperavam, mas quero que saibam que tentei. Isso é um pequeno sinal do meu apreço pelo trabalho de vocês.\" - Você diz, entregando os vouchers. A equipe recebe os vouchers com um misto de surpresa e, em alguns rostos, desapontamento. Lucas te procura depois da reunião.\n\n\"Chefe, agradecemos a intenção, mas... foi um pouco estranho. Quase nos sentimos como crianças recebendo uma bala. Não seria melhor ter conversado conosco antes?\" - Lucas questiona, visivelmente desconfortável.", "character_speaking": "Lucas Costa", "is_ending": false, "ending_type": null, "score": null, "choices": [{"id": "choice_4_1", "text": "Concordar com Lucas, pedir desculpas pela abordagem e abrir um diálogo sobre o que a equipe realmente valoriza.", "next_node_id": "node_3_collab_sol", "feedback": "Admitir um erro e buscar a colaboração, mesmo tardiamente, é crucial para reconstruir a confiança. Ainda há uma chance de transformar a situação em algo positivo.", "is_optimal": true, "points": 10}, {"id": "choice_4_2", "text": "Defender sua decisão, explicando que fez o melhor que podia com os recursos disponíveis e que o gesto deve ser valorizado.", "next_node_id": "node_final_bad_solo_defense", "feedback": "Defender a própria decisão sem reconhecer a perspectiva da equipe pode aliená-los. Ignorar o feedback de Lucas agrava a situação, fazendo com que se sintam desvalorizados e não ouvidos.", "is_optimal": false, "points": -15}, {"id": "choice_4_3", "text": "Minimizar a importância do feedback de Lucas, dizendo que nem todos podem ser agradados e que o foco deve ser no próximo projeto.", "next_node_id": "node_final_bad_dismissive", "feedback": "Ignorar e minimizar o feedback da equipe é um erro grave de liderança. Isso pode levar à desconfiança, desengajamento e até mesmo a perda de talentos. O moral da equipe será seriamente comprometido.", "is_optimal": false, "points": -20}]}, {"id": "node_5_false_hope", "type": "narrative", "title": "A Promessa Que Não Veio", "narrative": "Meses se passaram desde sua promessa de que o bônus seria prioridade 'assim que o orçamento melhorasse'. A situação financeira da empresa não melhorou significativamente, e não há previsão para o bônus. A equipe, inicialmente esperançosa, agora demonstra sinais claros de frustração. Lucas te aborda novamente:\n\n\"Chefe, o pessoal está perguntando sobre o bônus. Nós trabalhamos duro por essa promessa, mas nada aconteceu. Parece que fomos enganados. A confiança na gestão está em xeque.\" - A voz de Lucas é firme, mas carregada de decepção.", "character_speaking": "Lucas Costa", "is_ending": false, "ending_type": null, "score": null, "choices": [{"id": "choice_5_1", "text": "Ignorar o assunto e esperar que a equipe esqueça, focando apenas nas demandas atuais dos projetos.", "next_node_id": "node_final_bad_ignore_promise", "feedback": "Ignorar um problema não o faz desaparecer. Pelo contrário, a falta de comunicação e a quebra de promessas podem levar a um ambiente de desconfiança e ressentimento, com alto risco de desengajamento e rotatividade.", "is_optimal": false, "points": -25}, {"id": "choice_5_2", "text": "Reunir a equipe, explicar a contínua dificuldade orçamentária, pedir desculpas pela promessa não cumprida e reabrir o diálogo para alternativas de reconhecimento.", "next_node_id": "node_3_collab_sol", "feedback": "A transparência e o reconhecimento do erro são essenciais para tentar reconstruir a confiança, mesmo que seja um caminho árduo. Abrir o diálogo novamente pode gerar soluções mais sustentáveis e engajar a equipe.", "is_optimal": true, "points": 10}, {"id": "choice_5_3", "text": "Buscar uma alternativa de reconhecimento não financeiro com urgência, implementando-a antes que a situação piore.", "next_node_id": "node_final_neutral_last_minute_save", "feedback": "Embora seja uma iniciativa tardia, a ação demonstra que você se importa e está tentando compensar. Contudo, o impacto será menor do que se tivesse havido um planejamento e comunicação proativa.", "is_optimal": false, "points": 5}]}, {"id": "node_6_develop", "type": "narrative", "title": "Investindo no Futuro", "narrative": "Após discussões com a equipe e com Sofia do RH, você apresenta um 'Plano de Desenvolvimento Alpha'. Ele inclui: 1) Um programa de mentoria cruzada com outros departamentos para ampliar a rede e conhecimento da equipe; 2) Acesso a uma plataforma de cursos online premium com foco nas áreas de interesse dos membros; 3) Workshops internos liderados por especialistas da própria empresa em temas relevantes.\n\nA equipe, embora ainda sentindo a falta do bônus, demonstra entusiasmo. Lucas comenta: \"É diferente do que esperávamos, mas é um investimento real em nós. Sentimos que a empresa ainda valoriza nosso crescimento. Isso nos motiva a continuar.\" Sofia Mendes te parabeniza: \"Uma excelente iniciativa. Demonstra valorização e está dentro do nosso orçamento.\"", "character_speaking": "Lucas Costa", "is_ending": false, "ending_type": null, "score": null, "choices": [{"id": "choice_6_1", "text": "Implementar o plano e agendar reuniões de acompanhamento regulares para garantir o engajamento e a eficácia.", "next_node_id": "node_final_good_dev", "feedback": "Um bom plano precisa de acompanhamento. Isso garante que o reconhecimento continue sendo percebido e que o desenvolvimento da equipe seja contínuo.", "is_optimal": true, "points": 10}, {"id": "choice_6_2", "text": "Comunicar a Sofia que o plano será implementado e esperar o feedback espontâneo da equipe.", "next_node_id": "node_final_neutral_vague_dev", "feedback": "Implementar o plano sem um acompanhamento ativo pode fazer com que o entusiasmo inicial se dissipe. O feedback espontâneo é importante, mas uma liderança proativa garante o sucesso.", "is_optimal": false, "points": 0}]}, {"id": "node_6_flex", "type": "narrative", "title": "Benefícios para a Qualidade de Vida", "narrative": "Em conjunto com a equipe e Sofia do RH, você anuncia o 'Programa Alpha Flex'. As medidas incluem: 1) Opção de trabalho remoto por um dia fixo na semana para todos; 2) Banco de horas com flexibilidade para compensar ausências pessoais curtas; 3) Um 'dia de bem-estar' trimestral para uso individual. A equipe recebe a notícia com alívio e gratidão. Lucas comenta:\n\n\"Essa flexibilidade faz uma diferença enorme! Nos sentimos mais valorizados, pois a empresa está olhando para o nosso bem-estar e confiança. Isso ajuda a equilibrar as coisas e manter a motivação.\" Sofia complementa: \"É uma excelente forma de manter a produtividade e a satisfação sem impacto financeiro direto.\"", "character_speaking": "Lucas Costa", "is_ending": false, "ending_type": null, "score": null, "choices": [{"id": "choice_6_3", "text": "Implementar o programa e criar canais de feedback contínuo para ajustes e melhorias.", "next_node_id": "node_final_good_flex", "feedback": "Um programa flexível e benéfico precisa ser ajustado às necessidades da equipe. Canais de feedback garantem a relevância e a satisfação contínua.", "is_optimal": true, "points": 10}, {"id": "choice_6_4", "text": "Lançar o programa e deixar que a equipe o utilize conforme suas necessidades, sem monitoramento ou coleta de feedback formal.", "next_node_id": "node_final_neutral_vague_flex", "feedback": "A falta de acompanhamento pode levar a problemas de uso, desigualdades ou falta de percepção do valor a longo prazo. É importante garantir que o programa atenda aos objetivos propostos.", "is_optimal": false, "points": 0}]}, {"id": "node_final_good_dev", "type": "ending", "title": "Desfecho: Equipe Valorizada e em Crescimento", "narrative": "Com o 'Plano de Desenvolvimento Alpha' em pleno funcionamento e seu acompanhamento ativo, a equipe Alpha mantém um alto nível de engajamento e produtividade. Membros da equipe expressam gratidão pelas oportunidades de aprendizado e crescimento. Lucas Costa reporta que o moral está alto e que a equipe se sente mais conectada e investida no futuro da empresa. A ausência do bônus financeiro foi compensada por um reconhecimento mais profundo e significativo, focado no desenvolvimento pessoal e profissional. Você se tornou um líder ainda mais respeitado, capaz de inspirar e motivar em qualquer circunstância.", "character_speaking": null, "is_ending": true, "ending_type": "good", "score": 95, "choices": []}, {"id": "node_final_good_flex", "type": "ending", "title": "Desfecho: Equipe Produtiva e Feliz", "narrative": "O 'Programa Alpha Flex' é um sucesso. A equipe Alpha demonstra maior satisfação e equilíbrio entre vida pessoal e profissional, o que se traduz em maior produtividade e menor estresse. Os canais de feedback ativo permitem ajustes finos que mantêm o programa relevante e valorizado. Lucas Costa te informa que a flexibilidade é percebida como um reconhecimento tangível do valor da equipe, superando a frustração inicial do bônus perdido. A confiança na liderança foi reforçada, e a equipe está motivada e leal, vendo que a empresa se importa com seu bem-estar. Você se consolidou como um líder que prioriza as pessoas.", "character_speaking": null, "is_ending": true, "ending_type": "good", "score": 90, "choices": []}, {"id": "node_final_neutral_symbolic", "type": "ending", "title": "Desfecho: Reconhecimento Morno", "narrative": "Os pequenos presentes simbólicos foram recebidos com um misto de gratidão polida e desapontamento velado. A equipe aprecia a intenção, mas sente que o reconhecimento não está à altura do esforço extra empregado no projeto Nexus. Lucas Costa comenta que, embora a equipe não esteja ativamente desmotivada, a energia e o entusiasmo não são os mesmos. O ambiente de trabalho é funcional, mas falta aquele brilho de equipes verdadeiramente engajadas. A longo prazo, há um risco de baixa proatividade e busca por outras oportunidades.", "character_speaking": null, "is_ending": true, "ending_type": "neutral", "score": 60, "choices": []}, {"id": "node_final_bad_solo_defense", "type": "ending", "title": "Desfecho: Desconfiança e Desengajamento", "narrative": "Ao defender sua decisão dos vouchers sem acolher o feedback de Lucas, você criou uma barreira. A equipe Alpha se sente ignorada e subestimada. A percepção é que seus esforços não são verdadeiramente valorizados, e que suas opiniões não importam. O moral da equipe despenca. Há um aumento visível na apatia durante as reuniões e na comunicação. Lucas começa a buscar outras oportunidades e a produtividade da equipe diminui gradualmente, impactando futuros projetos. A relação de confiança com a liderança está seriamente comprometida.", "character_speaking": null, "is_ending": true, "ending_type": "bad", "score": 30, "choices": []}, {"id": "node_final_bad_dismissive", "type": "ending", "title": "Desfecho: A Perda de Talentos", "narrative": "Ao minimizar o feedback de Lucas, você enviou uma mensagem clara: a voz da equipe não é importante. A desilusão e o ressentimento crescem. A equipe Alpha perde a motivação e o engajamento, com vários membros buscando ativamente novas oportunidades. Lucas, frustrado, entrega sua carta de demissão, mencionando a falta de reconhecimento e escuta. A produtividade cai drasticamente, e a TechSolutions Corp. enfrenta uma crise de retenção de talentos na sua área. Você se vê com a difícil tarefa de reconstruir uma equipe desmoralizada.", "character_speaking": null, "is_ending": true, "ending_type": "bad", "score": 10, "choices": []}, {"id": "node_final_bad_ignore_promise", "type": "ending", "title": "Desfecho: A Promessa Ignorada e a Fuga", "narrative": "Sua decisão de ignorar a promessa não cumprida resultou em uma crise de confiança. A equipe Alpha se sente traída e desvalorizada. O murmúrio de descontentamento se transforma em desengajamento ativo. Lucas e outros membros-chave da equipe começam a procurar outras empresas, sentindo que a TechSolutions não cumpre suas palavras. A produtividade despenca, e o turnover aumenta, gerando custos significativos de recrutamento e treinamento. Você enfrenta a dura realidade de ter uma equipe desmotivada e em constante desfalque, com sua reputação como líder seriamente abalada.", "character_speaking": null, "is_ending": true, "ending_type": "bad", "score": 5, "choices": []}, {"id": "node_final_bad_blame_team", "type": "ending", "title": "Desfecho: Resentimento e Desmotivação Profunda", "narrative": "Ao reafirmar a situação da empresa sem acolher o desapontamento da equipe, você inadvertentlye transmitiu uma mensagem de 'a empresa vem antes de vocês'. A equipe Alpha sente-se desvalorizada e desrespeitada. O moral despencou. O ressentimento toma conta, com a produtividade caindo para o mínimo necessário. Não há mais proatividade ou inovação. Lucas e outros membros expressam abertamente seu descontentamento e começam a buscar outras oportunidades no mercado. A equipe entra em um ciclo de desengajamento e provável rotatividade, colocando em risco futuros projetos cruciais.", "character_speaking": null, "is_ending": true, "ending_type": "bad", "score": 20, "choices": []}, {"id": "node_final_neutral_vague_dev", "type": "ending", "title": "Desfecho: Potencial Não Totalmente Explorado", "narrative": "O 'Plano de Desenvolvimento Alpha' foi implementado, mas sem um acompanhamento contínuo e proativo. A equipe, inicialmente receptiva, perdeu parte do entusiasmo com o tempo. Alguns membros aproveitaram as oportunidades de desenvolvimento, mas outros não se engajaram plenamente devido à falta de estímulo constante. Lucas reporta que, embora a iniciativa tenha sido positiva, o impacto poderia ter sido maior com um esforço mais consistente da liderança. O moral está estável, mas o potencial máximo de engajamento e desenvolvimento não foi alcançado.", "character_speaking": null, "is_ending": true, "ending_type": "neutral", "score": 70, "choices": []}, {"id": "node_final_neutral_vague_flex", "type": "ending", "title": "Desfecho: Flexibilidade com Desafios", "narrative": "O 'Programa Alpha Flex' foi lançado, mas sem canais de feedback robustos. Embora muitos membros da equipe apreciem a nova flexibilidade, surgem inconsistências na aplicação e percepções de favoritismo. Alguns sentem que suas necessidades não são atendidas, e a falta de comunicação sobre os resultados do programa gera incertezas. Lucas comenta que o programa é uma boa ideia, mas que a falta de clareza e acompanhamento impede que ele atinja seu potencial máximo. O moral da equipe é razoável, mas há espaço para melhorias significativas no engajamento e na percepção de justiça.", "character_speaking": null, "is_ending": true, "ending_type": "neutral", "score": 65, "choices": []}, {"id": "node_final_neutral_last_minute_save", "type": "ending", "title": "Desfecho: Resgate Tarde, mas Valorizado", "narrative": "Sua ação de última hora para encontrar uma alternativa de reconhecimento não financeiro ajudou a mitigar o pior da crise de confiança. A equipe aprecia o esforço, mas a frustração da promessa não cumprida e a demora em agir ainda persistem. Lucas Costa expressa que, embora a iniciativa seja bem-vinda, a equipe sente que o processo poderia ter sido mais transparente e proativo desde o início. O moral da equipe melhora ligeiramente, mas a sensação de que 'quase foi demais' ainda paira no ar. A confiança foi parcialmente restaurada, mas exigirá um esforço contínuo para ser plenamente recuperada.", "character_speaking": null, "is_ending": true, "ending_type": "neutral", "score": 55, "choices": []}], "start_node_id": "node_1", "config": {"theme": "Tomada de decisão sobre premiação de equipe em crise orçamentária", "objectives": "Diferenciar incentivos financeiros de reconhecimento emocional; aplicar técnicas de motivação intrínseca; gerir expectativas da equipe em tempos de escassez.", "audience": "Gestores de nível intermediário e líderes de equipe."}, "created_at": "2026-03-18T16:03:20.738364+00:00", "updated_at": "2026-03-18T16:03:20.738364+00:00"}, "style": {}, "startTime": 0, "animations": [{"id": "b656bedd-2211-43d2-96ca-eb5435f3bf7c", "type": "entrance", "effect": "fade", "trigger": "withPrevious", "duration": 0.5, "delay": 0.3}]}], "annotations": [], "transition": {"type": "fade", "duration": 0.5}, "audio": [], "notes": "O cenário deve focar na comunicação assertiva e na substituição do bônus por formas de reconhecimento intrínseco e promessas de desenvolvimento futuro.", "librasScript": "Cenário interativo: Equipe trabalhou muito, mas empresa não tem dinheiro para bônus agora. Você é o líder. O que fazer para motivar o grupo? Escolha a melhor ação.", "duration": 5.0}, {"id": "cc1080a8-4c8d-47df-af2d-43dfa1d81389", "title": "Mediação de Conflitos", "order": 11, "width": 1920, "height": 820, "background": "#fefce8", "backgroundImage": null, "backgroundOpacity": null, "elements": [{"id": "20428c9b-273b-4664-819c-455247bc6785", "type": "html", "x": 0, "y": 0, "width": 1920, "height": 50, "htmlContent": "__B64__:PGRpdiBzdHlsZT0id2lkdGg6MTAwJTtoZWlnaHQ6MTAwJTtiYWNrZ3JvdW5kOiMxYzE5MTc7ZGlzcGxheTpmbGV4O2FsaWduLWl0ZW1zOmNlbnRlcjtwYWRkaW5nOjAgMzBweDtib3JkZXItYm90dG9tOjNweCBzb2xpZCAjZDk3NzA2OyI+CjxkaXYgc3R5bGU9IndpZHRoOjRweDtoZWlnaHQ6MjRweDtiYWNrZ3JvdW5kOiNkOTc3MDY7Ym9yZGVyLXJhZGl1czoycHg7bWFyZ2luLXJpZ2h0OjEycHg7Ij48L2Rpdj4KPHNwYW4gc3R5bGU9ImNvbG9yOiNmZmZmZmY7Zm9udC1zaXplOjEzcHg7Zm9udC13ZWlnaHQ6NjAwO2xldHRlci1zcGFjaW5nOjEuNXB4O3RleHQtdHJhbnNmb3JtOnVwcGVyY2FzZTtmb250LWZhbWlseTonUGxheWZhaXIgRGlzcGxheScsICdHZW9yZ2lhJywgc2VyaWY7Ij5HZXN0w6NvIGRlIENvbmZsaXRvcyBlIERlY2lzw6NvPC9zcGFuPgo8c3BhbiBzdHlsZT0iY29sb3I6cmdiYSgyNTUsMjU1LDI1NSwwLjYpO2ZvbnQtc2l6ZToxMnB4O21hcmdpbi1sZWZ0OmF1dG87Zm9udC1mYW1pbHk6J1BsYXlmYWlyIERpc3BsYXknLCAnR2VvcmdpYScsIHNlcmlmOyI+TWVkaWHDp8OjbyBkZSBDb25mbGl0b3M8L3NwYW4+PC9kaXY+", "style": {}, "startTime": 0, "animations": []}, {"id": "ccfa07bc-6703-44d3-88cf-0d70b9036969", "type": "html yBwYXJhIG8gbGFuw6dhbWVudG8uPC9wPgo8L2Rpdj4=", "style": {}, "startTime": 0, "animations": [{"id": "d3cf5e4a-2034-4972-b701-839e28807b3e", "type": "entrance", "effect": "fade", "trigger": "withPrevious", "duration": 0.5, "delay": 0.1}]}, {"id": "1837fa9c-9f4e-4900-b574-22ef104872b1", "type": "scenario", "x": 160, "y": 270, "width": 1600, "height": 520, "content": "bb664d91-3d9a-4162-b4a2-24cb101f1a70", "scenarioData": {"id": "bb664d91-3d9a-4162-b4a2-24cb101f1a70", "project_id": "860e245f-0ad1-4909-a30e-b220a421b75d", "title": "A Crise do SIGEC: Conflito em Ponto Crítico", "description": "Navegue um cenário de alta pressão onde dois especialistas seniores entram em conflito durante a entrega final de um projeto crítico, com apenas 24 horas para o lançamento.", "context": "Você é Ana Lúcia Sampaio, Gerente de Projetos Sênior na Tech Solutions Ltda. O projeto 'Sistema Integrado de Gestão de Clientes (SIGEC)', sua maior iniciativa do ano, está na fase final de homologação. O lançamento oficial está agendado para amanhã, e a empresa investiu pesadamente em publicidade. No entanto, um bug crítico acaba de ser identificado no módulo de integração, e os dois especialistas responsáveis, Otávio Mendes (Backend) e Renata Alves (Frontend), estão em uma discussão acalorada, culpando-se mutuamente e paralisando a busca por uma solução. O CEO espera notícias suas em menos de 12 horas.", "characters": [{"name": "Ana Lúcia Sampaio", "role": "Gerente de Projetos Sênior (Você)", "personality": "Focada em resultados e no bem-estar da equipe. Busca soluções equilibradas que considerem tanto os aspectos técnicos quanto os interpessoais. Sob pressão, mantém a calma, mas é decisiva.", "avatar_description": "Mulher de 38 anos, cabelos castanhos presos em um coque, vestindo blazer cinza e camisa branca. Expressão atenta e profissional."}, {"name": "Otávio Mendes", "role": "Especialista em Backend Sênior", "personality": "Metódico, avesso a mudanças de última hora e extremamente orgulhoso de sua expertise técnica e da robustez de seu código. Vê qualquer alteração não planejada como uma ameaça à integridade do sistema.", "avatar_description": "Homem de 45 anos, cabelo ralo e óculos. Usa uma camisa polo azul e calças sociais. Tem uma postura defensiva e voz um pouco ríspida."}, {"name": "Renata Alves", "role": "Especialista em Frontend Sênior", "personality": "Criativa, pragmática e focada em agilidade. Busca soluções inovadoras e é rápida na implementação, mas às vezes pode parecer impulsiva ou impaciente com processos burocráticos. Valoriza a experiência do usuário acima de tudo.", "avatar_description": "Mulher de 32 anos, cabelos cacheados presos em um rabo de cavalo. Veste uma blusa moderna e jeans. Gesticula bastante, demonstrando energia e frustração."}], "learning_objectives": ["Avaliar a capacidade de mediar conflitos interpessoais sob alta pressão.", "Manter o foco na solução técnica do problema, sem perder de vista o prazo crítico.", "Preservar o clima organizacional e as relações profissionais a longo prazo.", "Tomar decisões estratégicas que equilibrem urgência e sustentabilidade da equipe."], "competencies_evaluated": ["Gestão de Conflitos", "Tomada de Decisão sob Pressão", "Comunicação Assertiva", "Liderança Situacional", "Foco em Resultados"], "nodes": [{"id": "node_1", "type": "narrative", "title": "Alerta Vermelho: O Conflito Explode", "narrative": "É uma terça-feira, 16h. Você está terminando um relatório quando seu telefone toca freneticamente. É Laura, sua colega da área de Qualidade. 'Ana Lúcia, precisamos de você na sala de reuniões agora! O SIGEC está com um bug crítico e o Otávio e a Renata estão praticamente se agredindo verbalmente. Não conseguimos que eles colaborem para encontrar a solução. O lançamento é amanhã!', ela diz, a voz carregada de pânico. Ao chegar, você vê Otávio e Renata, faces vermelhas, gesticulando um para o outro enquanto a equipe de QA observa, tensa. 'O problema é o código mal escrito do frontend da Renata! Sempre a mesma coisa!', grita Otávio. 'Não! É a sua estrutura de backend que não suporta a integração dinâmica que precisamos! É sua teimosia em não modernizar!', retruca Renata.", "character_speaking": "Laura", "is_ending": false, "ending_type": null, "score": null, "choices": [{"id": "choice_1_1", "text": "Convoque-os imediatamente para uma reunião fechada, exigindo que se concentrem nos fatos e na solução.", "next_node_id": "node_2", "feedback": "Esta é uma abordagem direta, que pode ser eficaz para focar a discussão, mas exige pulso firme para evitar que o conflito se agrave. O risco é eles transferirem a discussão para você.", "is_optimal": false, "points": 10}, {"id": "choice_1_2", "text": "Converse com Otávio primeiro, depois com Renata, individualmente, para entender a raiz do problema antes de reuni-los.", "next_node_id": "node_3", "feedback": "Uma abordagem mais cautelosa. Permite que você colete informações e entenda a perspectiva de cada um sem a pressão do confronto direto. Pode ser mais fácil desarmar as tensões um-a-um.", "is_optimal": true, "points": 20}, {"id": "choice_1_3", "text": "Envie um e-mail com prazo final de 30 minutos para que apresentem uma proposta de solução conjunta, sob pena de escalonamento.", "next_node_id": "node_final_bad", "feedback": "Esta abordagem é impessoal e adiciona mais pressão a uma situação já volátil. Pode ser percebida como uma fuga de responsabilidade e raramente resolve conflitos interpessoais complexos, tendendo a gerar ressentimento e não colaboração.", "is_optimal": false, "points": -10}, {"id": "choice_1_4", "text": "Ignore o conflito e peça à equipe de QA para identificar o problema técnico, enquanto você foca na comunicação com stakeholders.", "next_node_id": "node_4", "feedback": "Delegar a análise técnica pode ser uma boa estratégia em outras situações, mas ignorar o conflito aberto entre os principais resolvedores é arriscado. O problema técnico pode não ser resolvido sem a colaboração deles, e a tensão permanecerá, impactando o projeto.", "is_optimal": false, "points": 0}]}, {"id": "node_2", "type": "narrative", "title": "A Reunião Confrontacional", "narrative": "Você os chama para a sala de reuniões. Otávio e Renata mal se olham. Assim que você pede para que expliquem o problema, eles voltam a discutir, interrompendo um ao outro. 'Ana Lúcia, é impossível trabalhar assim!', Otávio exclama, batendo na mesa. 'Ele está sabotando a entrega com esse código arcaico!', grita Renata.", "character_speaking": null, "is_ending": false, "ending_type": null, "score": null, "choices": [{"id": "choice_2_1", "text": "Interrompa a discussão imediatamente e estabeleça regras: cada um fala por vez, focando no problema técnico, não em acusações.", "next_node_id": "node_5", "feedback": "Boa! Estabelecer limites claros é crucial para gerenciar uma discussão acalorada. Redirecionar o foco para o problema e não para a pessoa é o primeiro passo para uma resolução construtiva. Isso mostra liderança.", "is_optimal": true, "points": 20}, {"id": "choice_2_2", "text": "Deixe-os desabafar por mais alguns minutos, esperando que o cansaço reduza a tensão.", "next_node_id": "node_final_bad", "feedback": "Ruim. Numa situação de conflito já explodida e sob pressão de prazo, permitir que o desabafo continue sem intervenção pode agravar ainda mais a situação, levando a ofensas pessoais e prejudicando irremediavelmente o relacionamento e a entrega.", "is_optimal": false, "points": -20}, {"id": "choice_2_3", "text": "Sugira uma pausa para que esfriem a cabeça e voltem mais tarde com propostas de solução por escrito.", "next_node_id": "node_4", "feedback": "Esta opção oferece um 'tempo morto', que pode ser útil. No entanto, o envio de propostas por escrito pode não fomentar a colaboração necessária para uma solução complexa e urgente, e o tempo é crítico.", "is_optimal": false, "points": 5}]}, {"id": "node_3", "type": "narrative", "title": "Conversas Individuais e Descobertas", "narrative": "Você primeiro conversa com Otávio. Ele desabafa sobre a pressão de mudanças de última hora no backend e a falta de disciplina de Renata. 'Ela sempre quer testar coisas novas na fase final! Meu código é robusto, o dela é que está bagunçando a integração!', ele diz. Em seguida, você fala com Renata. Ela se mostra frustrada com a inflexibilidade de Otávio. 'O backend dele não é escalável o suficiente para as funcionalidades que precisamos! É um sistema antigo que não se adapta!', argumenta. Ambos apresentam argumentos técnicos plausíveis e se sentem desrespeitados.", "character_speaking": null, "is_ending": false, "ending_type": null, "score": null, "choices": [{"id": "choice_3_1", "text": "Chame os dois para uma reunião, apresente um resumo imparcial do que coletou e peça que colaborem na busca por uma solução comum.", "next_node_id": "node_5", "feedback": "Excelente! Você agiu como um mediador eficaz, entendendo as duas perspectivas. Agora, traga-os de volta com o objetivo claro de colaboração, usando as informações para focar na solução e não na culpa.", "is_optimal": true, "points": 25}, {"id": "choice_3_2", "text": "Decida que a abordagem de Otávio é mais segura dada a urgência e instrua Renata a segui-la.", "next_node_id": "node_6", "feedback": "Tomar partido unilateralmente pode resolver a questão no curto prazo, mas arrisca alienar Renata e prejudicar o clima da equipe a longo prazo. Ela pode se sentir desvalorizada e desmotivada.", "is_optimal": false, "points": 5}, {"id": "choice_3_3", "text": "Peça a um terceiro especialista da equipe, que não está envolvido, para revisar o código e identificar a causa raiz do problema.", "next_node_id": "node_4", "feedback": "Esta é uma boa estratégia para obter uma avaliação técnica neutra. No entanto, pode atrasar a resolução, pois depende da disponibilidade e familiaridade do terceiro com o código. O tempo é crucial.", "is_optimal": false, "points": 10}, {"id": "choice_3_4", "text": "Tente formular você mesmo uma solução técnica com base nas informações coletadas e apresente a eles para validação.", "next_node_id": "node_6", "feedback": "Assumir a responsabilidade pela solução pode ser visto como proativo, mas também pode desvalorizar a expertise dos especialistas. Se a sua solução não for aceita por ambos, você estará em uma posição ainda mais difícil.", "is_optimal": false, "points": 10}]}, {"id": "node_4", "type": "narrative", "title": "A Busca por Ajuda Externa ou o Tempo se Esgota", "narrative": "Você decide buscar uma solução alternativa. Seja pela demora em obter uma opinião externa ou pela ineficácia de uma pausa não estruturada, o tempo está passando e a tensão continua no ar. Você tem menos de 18 horas para o lançamento. A equipe de QA está pressionada e não conseguiu replicar o problema com clareza para o terceiro especialista, ou Otávio e Renata voltaram da pausa ainda mais endurecidos em suas posições, sem uma proposta conjunta clara.", "character_speaking": null, "is_ending": false, "ending_type": null, "score": null, "choices": [{"id": "choice_4_1", "text": "Reúna Otávio e Renata, impondo uma colaboração forçada e definindo papéis e prazos estritos para a resolução do bug.", "next_node_id": "node_6", "feedback": "Dada a urgência, impor uma estrutura pode ser necessário. Contudo, a colaboração forçada, sem uma resolução real do conflito, pode levar a uma entrega técnica subótima e criar ressentimento a longo prazo.", "is_optimal": false, "points": 5}, {"id": "choice_4_2", "text": "Entre em contato com seu superior imediato, apresentando a situação e pedindo orientação sobre como prosseguir.", "next_node_id": "node_final_neutral", "feedback": "Escalar a situação pode ser uma decisão prudente para compartilhar a responsabilidade e obter apoio, especialmente se o tempo está esgotando. No entanto, isso pode ser visto como uma falha na sua capacidade de gestão de conflitos, impactando sua imagem de liderança.", "is_optimal": false, "points": 0}, {"id": "choice_4_3", "text": "Sugira uma divisão de tarefas clara, onde cada um trabalha na parte que tem mais domínio, com integração monitorada por você.", "next_node_id": "node_6", "feedback": "Essa abordagem foca em aproveitar a expertise individual e evitar a necessidade de colaboração direta em tempo integral, o que pode ser eficaz sob pressão. A integração monitorada reduz os riscos de novos conflitos técnicos.", "is_optimal": true, "points": 15}]}, {"id": "node_5", "type": "narrative", "title": "A Mediação Eficaz e o Plano de Ação", "narrative": "Você consegue acalmar os ânimos e direcionar a discussão para a análise técnica do bug. Otávio e Renata, embora ainda tensos, começam a apresentar suas análises. Você os ajuda a identificar os pontos em comum e as divergências. Percebe-se que o bug está na interface entre os módulos, algo que Otávio considera responsabilidade de integração do frontend, e Renata, uma falha na documentação do backend. O relógio continua correndo, restam cerca de 16 horas. A equipe precisa de um plano de ação claro e rápido.", "character_speaking": null, "is_ending": false, "ending_type": null, "score": null, "choices": [{"id": "choice_5_1", "text": "Proponha que Otávio e Renata trabalhem juntos em uma solução emergencial, lado a lado, enquanto você monitora o progresso.", "next_node_id": "node_7", "feedback": "Esta é a melhor opção. Fomentar a colaboração direta, mesmo que sob supervisão, é crucial para resolver o problema rapidamente e começar a reconstruir a confiança. Isso mostra que você confia na capacidade deles de trabalharem juntos.", "is_optimal": true, "points": 30}, {"id": "choice_5_2", "text": "Divida a tarefa: Otávio fará uma correção no backend e Renata fará uma adaptação no frontend, e você integrará as duas partes.", "next_node_id": "node_7", "feedback": "Esta é uma boa alternativa para garantir que ambos trabalhem, mas ao assumir a integração, você se sobrecarrega e corre o risco de ser o ponto de falha. A colaboração direta ainda seria mais eficaz para o aprendizado e a reconstrução do relacionamento.", "is_optimal": false, "points": 15}, {"id": "choice_5_3", "text": "Determine que a solução de Renata (mais rápida) será implementada e Otávio deve ajudá-la a contornar os problemas no backend.", "next_node_id": "node_6", "feedback": "Embora a urgência possa justificar uma solução mais rápida, priorizar unilateralmente a abordagem de um pode gerar ressentimento no outro, especialmente se a solução não for a ideal ou causar problemas futuros. O ideal é que eles cheguem a um consenso.", "is_optimal": false, "points": 5}, {"id": "choice_5_4", "text": "Sugira a implementação de uma solução temporária para o lançamento, planejando uma correção definitiva para depois.", "next_node_id": "node_final_neutral", "feedback": "Uma solução temporária pode salvar o lançamento, mas acarreta riscos técnicos e de reputação a longo prazo. Além disso, não resolve a raiz do conflito ou a falha na colaboração.", "is_optimal": false, "points": 10}]}, {"id": "node_6", "type": "narrative", "title": "A Solução Imposta ou com Colaboração Limitada", "narrative": "Apesar dos seus esforços, a colaboração entre Otávio e Renata não é ideal. Seja por uma imposição sua, pela falta de tempo para um consenso real, ou pela resistência de um deles, a solução técnica está sendo implementada, mas o clima entre eles é tenso. Otávio e/ou Renata trabalham mais por obrigação do que por engajamento. Você está monitorando de perto, pois o prazo é crítico, restam menos de 10 horas. O projeto SIGEC avança, mas a passos arrastados pela falta de entusiasmo dos envolvidos.", "character_speaking": null, "is_ending": false, "ending_type": null, "score": null, "choices": [{"id": "choice_6_1", "text": "Continue monitorando de perto e oferecendo suporte técnico, ignorando as tensões para focar na entrega.", "next_node_id": "node_final_neutral", "feedback": "Focar na entrega é essencial, mas ignorar as tensões latentes não as fará desaparecer. Isso pode garantir o sucesso do projeto no curto prazo, mas deixará um rastro de problemas de relacionamento para o futuro.", "is_optimal": false, "points": 10}, {"id": "choice_6_2", "text": "Convoque uma conversa particular com cada um, pedindo um esforço final de colaboração pela empresa e o projeto.", "next_node_id": "node_7", "feedback": "Mesmo que tardia, tentar reengajar os colaboradores individualmente e apelar para o senso de responsabilidade pode surtir efeito. É uma tentativa de mitigar os danos ao relacionamento e focar na meta final.", "is_optimal": true, "points": 15}, {"id": "choice_6_3", "text": "Comece a documentar o comportamento de Otávio e Renata para uma reunião de feedback formal pós-projeto.", "next_node_id": "node_final_neutral", "feedback": "Documentar é importante para futuras avaliações, mas focar nisso agora pode desviar sua atenção da resolução imediata do problema. A prioridade é salvar o projeto. A ação formal pode vir depois.", "is_optimal": false, "points": 5}, {"id": "choice_6_4", "text": "Comunique a outros stakeholders que o problema está sob controle e que a solução está em andamento, mantendo a confiança.", "next_node_id": "node_final_neutral", "feedback": "Gerenciar expectativas externas é importante, mas uma comunicação otimista demais pode gerar problemas se a solução não for entregue a tempo ou se a qualidade for comprometida. A verdade é que o controle é limitado.", "is_optimal": false, "points": 5}]}, {"id": "node_7", "type": "narrative", "title": "A Reta Final: Cedo ou Tarde, a Colaboração", "narrative": "Seja por sua mediação eficaz desde o início ou por um apelo final à responsabilidade, Otávio e Renata finalmente começam a trabalhar juntos. Embora a tensão não tenha desaparecido completamente, eles conseguem focar na tarefa. Horas se passam. A sala de reuniões se transforma em um centro de comando com café, água e lanches. Você está ao lado, oferecendo apoio, removendo impedimentos e monitorando o progresso. A cada linha de código corrigida, a cada teste de integração que passa, a esperança cresce. O bug é isolado e uma solução robusta é implementada e testada com sucesso. Faltam 2 horas para o lançamento.", "character_speaking": null, "is_ending": false, "ending_type": null, "score": null, "choices": [{"id": "choice_7_1", "text": "Parabenize-os pelo trabalho, reconheça o esforço em conjunto e sugira uma conversa pós-projeto para discutir as tensões.", "next_node_id": "node_final_good", "feedback": "Excelente! Reconhecer o esforço é fundamental para validar o trabalho árduo. Propor uma conversa estruturada pós-projeto demonstra que você se preocupa com o clima da equipe e busca uma solução de longo prazo para as diferenças, transformando um conflito em oportunidade de crescimento.", "is_optimal": true, "points": 30}, {"id": "choice_7_2", "text": "Apenas agradeça a eles pela entrega e os dispense, focando em comunicar o sucesso do lançamento aos stakeholders.", "next_node_id": "node_final_neutral", "feedback": "Embora a entrega seja crucial, ignorar completamente as tensões e o estresse que eles passaram pode ser percebido como falta de empatia. O problema foi resolvido, mas a raiz do conflito não foi tratada, o que pode levar a futuros atritos.", "is_optimal": false, "points": 10}, {"id": "choice_7_3", "text": "Informe-os que você relatará o incidente ao RH e seus superiores, destacando a dificuldade de gerenciar o conflito.", "next_node_id": "node_final_bad", "feedback": "Comunicações com RH e superiores sobre dificuldades são importantes, mas fazê-lo logo após uma resolução, e sem uma conversa prévia com os envolvidos, pode desmotivar a equipe e gerar um clima de desconfiança, especialmente após eles terem conseguido entregar o projeto. Parece uma punição em vez de um reconhecimento.", "is_optimal": false, "points": -10}]}, {"id": "node_final_good", "type": "ending", "title": "Desfecho Positivo: Projeto Salvo e Lições Aprendidas", "narrative": "O bug é corrigido a tempo, e o lançamento do SIGEC ocorre sem problemas. Você parabeniza Otávio e Renata, agradecendo o profissionalismo demonstrado na hora da verdade. Alguns dias depois, você agenda uma reunião de feedback com eles, individualmente e depois juntos. Você facilita um diálogo aberto sobre as diferentes abordagens e como podem colaborar melhor no futuro. Eles reconhecem suas falhas e se comprometem a melhorar a comunicação. O projeto foi um sucesso, e a equipe, embora tenha passado por uma crise, saiu dela mais forte e com um processo de colaboração aprimorado. Sua gestão do conflito não apenas salvou o projeto, mas também fortaleceu a equipe.", "character_speaking": null, "is_ending": true, "ending_type": "good", "score": 90, "choices": []}, {"id": "node_final_neutral", "type": "ending", "title": "Desfecho Neutro: O Projeto é Entregue, Mas com Cicatrizes", "narrative": "Apesar do clima tenso, a solução técnica é implementada e o SIGEC é lançado a tempo. O sucesso técnico é alcançado, mas o custo humano é evidente. Otávio e Renata evitam-se nos dias seguintes, e a comunicação entre eles se resume ao essencial. Sua decisão de priorizar a entrega sobre a resolução profunda do conflito, ou de escalar a situação sem uma mediação eficaz, garantiu o projeto, mas deixou um rastro de ressentimento na equipe. Será necessário um esforço considerável no futuro para reconstruir o relacionamento profissional deles e evitar que problemas semelhantes aconteçam novamente.", "character_speaking": null, "is_ending": true, "ending_type": "neutral", "score": 50, "choices": []}, {"id": "node_final_bad", "type": "ending", "title": "Desfecho Negativo: Projeto Comprometido e Crise na Equipe", "narrative": "Suas tentativas de gerenciar o conflito falharam. A discussão entre Otávio e Renata se aprofundou, a ponto de um deles se recusar a colaborar. O tempo se esgotou. O bug persiste, ou a solução implementada às pressas é instável. O lançamento do SIGEC precisa ser adiado, causando um grande prejuízo financeiro e de reputação para a empresa. A equipe está desmoralizada, Otávio e Renata estão em lados opostos, e a confiança mútua foi severamente abalada. Sua capacidade de liderança é questionada, e as consequências para sua carreira podem ser sérias. O clima organizacional está em frangalhos, e a Tech Solutions enfrenta uma crise de equipe e projeto.", "character_speaking": null, "is_ending": true, "ending_type": "bad", "score": 10, "choices": []}], "start_node_id": "node_1", "config": {"theme": "Conflito interpessoal entre dois especialistas seniores durante a entrega de um projeto crítico com prazo de 24 horas.", "objectives": "Avaliar a capacidade do aluno em mediar conflitos sob pressão, manter o foco na solução técnica e preservar o clima organizacional sem comprometer a entrega.", "audience": "Gestores e líderes de equipe de nível intermediário."}, "created_at": "2026-03-18T16:06:09.337676+00:00", "updated_at": "2026-03-18T16:06:09.337676+00:00"}, "style": {}, "startTime": 0, "animations": [{"id": "09350cc0-c092-4159-9210-13bdc6bc0026", "type": "entrance", "effect": "fade", "trigger": "withPrevious", "duration": 0.5, "delay": 0.3}]}], "annotations": [], "transition": {"type": "fade", "duration": 0.5}, "audio": [], "notes": "O instrutor deve observar se o aluno prioriza a solução do problema ou a punição dos envolvidos. O foco deve ser na mediação e resultado.", "librasScript": "Cenário: Conflito no time. Prazo acabando. Dois funcionários brigando. Você líder precisa resolver. Escolha melhor ação para projeto e equipe.", "duration": 5.0}, {"id": "9a722501-d9d8-4753-a966-3670c9ec4960", "title": "Quiz: Gestão de Crise", "order": 14, "width": 1920, "height": 820, "background": "#1c1917", "backgroundImage": null, "backgroundOpacity": null, "elements": [{"id": "b82ee848-23ee-4282-a12e-db67f639cfc3", "type": "html", "x": 0, "y": 0, "width": 1920, "height": 50, "htmlContent": "__B64__:PGRpdiBzdHlsZT0id2lkdGg6MTAwJTtoZWlnaHQ6MTAwJTtiYWNrZ3JvdW5kOiMxYzE5MTc7ZGlzcGxheTpmbGV4O2FsaWduLWl0ZW1zOmNlbnRlcjtwYWRkaW5nO nto de fechamento, mas também de início da aplicação prática. Incentive os alunos a revisitarem o conteúdo sempre que enfrentarem um desafio específico em um dos 5 pilares.", "librasScript": "Resumo final curso Liderança. 5 pilares principais: Comunicar bem, Motivar equipe, Decidir certo, Resolver conflitos e Ensinar liderados. Praticar todo dia para ser líder melhor. Parabéns!", "duration": 5.0}], "globalAudio": null, "questions": [{"id": "581dbb9b-0680-4919-9905-ccf86214d421", "type": "multiple_choice", "text": "Qual das seguintes atitudes melhor define um líder que prioriza a 'Influência' em vez da 'Autoridade'?", "alternatives": [{"id": "70f69a3e-1d6c-4de2-95e1-2c8db54aa0c6", "text": "Exigir o cumprimento rigoroso de horários sob pena de sanções administrativas.", "isCorrect": false}, {"id": "7ac3bebd-c4cb-4bcc-bad9-5a923c1a5f69", "text": "Tomar todas as decisões críticas sozinho para garantir a precisão técnica.", "isCorrect": false}, {"id": "a1041814-b1cc-4db3-b229-13cf5bff9b68", "text": "Explicar o 'porquê' das tarefas e conectar o esforço da equipe aos objetivos macro da empresa.", "isCorrect": true}, {"id": "22c1d888-bb36-4751-8e44-7de9ddf5a323", "text": "Limitar o acesso da equipe a informações estratégicas para manter o controle do grupo.", "isCorrect": false}], "explanation": "A resposta correta é a C, pois a influência baseia-se em dar significado ao trabalho. Quando o líder compartilha o propósito, ele gera engajamento intrínseco, ao passo que a autoridade pura foca apenas na obediência extrínseca.", "points": 1.0, "tags": ["O Líder do Século XXI"], "projectId": "860e245f-0ad1-4909-a30e-b220a421b75d", "createdAt": "2026-03-18T16:06:09.345180+00:00", "updatedAt": "2026-03-18T16:06:09.345191+00:00"}, {"id": "4e8a5ac5-1ede-409b-bdfb-8afff8869f3e", "type": "multiple_choice", "text": "Um gestor percebe que um colaborador talentoso cometeu um erro em um projeto importante. Qual a abordagem de um líder de impacto?", "alternatives": [{"id": "0d3fe94d-cb24-4c46-adec-39b37b616eb5", "text": "Repreender publicamente para que o erro não se repita com outros membros.", "isCorrect": false}, {"id": "da526806-7117-4e8e-8f44-aba9c6bb327b", "text": "Realizar uma sessão de feedback focada em aprendizado, analisando o processo para evitar futuras falhas.", "isCorrect": true}, {"id": "1ccc0d04-6976-4b5e-9107-5d07b2330db7", "text": "Ignorar o erro para não desmotivar o colaborador, corrigindo-o pessoalmente sem avisar.", "isCorrect": false}, {"id": "ae6ae526-d191-43a6-9fb6-64e1b432233f", "text": "Retirar as responsabilidades do colaborador imediatamente para proteger o projeto.", "isCorrect": false}], "explanation": "A alternativa B está correta porque líderes de impacto utilizam o erro como ferramenta pedagógica. Isso fortalece a segurança psicológica da equipe e promove a melhoria contínua de processos.", "points": 1.0, "tags": ["O Líder do Século XXI"], "projectId": "860e245f-0ad1-4909-a30e-b220a421b75d", "createdAt": "2026-03-18T16:06:09.345721+00:00", "updatedAt": "2026-03-18T16:06:09.345725+00:00"}, {"id": "4ec6a6b6-4301-40d7-917c-216c4351a0ba", "type": "multiple_choice", "text": "O que caracteriza a transição bem-sucedida do nível operacional para o nível de liderança?", "alternatives": [{"id": "d1e63e75-4088-4853-9a00-4b3cab400f89", "text": "Aumentar a carga horária de trabalho individual para garantir que nada falhe.", "isCorrect": false}, {"id": "cb6a75d2-7c1c-456e-b096-3fd2efa9472d", "text": "Tornar-se o maior especialista técnico da equipe em todas as frentes.", "isCorrect": false}, {"id": "74846b3f-8b4e-460d-8f26-20109f6bc469", "text": "Transferir o foco da execução direta para a facilitação do trabalho e remoção de barreiras para a equipe.", "isCorrect": true}, {"id": "2373898c-0190-4cd4-af65-6a08c428863b", "text": "Delegar apenas as tarefas que o líder não gosta de realizar.", "isCorrect": false}], "explanation": "A resposta correta é a C. O sucesso na liderança é medido pelo resultado da equipe. O papel do líder é ser um facilitador que provê recursos e estratégia, permitindo que os especialistas executem com excelência.", "points": 1.0, "tags": ["O Líder do Século XXI"], "projectId": "860e245f-0ad1-4909-a30e-b220a421b75d", "createdAt": "2026-03-18T16:06:09.346064+00:00", "updatedAt": "2026-03-18T16:06:09.346067+00:00"}, {"id": "5984dd4e-5f42-4411-9211-976433981ad4", "type": "multiple_choice", "text": "Qual das alternativas abaixo representa uma aplicação CORRETA do componente 'Comportamento' no modelo SCI?", "alternatives": [{"id": "f6749771-254c-44b4-9c71-48e02a7156d5", "text": "Você foi muito desatencioso com o cliente durante a ligação de ontem.", "isCorrect": false}, {"id": "fb5094a8-25e3-4df3-9d64-2d981b872f40", "text": "Eu senti que você não estava interessado em ajudar a equipe no projeto.", "isCorrect": false}, {"id": "2f8b3b69-def9-4c71-b4d9-8d2b17f80ba8", "text": "Você elevou o tom de voz e interrompeu o cliente duas vezes na reunião das 10h.", "isCorrect": true}, {"id": "a7dd2e30-5a6a-48fa-8650-8a621b0e75b3", "text": "Sua falta de comprometimento está prejudicando nossa entrega final.", "isCorrect": false}], "explanation": "A resposta correta é a C porque descreve uma ação observável ('elevou o tom de voz', 'interrompeu') sem atribuir adjetivos ou julgamentos de personalidade como 'desatencioso' ou 'falta de comprometimento'.", "points": 1.0, "tags": ["Comunicação e Influência"], "projectId": "860e245f-0ad1-4909-a30e-b220a421b75d", "createdAt": "2026-03-18T16:06:09.346444+00:00", "updatedAt": "2026-03-18T16:06:09.346450+00:00"}, {"id": "f61308be-1ed9-47dd-9415-551b6993fe40", "type": "multiple_choice", "text": "Sobre a técnica de Escuta Ativa, qual o principal objetivo do 'Espelhamento' (Mirroring) na comunicação entre líder e liderado?", "alternatives": [{"id": "6fbc2179-3669-4fa3-b65c-bb0a9a7d723c", "text": "Repetir exatamente tudo o que o outro diz para mostrar que você tem boa memória.", "isCorrect": false}, {"id": "a64781fe-46ce-462a-8b30-9260f4de6da6", "text": "Criar conexão e validar a mensagem, sinalizando que você está processando o que foi dito.", "isCorrect": true}, {"id": "da79713b-ecb2-4f84-96c0-da70a9f077d0", "text": "Imitar os gestos físicos do colaborador para intimidá-lo sutilmente.", "isCorrect": false}, {"id": "09b9ebd0-325d-43fe-8615-30f414a2c370", "text": "Garantir que a conversa termine mais rápido ao concordar com tudo o que é falado.", "isCorrect": false}], "explanation": "A resposta correta é a B. O espelhamento serve para criar rapport (sintonia) e mostrar ao liderado que suas palavras estão sendo ouvidas e valorizadas, facilitando a abertura para temas mais complexos.", "points": 1.0, "tags": ["Comunicação e Influência"], "projectId": "860e245f-0ad1-4909-a30e-b220a421b75d", "createdAt": "2026-03-18T16:06:09.346907+00:00", "updatedAt": "2026-03-18T16:06:09.346923+00:00"}, {"id": "ca43bc31-731c-4755-b2e0-e9720d0f76b1", "type": "multiple_choice", "text": "Um líder percebe um ruído de comunicação na equipe onde as diretrizes de um projeto foram mal interpretadas. Qual a primeira atitude recomendada?", "alternatives": [{"id": "e364cac4-6f86-41b0-9e9d-6dba44d7cfc1", "text": "Punir os responsáveis pelo erro para evitar que aconteça novamente.", "isCorrect": false}, {"id": "093cfe35-b5a8-4f2b-a7c5-c6ec2a36ee0f", "text": "Ignorar o ruído, pois os colaboradores devem ser autônomos para entender sozinhos.", "isCorrect": false}, {"id": "a0a1bca9-4b48-489c-81db-9950faa5a272", "text": "Utilizar a escuta ativa para identificar onde a mensagem divergiu e reformular a instrução com parafraseamento.", "isCorrect": true}, {"id": "6f99c39d-7bd0-4fca-8526-c7c0a53802fa", "text": "Enviar um e-mail longo para toda a empresa reforçando sua autoridade como líder.", "isCorrect": false}], "explanation": "A resposta correta é a C. Resolver ruídos exige identificar a falha no processo de transmissão/recepção. A escuta ativa ajuda a entender a interpretação da equipe e o parafraseamento garante que o novo alinhamento seja compreendido por todos.", "points": 1.0, "tags": ["Comunicação e Influência"], "projectId": "860e245f-0ad1-4909-a30e-b220a421b75d", "createdAt": "2026-03-18T16:06:09.347257+00:00", "updatedAt": "2026-03-18T16:06:09.347262+00:00"}, {"id": "75c4f873-284e-4b2e-8125-b64c1aeb0361", "type": "multiple_choice", "text": "Um líder identifica que sua equipe passa a maior parte do tempo resolvendo problemas urgentes e imprevistos (Quadrante 1). Qual deve ser a ação imediata para melhorar a performance?", "alternatives": [{"id": "a4e7995d-cc06-40b5-afa7-498fe4ba903e", "text": "Contratar mais pessoas para dividir a carga de urgências.", "isCorrect": false}, {"id": "56004732-df39-4773-90e7-597ca9b13d48", "text": "Auditar processos e investir tempo em atividades de planejamento (Quadrante 2).", "isCorrect": true}, {"id": "5fe33bf9-50e9-49e7-b59b-bd04b6d43570", "text": "Ignorar as urgências e focar apenas em novos projetos.", "isCorrect": false}, {"id": "6ada5b26-21de-46e1-a8a8-ff9d6083a8a1", "text": "Trabalhar horas extras para eliminar todas as pendências sozinho.", "isCorrect": false}], "explanation": "A resposta correta é a B porque o Quadrante 2 foca na causa raiz. Investir em planejamento e processos reduz a frequência de crises futuras no Quadrante 1.", "points": 1.0, "tags": ["Gestão de Conflitos e Decisão"], "projectId": "860e245f-0ad1-4909-a30e-b220a421b75d", "createdAt": "2026-03-18T16:06:09.347593+00:00", "updatedAt": "2026-03-18T16:06:09.347599+00:00"}, {"id": "cf116b58-0faf-45ac-a8d8-979ff5796aa4", "type": "multiple_choice", "text": "Durante um conflito entre dois colaboradores, qual é o papel primordial do líder assertivo?", "alternatives": [{"id": "9e1d8519-4bb4-4d11-9704-958f2a4aa81e", "text": "Decidir quem está certo e aplicar uma punição ao culpado.", "isCorrect": false}, {"id": "8d55248d-c852-4707-a103-9bf93ef0c3b6", "text": "Evitar o conflito e esperar que eles se resolvam sozinhos.", "isCorrect": false}, {"id": "ce88683b-5a51-4518-8cc9-e583e2315d53", "text": "Atuar como mediador, focando em interesses comuns e na solução do problema.", "isCorrect": true}, {"id": "b2d0e7dd-401f-4425-9461-5db76e011cc3", "text": "Transferir um dos colaboradores para outra equipe imediatamente.", "isCorrect": false}], "explanation": "A resposta correta é a C. A liderança de impacto busca a mediação para manter a coesão do time e focar no objetivo organizacional, transformando o conflito em oportunidade de melhoria.", "points": 1.0, "tags": ["Gestão de Conflitos e Decisão"], "projectId": "860e245f-0ad1-4909-a30e-b220a421b75d", "createdAt": "2026-03-18T16:06:09.347902+00:00", "updatedAt": "2026-03-18T16:06:09.347908+00:00"}, {"id": "04069438-6a87-44bb-b4f3-69fb7e454a92", "type": "multiple_choice", "text": "De acordo com a Matriz de Eisenhower, o que deve ser feito com tarefas urgentes, mas de baixa importância para os objetivos estratégicos?", "alternatives": [{"id": "49f65241-0187-4eb9-b85f-88381eff558f", "text": "Delegação para membros da equipe que podem se desenvolver com a tarefa.", "isCorrect": true}, {"id": "81af6db7-3639-45ee-9b17-b3803a33902b", "text": "Eliminação imediata, pois são perda de tempo.", "isCorrect": false}, {"id": "1c6ffa86-cf12-44be-b247-22bdf360f13b", "text": "Execução prioritária pelo próprio líder.", "isCorrect": false}, {"id": "75ce5de4-a3c4-44e6-bbfb-bd05412aba85", "text": "Agendamento para o final do mês.", "isCorrect": false}], "explanation": "A resposta correta é a A. Tarefas urgentes mas não importantes para o cargo do líder devem ser delegadas, promovendo autonomia e eficiência operacional.", "points": 1.0, "tags": ["Gestão de Conflitos e Decisão"], "projectId": "860e245f-0ad1-4909-a30e-b220a421b75d", "createdAt": "2026-03-18T16:06:09.348229+00:00", "updatedAt": "2026-03-18T16:06:09.348235+00:00"}]};
        
        // VLibras automatic translation helper
        // Uses Plugin.translate(text) which requires Unity player to be fully loaded
        var _vlibrasQueue = [];
        var _vlibrasPlayerLoaded = false;
        var _vlibrasSetupDone = false;
        
        function _processVLibrasQueue() {
            if (_vlibrasQueue.length > 0 && window.plugin && typeof window.plugin.translate === 'function') {
                var item = _vlibrasQueue[_vlibrasQueue.length - 1];
                _vlibrasQueue = [];
                setTimeout(function() {
                    try { window.plugin.translate(item.text); }
                    catch(e) { console.log('[VLibras] error:', e); }
                }, 1500);
            }
        }
        
        function _setupVLibrasWatcher() {
            if (_vlibrasSetupDone) return;
            _vlibrasSetupDone = true;
            var pollId = setInterval(function() {
                if (!window.plugin || !window.plugin.player) return;
                clearInterval(pollId);
                var player = window.plugin.player;
                if (typeof player.isLoaded === 'function' && player.isLoaded()) {
                    _vlibrasPlayerLoaded = true;
                    _processVLibrasQueue();
                    return;
                }
                if (typeof player.on === 'function') {
                    player.on('load', function() {
                        _vlibrasPlayerLoaded = true;
                        _processVLibrasQueue();
                    });
                }
                var canvasPoll = setInterval(function() {
                    if (_vlibrasPlayerLoaded) { clearInterval(canvasPoll); return; }
                    var wrapper = document.querySelector('[vw-plugin-wrapper]');
                    if (wrapper && wrapper.querySelector('canvas')) {
                        clearInterval(canvasPoll);
                        if (!_vlibrasPlayerLoaded) {
                            _vlibrasPlayerLoaded = true;
                            _processVLibrasQueue();
                        }
                    }
                }, 2000);
                setTimeout(function() { clearInterval(canvasPoll); }, 120000);
            }, 500);
            setTimeout(function() { clearInterval(pollId); }, 120000);
        }
        
        function translateWithVLibras(text, slideIndex) {
            if (!text) return;
            if (_vlibrasPlayerLoaded && window.plugin && typeof window.plugin.translate === 'function') {
                try { window.plugin.translate(text); }
                catch(e) { console.log('[VLibras] error:', e); }
            } else {
                _vlibrasQueue = [{ text: text, slideIndex: slideIndex }];
                _setupVLibrasWatcher();
            }
        }
        
        // Player module
        var Player = (function() {
            var course = null;
            var currentSlide = 0;
            var totalSlides = 0;
            var globalAudio = null;
            var slideAudios = [];
            var isMuted = false;
            var volume = 0.7;
            var sidebarOpen = false;

            var isPresentationMode = false;
            
            function init() {
                course = courseData;
                totalSlides = course.slides ? course.slides.length : 0;
                
                document.getElementById('total-slides').textContent = totalSlides;
                
                // Setup global audio
                if (course.globalAudio && course.globalAudio.src) {
                    globalAudio = new Audio(course.globalAudio.src);
                    globalAudio.loop = true;
                    globalAudio.volume = (course.globalAudio.volume || 0.5) * volume;
                }
                
                renderSidebar();
                renderSlide(0);
                updateProgress();
                
                // Show start overlay if there's any audio
                var hasAudio = (course.globalAudio && course.globalAudio.src);
                if (!hasAudio) {
                    // Check if any slide has audio
                    for (var i = 0; i < course.slides.length; i++) {
                        if (course.slides[i].audio && course.slides[i].audio.length > 0) {
                            hasAudio = true;
                            break;
                        }
                    }
                }
                
                if (hasAudio) {
                    showStartOverlay();
                }
                
                // Keyboard navigation

            function showStartOverlay() {

                document.body.appendChild(overlay);
                
                // Add styles for overlay
                var style = document.createElement('style');
                style.textContent = '.start-content{text-align:center;color:#fff;}.start-icon{font-size:60px;margin-bottom:20px;}.start-content h2{font-size:24px;margin-bottom:10px;}.start-content p{opacity:0.7;margin-bottom:20px;}.start-btn{background:linear-gradient(135deg,#7c3aed,#06b6d4);border:none;color:#fff;padding:15px 40px;border-radius:8px;font-size:18px;cursor:pointer;transition:transform 0.2s;}.start-btn:hover{transform:scale(1.05);}';
                document.head.appendChild(style);
            }
            
            function hideStartOverlay() {
                var overlay = document.getElementById('start-overlay');
                if (overlay) {
                    overlay.remove();
                    
                    // Start global audio
                    if (globalAudio) {
                        globalAudio.play().catch(function() {

                    }
                    
                    // Also try to play current slide audio
                    var slide = course.slides[currentSlide];
                    if (slide && slide.audio && slide.audio.length > 0) {
                        slide.audio.forEach(function(audioData) {
                            if (audioData.src) {
                                var audio = new Audio(audioData.src);
                                audio.volume = isMuted ? 0 : volume;
                                slideAudios.push(audio);
                                audio.play().catch(function() {});

                }
            }
            
            function renderSidebar() {
                var sidebar = document.getElementById('sidebar-content');
                var html = '';
                
                course.slides.forEach(function(slide, index) {
                    var isActive = index === currentSlide;
                    html += '<div class="sidebar-item ' + (isActive ? 'active' : '') + '" onclick="Player.goTo(' + index + ')">';
                    html += '<div class="sidebar-item-number">Slide ' + (index + 1) + '</div>';
                    html += '<div class="sidebar-item-title">' + (slide.title || 'Slide ' + (index + 1)) + '</div>';
                    html += '</div>';
                });
                
                sidebar.innerHTML = html;
            }
            
            function renderSlide(index) {
                currentSlide = index;
                var slide = course.slides[index];
                var container = document.getElementById('slide-container');
                
                // Notify AI Tutor of slide change
                if (typeof AiTutor !== 'undefined') { AiTutor.onSlideChange(index); }
                
                // Clear any existing timeline timers
                timelineTimers.forEach(function(timer) {

                // Stop previous audio

                });
                slideAudios = [];
                
                // Stop previous videos
                var prevVideos = container.querySelectorAll('video.local-video');
                prevVideos.forEach(function(video) {
                    if (video) {
                        video.pause();
                        video.currentTime = 0;
                    }
                });
                
                // Set dimensions
                var slideWidth = slide.width || 1920;
                var slideHeight = slide.height || 820;
                container.style.width = slideWidth + 'px';
                container.style.height = slideHeight + 'px';
                
                // Get slide duration for timeline - consider audio and video durations
                var slideDuration = slide.duration || 5;
                var maxMediaDuration = 0;
                if (slide.audio && slide.audio.length > 0) {

                        var audioEnd = (a.startTime || 0) + (a.duration || 0);
                        if (audioEnd > maxMediaDuration) maxMediaDuration = audioEnd;
                    });
                }
                if (slide.elements) {
                    slide.elements.forEach(function(el) {
                        if (el.type === 'video' || el.type === 'heygen') {
                            var videoEnd = (el.startTime || 0) + (el.duration || 0);
                            if (videoEnd > maxMediaDuration) maxMediaDuration = videoEnd;
                        }
                    });
                }
                if (maxMediaDuration > 0 && maxMediaDuration > slideDuration) {
                    slideDuration = maxMediaDuration + 1;
                }
                
                // Build slide HTML
                var html = '';
                
                // Background
                if (slide.backgroundImage) {
                    var bgOpacity = (slide.backgroundOpacity !== undefined && slide.backgroundOpacity !== null) ? slide.backgroundOpacity / 100 : 1;
                    html += '<img class="slide-background" src="' + slide.backgroundImage + '" alt="" style="opacity:' + bgOpacity + '">';
                    if (slide.background && slide.background !== '#fff') {
                        container.style.background = slide.background;
                    }
                } else {
                    container.style.background = slide.background || '#fff';
                }
                
                // Elements
                if (slide.elements) {
                    slide.elements.forEach(function(elem, elemIndex) {
                        if (elem.visible === false) return;
                        
                        // Check if element has timeline settings
                        var startTime = elem.startTime || 0;
                        var endTime = (elem.endTime !== undefined && elem.endTime !== null) ? elem.endTime : slideDuration;
                        
                        // Check element type
                        var isClipElement = elem.type === 'animation_clip';
                        var isMaskElement = elem.type === 'animation_mask';
                        var isHighlightElement = elem.type === 'animation_highlight';
                        var isAnimationElement = isClipElement || isMaskElement || isHighlightElement;
                        
                        // Check if element has animations (support both arrays and single object)
                        var anims = (elem.animations && elem.animations.length > 0) ? elem.animations : [];
                        if (!anims.length && elem.animation && elem.animation.effect) {
                            anims = [{
                                type: elem.animation.type || 'entrance',
                                effect: elem.animation.effect,
                                duration: elem.animation.duration || 0.5,
                                startTime: elem.animation.delay || 0,
                            }];
                        }
                        var hasAnimations = anims.length > 0;
                        var hasEntranceAnimation = hasAnimations && anims.some(function(a) { return a.type === 'entrance'; });
                        
                        // Determine initial visibility
                        // For clips/masks: they should START VISIBLE (to cover content)

                        var initiallyHidden = false;

                            // Clips and masks should start VISIBLE
                            initiallyHidden = false;
                        } else if (startTime > 0 || hasEntranceAnimation) {

                        var style = 'left:' + (elem.x || 0) + 'px;';
                        style += 'top:' + (elem.y || 0) + 'px;';
                        style += 'width:' + (elem.width || 100) + 'px;';
                        style += 'height:' + (elem.height || 100) + 'px;';
                        style += 'z-index:' + ((elem.zIndex || 0) + 1) + ';';
                        if (elem.rotation) style += 'transform:rotate(' + elem.rotation + 'deg);';
                        
                        // Handle opacity based on element type
                        if (isClipElement || isMaskElement) {
                            // Clips and masks: start visible/opaque
                            var maskOpacity = (elem.style && elem.style.opacity !== undefined) ? elem.style.opacity : 1;
                            style += 'opacity:' + maskOpacity + ';';
                        } else if (!hasAnimations && elem.style && elem.style.opacity !== undefined) {
                            style += 'opacity:' + elem.style.opacity + ';';
                        } else if (initiallyHidden) {
                            style += 'visibility:hidden;opacity:0;';
                        }
                        
                        html += '<div class="slide-element ' + elem.type + '-element" id="element-' + elemIndex + '" data-start-time="' + startTime + '" data-end-time="' + endTime + '" style="' + style + '">';
                        
                        if (elem.type === 'text') {
                            var textStyle = '';
                            if (elem.style) {
                                if (elem.style.fontSize) textStyle += 'font-size:' + elem.style.fontSize + 'px;';
                                if (elem.style.fontFamily) textStyle += 'font-family:' + elem.style.fontFamily + ',sans-serif;';
                                if (elem.style.fontColor) textStyle += 'color:' + elem.style.fontColor + ';';
                                if (elem.style.fontWeight) textStyle += 'font-weight:' + elem.style.fontWeight + ';';
                                if (elem.style.textAlign) textStyle += 'text-align:' + elem.style.textAlign + ';';
                                // Apply background color (transparent or custom)
