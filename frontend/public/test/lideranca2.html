        .slide-background {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: fill; /* Fill to match PPT slide proportions - same as SCORM */
        }
        
        .slide-element {
            position: absolute;
            transition: opacity 0.3s ease;
            overflow: hidden;
        }
        
        .slide-element.text-element {
            padding: 10px;
            overflow: hidden;
            background: transparent;
            border-radius: 0;
        }
        
        .slide-element.shape-element {
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
        }
        
        .slide-element.animation_mask-element {
            position: absolute;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
        
        .slide-element.animation_clip-element {
            position: absolute;
            pointer-events: none;
            overflow: hidden;
        }
        
        .slide-element.animation_clip-element .animation-clip {
            transition: opacity 0.5s ease, backdrop-filter 0.5s ease;
        }
        
        .slide-element.animation_highlight-element {
            position: absolute;
            pointer-events: none;
            box-sizing: border-box;
        }
        
        .slide-element.image-element img {
            width: 100%;
            height: 100%;
            /* object-fit is set inline per element */
        }
        
        .slide-element.video-element {
            background: transparent;
            border-radius: 0;
            overflow: hidden;
            position: relative;
        }
        
        .slide-element.video-element .video-embed-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        .slide-element.video-element video,
        .slide-element.video-element iframe {
            width: 100%;
            height: 100%;
            border: 0;
            background: transparent;
        }
        
        /* WebM videos with alpha channel transparency */
        .slide-element.video-element video {
            /* object-fit is set inline per element */
            background-color: transparent !important;
        }
        
        .slide-element.button-element {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .slide-element.button-element a {

            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;

        .button-primary {

        .button-outline {

        #controls {

        .progress-container {

        .progress-dots {

        .progress-dot:hover {

        .progress-dot.active {
            background: #06b6d4;

        .progress-dot.completed {

        }
        
        .volume-control {

            align-items: center;

        .volume-slider {

            background: #06b6d4;

        /* SVG Annotations */
        .annotations-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 100;
        }
        
        /* Mobile orientation overlay */
        #orientation-overlay {
            display: none;
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            z-index: 99999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        
        /* Force display on mobile portrait mode - JS controlled, dismissable */
        @media screen and (orientation: portrait) and (max-width: 900px) {
            /* JS controls overlay display */
        }
        
        /* Also detect by aspect ratio for devices that don't report orientation correctly */
        @media screen and (max-aspect-ratio: 4/5) and (max-width: 900px) {
            /* JS controls overlay display */
        }
        
        /* Extra aggressive detection for very tall screens (phones in portrait) */
        @media screen and (max-aspect-ratio: 7/10) {
            /* JS controls overlay display */
        }
        
        /* Override for landscape - always hide overlay */
        @media screen and (orientation: landscape) {
            #orientation-overlay {
                display: none !important;

            #player-container {

        /* Override for wide screens - always hide overlay */
        @media screen and (min-aspect-ratio: 10/9) {

                display: none !important;

            #player-container {
                display: flex !important;

        .orientation-content {
            text-align: center;
            padding: 30px;
            color: white;
            max-width: 90%;
        }
        
        .orientation-icon {
            font-size: 70px;
            margin-bottom: 10px;
            animation: shake 1.5s ease-in-out infinite;
        }
        
        .orientation-arrow {
            font-size: 50px;
            color: #7c3aed;
            margin-bottom: 15px;
            animation: rotate-hint 2s ease-in-out infinite;
        }
        
        @keyframes rotate-hint {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
        }
        
        @keyframes shake {
            0%, 100% { transform: rotate(-10deg); }
            50% { transform: rotate(10deg); }
        }
        
        .orientation-content h2 {
            font-size: 24px;
            margin-bottom: 12px;

        }

            font-size: 14px;

            margin: 0 auto 25px auto;
        }
        
        .orientation-hint {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
        }
        
        .phone-icon {
            font-size: 40px;
            transition: all 0.3s ease;
        }
        
        .phone-icon.vertical {
            opacity: 0.5;
        }
        
        .phone-icon.horizontal {
            transform: rotate(90deg);
            color: #7c3aed;
        }
        
        .orientation-hint .arrow {
            font-size: 24px;
            color: #7c3aed;
            animation: pulse-arrow 1s ease-in-out infinite;
        }
        
        @keyframes pulse-arrow {
            0%, 100% { transform: translateX(0); opacity: 1; }
            50% { transform: translateX(10px); opacity: 0.5; }
        }
        
        /* Continue in portrait button */
        .continue-portrait-btn {
            margin-top: 25px;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.3);
            color: #94a3b8;
            padding: 12px 28px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .continue-portrait-btn:hover,
        .continue-portrait-btn:active {
            background: rgba(255,255,255,0.1);
            color: #fff;
            border-color: rgba(255,255,255,0.5);
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes fadeOut {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(-10px); }
        }
        
        /* PowerPoint Animation Effects */
        @keyframes ppt-appear {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes ppt-fade {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes ppt-fly-left {
            from { opacity: 0; transform: translateX(-100%); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        @keyframes ppt-fly-right {
            from { opacity: 0; transform: translateX(100%); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        @keyframes ppt-fly-top {
            from { opacity: 0; transform: translateY(-100%); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes ppt-fly-bottom {
            from { opacity: 0; transform: translateY(100%); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes ppt-zoom {
            from { opacity: 0; transform: scale(0.3); }
            to { opacity: 1; transform: scale(1); }
        }
        
        @keyframes ppt-grow {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }
        
        @keyframes ppt-shrink {
            from { transform: scale(1.5); }
            to { transform: scale(1); }
        }
        
        @keyframes ppt-spin {
            from { opacity: 0; transform: rotate(-360deg) scale(0.5); }
            to { opacity: 1; transform: rotate(0deg) scale(1); }
        }
        
        @keyframes ppt-swivel {
            from { opacity: 0; transform: rotateY(-90deg); }
            to { opacity: 1; transform: rotateY(0deg); }
        }
        
        @keyframes ppt-bounce {
            0% { opacity: 0; transform: translateY(-100%); }
            50% { transform: translateY(10%); }
            70% { transform: translateY(-5%); }
            100% { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes ppt-float {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes ppt-wipe-left {
            from { clip-path: inset(0 100% 0 0); }
            to { clip-path: inset(0 0 0 0); }
        }
        
        @keyframes ppt-wipe-right {
            from { clip-path: inset(0 0 0 100%); }
            to { clip-path: inset(0 0 0 0); }
        }
        
        @keyframes ppt-wipe-top {
            from { clip-path: inset(100% 0 0 0); }
            to { clip-path: inset(0 0 0 0); }
        }
        
        @keyframes ppt-wipe-bottom {
            from { clip-path: inset(0 0 100% 0); }
            to { clip-path: inset(0 0 0 0); }
        }
        
        @keyframes ppt-blinds {
            from { opacity: 0; clip-path: polygon(0% 0%, 10% 0%, 10% 100%, 0% 100%, 0% 0%, 20% 0%, 20% 100%, 30% 0%, 30% 100%, 40% 0%, 40% 100%, 50% 0%, 50% 100%); }
            to { opacity: 1; clip-path: polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%); }
        }
        
        @keyframes ppt-emphasis-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        @keyframes ppt-emphasis-teeter {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(3deg); }
            75% { transform: rotate(-3deg); }
        }
        
        @keyframes ppt-exit-fade {
            from { opacity: 1; }
            to { opacity: 0; }
        }
        
        @keyframes ppt-exit-fly {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(-100%); }
        }
        
        @keyframes ppt-exit-zoom {
            from { opacity: 1; transform: scale(1); }
            to { opacity: 0; transform: scale(0.3); }
        }
        
        /* Presentation Mode - Fullscreen optimized */
        .presentation-mode #slide-wrapper {

    <!-- Mobile Orientation Overlay -->
    <div id="orientation-overlay">
        <div class="orientation-content">
            <div class="orientation-icon">📱</div>
            <div class="orientation-arrow">↻</div>
            <h2>Rotacione seu dispositivo</h2>
            <p>Para uma melhor experiência, por favor visualize este conteúdo no modo horizontal (paisagem)</p>
            <div class="orientation-hint">
                <span class="phone-icon vertical">📱</span>
                <span class="arrow">→</span>

para o relatório estratégico anual se aproximando rapidamente.", "characters": [{"name": "Ana Lúcia", "role": "Gerente de Projetos", "personality": "Conscienciosa, detalhista e com forte ética de trabalho, mas ainda relutante em abandonar completamente as tarefas operacionais que a fizeram ser promovida. Sente a pressão de ser a 'melhor em tudo'.", "avatar_description": "Mulher de 30 e poucos anos, vestindo roupas de escritório smart casual. Expressão de concentração e um leve cansaço."}, {"name": "Helena Ribeiro", "role": "Diretora de Operações", "personality": "Experiente, estratégica e exigente, valoriza a autonomia e o desenvolvimento da liderança em sua equipe. Espera resultados e proatividade.", "avatar_description": "Mulher de 40 e poucos anos, com um ar confiante e profissional. Veste um blazer elegante e tem uma postura firme."}, {"name": "Lucas Silva", "role": "Analista Sênior de Projetos", "personality": "Ambicioso, inteligente e proativo, demonstra grande potencial para assumir mais responsabilidades. Busca oportunidades de crescimento e desafios.", "avatar_description": "Homem de 20 e poucos anos, aparência entusiasmada e engajada. Usa uma camisa polo e um crachá de identificação."}], "learning_objectives": ["Identificar o momento ideal para delegar tarefas técnicas.", "Compreender os benefícios da delegação para o desenvolvimento da equipe e o foco estratégico do líder.", "Avaliar as consequências de manter-se excessivamente operacional em uma posição de liderança."], "competencies_evaluated": ["Delegação eficaz", "Pensamento estratégico", "Gestão de tempo e prioridades", "Desenvolvimento de equipe"], "nodes": [{"id": "node_1", "type": "narrative", "title": "A Pressão do Relatório Estratégico", "narrative": "É uma segunda-feira agitada na InovaTech. Você está imersa na revisão de um código crucial, uma tarefa que deveria ter sido delegada, mas você quis garantir a 'qualidade'. De repente, seu telefone toca. É Helena Ribeiro.\n\n\"Ana, bom dia! Gostaria de saber o status do relatório estratégico do departamento. Precisamos finalizá-lo até o fim da semana para a reunião com a diretoria executiva. Você tem alguma prévia para me mostrar?\" Helena pergunta com um tom que não admite atrasos.", "character_speaking": "Helena Ribeiro", "is_ending": false, "ending_type": null, "score": null, "choices": [{"id": "choice_1_1", "text": "“Sim, Helena, o relatório estratégico está em andamento. Mas confesso que estou um pouco atrasada, envolvida em algumas finalizações técnicas.\" (Admite o problema, mas a causa)", "next_node_id": "node_2", "feedback": "Você foi honesta sobre o atraso e sua causa. Isso é um bom começo para identificar a raiz do problema: sua dificuldade em se afastar das tarefas técnicas.", "is_optimal": false, "points": 5}, {"id": "choice_1_2", "text": "“O relatório estratégico é minha prioridade, Helena. Preciso otimizar a delegação das tarefas técnicas para focar nele.\" (Aborda diretamente a necessidade de delegação)", "next_node_id": "node_3", "feedback": "Excelente! Você demonstrou clareza sobre o papel estratégico e a necessidade de delegação, reconhecendo que a solução passa por ajustar sua própria atuação.", "is_optimal": true, "points": 15}, {"id": "choice_1_3", "text": "“Não se preocupe, Helena. Vou virar a noite se for preciso para entregar no prazo.\" (Promete resolver com esforço pessoal, sem delegação)", "next_node_id": "node_4", "feedback": "Cuidado! Embora demonstrar comprometimento seja positivo, essa resposta indica uma tendência a resolver problemas com sobrecarga pessoal, em vez de buscar soluções de gestão sustentáveis como a delegação. Isso pode levar a erros e esgotamento.", "is_optimal": false, "points": -5}, {"id": "choice_1_4", "text": "“Helena, peço um dia extra. Estou com muitos detalhes operacionais para fechar.\" (Pede prazo extra sem plano claro de ação)", "next_node_id": "node_5", "feedback": "Pedir mais tempo sem apresentar um plano de como esse tempo será usado para resolver a causa-raiz do problema (a sobrecarga operacional) é arriscado. Isso pode passar a impressão de falta de organização e proatividade.", "is_optimal": false, "points": -10}]}, {"id": "node_2", "type": "narrative", "title": "A Busca por um Sucessor nas Tarefas Técnicas", "narrative": "Helena ouve sua explicação com atenção. \"Entendo, Ana. Mas lembre-se, seu foco agora é estratégico. Quem da sua equipe poderia assumir essas finalizações técnicas com autonomia?\", ela questiona. Você pensa em Lucas, um analista sênior promissor que sempre demonstrou interesse em novos desafios. Ele tem sido bastante proativo ultimamente.", "character_speaking": "Helena Ribeiro", "is_ending": false, "ending_type": null, "score": null, "choices": [{"id": "choice_2_1", "text": "Chamar Lucas e delegar imediatamente o relatório de análise de dados, um componente técnico crítico, confiando em sua capacidade.", "next_node_id": "node_6A", "feedback": "Delegação rápida e de uma tarefa importante demonstra confiança e urgência. É um risco calculado que pode acelerar o desenvolvimento de Lucas e liberar seu tempo rapidamente.", "is_optimal": true, "points": 15}, {"id": "choice_2_2", "text": "Chamar Lucas e pedir que ele comece assumindo a revisão dos dashboards mensais, uma tarefa menos crítica, para testá-lo antes de delegar algo maior.", "next_node_id": "node_6B", "feedback": "Esta é uma abordagem mais cautelosa. Embora reduza o risco imediato, pode atrasar a sua liberação para o foco estratégico e pode não desafiar Lucas o suficiente.", "is_optimal": false, "points": 5}, {"id": "choice_2_3", "text": "Dizer a Lucas que está sobrecarregada e que conversará com ele sobre delegação 'quando tiver um tempo'.", "next_node_id": "node_5", "feedback": "Ao adiar a conversa e a delegação, você perde uma oportunidade valiosa de agir proativamente e demonstra falta de planejamento. O tempo é crucial agora.", "is_optimal": false, "points": -10}]}, {"id": "node_3", "type": "narrative", "title": "O Reforço da Visão Estratégica", "narrative": "Helena sorri. \"Excelente, Ana! É exatamente essa proatividade que espero de um líder. Lembre-se, seu tempo é valioso demais para ser gasto em detalhes operacionais que sua equipe é capaz de executar. Quem você considera apto a assumir essa frente técnica?\" Você imediatamente pensa em Lucas.", "character_speaking": "Helena Ribeiro", "is_ending": false, "ending_type": null, "score": null, "choices": [{"id": "choice_3_1", "text": "Chamar Lucas e empoderá-lo para liderar a entrega do relatório de análise de dados, oferecendo-se para dar orientação, mas deixando a execução em suas mãos.", "next_node_id": "node_6A", "feedback": "Essa é uma delegação eficaz e empoderadora. Você não apenas transfere a tarefa, mas também a responsabilidade e a autoridade, promovendo o desenvolvimento de Lucas e liberando seu próprio tempo para a estratégia.", "is_optimal": true, "points": 20}, {"id": "choice_3_2", "text": "Dizer a Helena que vai começar a treinar Lucas na análise de dados, mas que o relatório estratégico você mesma finalizará por enquanto, para garantir a qualidade.", "next_node_id": "node_6B", "feedback": "Embora o treinamento seja importante, 'finalizar por enquanto' demonstra uma dificuldade em desapegar-se da operação. Isso atrasa seu foco estratégico e pode sobrecarregar você desnecessariamente.", "is_optimal": false, "points": 0}]}, {"id": "node_4", "type": "narrative", "title": "A Consequência da Sobrecarga", "narrative": "Você passa a semana virando noites. Consegue entregar o relatório estratégico no prazo, mas com um cansaço visível e algumas seções que poderiam ter sido mais aprofundadas. Helena analisa o documento com uma expressão séria.\n\n\"Ana, a entrega foi no prazo, e agradeço seu esforço. No entanto, sinto que a profundidade estratégica e a visão de futuro esperadas para o seu nível ainda não estão totalmente presentes. É importante que você encontre um modo de se dedicar integralmente a isso, sem se exaurir.\"", "character_speaking": "Helena Ribeiro", "is_ending": false, "ending_type": null, "score": null, "choices": [{"id": "choice_4_1", "text": "“Helena, foi realmente um sacrifício. Não consegui me aprofundar como queria, mas aprendi a lição. Vou começar a delegar imediatamente as tarefas técnicas.\" (Admira o erro e se compromete a mudar)", "next_node_id": "node_final_neutral", "feedback": "Você reconheceu seu erro e se comprometeu a mudar, o que é positivo. No entanto, o impacto de uma entrega estratégica 'rasa' já foi sentido. É um aprendizado tardio que custou uma oportunidade de brilhar.", "is_optimal": false, "points": 10}, {"id": "choice_4_2", "text": "“Ainda estou me adaptando à função, Helena. Com o tempo, consigo conciliar tudo e entregar com mais profundidade.\" (Minimiza o problema e evita ação imediata)", "next_node_id": "node_final_bad", "feedback": "Minimizar o problema e adiar a ação não resolverá a questão da sobrecarga e da falta de foco estratégico. Essa postura pode levar a um ciclo vicioso de entregas medianas e insatisfação da liderança.", "is_optimal": false, "points": -15}]}, {"id": "node_5", "type": "narrative", "title": "A Reunião do Prazo Perdido", "narrative": "O prazo para o relatório estratégico passou. Você não conseguiu avançar significativamente, pois as tarefas operacionais consumiram todo o seu tempo. Helena a chama para uma conversa. Ela está visivelmente frustrada.\n\n\"Ana, o relatório estratégico não foi entregue. Isso é inaceitável para a posição que você ocupa. Precisamos entender o que está acontecendo. Você precisa de ajuda ou há algo que não estou percebendo na sua transição para a gestão?\"", "character_speaking": "Helena Ribeiro", "is_ending": false, "ending_type": null, "score": null, "choices": [{"id": "choice_5_1", "text": "“Helena, percebi que não consigo manter o ritmo operacional e o estratégico. Preciso mudar minha abordagem e delegar imediatamente. Tenho um plano para envolver Lucas.\" (Realização tardia, mas com um plano de ação)", "next_node_id": "node_6C", "feedback": "Você finalmente reconheceu o problema e propôs uma solução, o que é um passo importante. Contudo, o dano à sua credibilidade e ao prazo já foi feito. Você terá que trabalhar duro para recuperar a confiança.", "is_optimal": false, "points": 0}, {"id": "choice_5_2", "text": "“Helena, a carga de trabalho operacional é insustentável para uma pessoa só. Preciso de mais um membro na equipe para me ajudar.\" (Transferir responsabilidade sem resolver a questão da delegação pessoal)", "next_node_id": "node_final_bad", "feedback": "Atribuir a falha à falta de recursos, sem antes demonstrar sua própria capacidade de gerenciar e delegar, é uma postura que transfere a responsabilidade. Isso pode sinalizar para a liderança que você não está apta a gerenciar a equipe existente de forma eficaz.", "is_optimal": false, "points": -20}]}, {"id": "node_6A", "type": "narrative", "title": "Delegação Empoderada e Foco Estratégico", "narrative": "Você senta com Lucas. Ele recebe a tarefa de liderar o relatório de análise de dados com entusiasmo, um brilho nos olhos. Você passa as orientações, define os marcos de entrega e se coloca à disposição para dúvidas, mas deixa claro que a execução e a responsabilidade são dele. Nas próximas semanas, você consegue dedicar-se integralmente ao relatório estratégico, que ganha profundidade e insights valiosos. Lucas, por sua vez, cresce rapidamente na responsabilidade, e a equipe percebe a transição da sua liderança.", "character_speaking": "Ana Lúcia", "is_ending": false, "ending_type": null, "score": null, "choices": [{"id": "choice_6A_1", "text": "Agendar reuniões semanais de feedback com Lucas, focando no desenvolvimento das suas habilidades de liderança e autonomia, e buscando novas formas de empoderar a equipe.", "next_node_id": "node_final_good", "feedback": "Excelente! Você não apenas delegou, mas também investiu no desenvolvimento do seu sucessor, criando um ciclo virtuoso de crescimento para a equipe e para você como líder. Isso reforça sua visão estratégica.", "is_optimal": true, "points": 25}, {"id": "choice_6A_2", "text": "Deixar Lucas trabalhar, confiando que ele virá com dúvidas se precisar, e focar em outras responsabilidades estratégicas que surgiram.", "next_node_id": "node_final_neutral", "feedback": "Embora a confiança seja boa, uma delegação totalmente 'hands-off' pode deixar lacunas no desenvolvimento e na qualidade do trabalho se não houver um acompanhamento estruturado. É um risco que pode levar a um resultado 'bom o suficiente', mas não excelente.", "is_optimal": false, "points": 5}]}, {"id": "node_6B", "type": "narrative", "title": "Delegação Parcial e o Peso Operacional", "narrative": "Você delega as tarefas menores para Lucas, que as executa com competência, mas você ainda se encontra envolvida em revisões e pequenos ajustes operacionais. O relatório estratégico avança, mas mais lentamente do que o esperado. Helena a aborda novamente, dias antes da data final de entrega do relatório.\n\n\"Ana, estou acompanhando o progresso do relatório. Vejo que ainda está se aprofundando em muitos detalhes técnicos. Preciso que você libere mais tempo para a análise estratégica profunda. O que posso fazer para te ajudar a focar?\"", "character_speaking": "Helena Ribeiro", "is_ending": false, "ending_type": null, "score": null, "choices": [{"id": "choice_6B_1", "text": "“Helena, estou progredindo na delegação, mas admito que foi mais lento que o ideal. Vou acelerar o processo e transferir mais responsabilidades técnicas para Lucas e a equipe esta semana.\" (Reconhece o atraso e se compromete a acelerar)", "next_node_id": "node_final_neutral", "feedback": "Você reconheceu a lentidão e se comprometeu a corrigir o curso. Isso é um sinal positivo de aprendizado, mas o atraso já impactou o tempo disponível para a estratégia e a percepção de Helena.", "is_optimal": false, "points": 5}, {"id": "choice_6B_2", "text": "“Ainda preciso acompanhar de perto as tarefas técnicas para garantir a qualidade. A estratégia vem em seguida.\" (Resiste à delegação total, priorizando a operação)", "next_node_id": "node_final_bad", "feedback": "Essa postura demonstra uma resistência contínua à transição para o papel estratégico. A obsessão pela 'qualidade' em tarefas operacionais que poderiam ser delegadas impede seu crescimento e a entrega do valor esperado para sua posição de liderança.", "is_optimal": false, "points": -15}]}, {"id": "node_6C", "type": "narrative", "title": "A Última Cartada: Delegação Tardia", "narrative": "Você senta com Lucas, explicando a urgência da situação e seu plano para que ele assuma as principais tarefas operacionais imediatamente. Lucas, embora um pouco surpreso pela repentina mudança, aceita o desafio. Ele demonstra alguma insegurança inicial, mas sua atitude é de esforço. Você consegue liberar algum tempo, mas o atraso já é significativo para a análise estratégica. O relatório é entregue no limite, com partes importantes ainda em rascunho.", "character_speaking": "Ana Lúcia", "is_ending": false, "ending_type": null, "score": null, "choices": [{"id": "choice_6C_1", "text": "“Lucas, sei que é em cima da hora, mas preciso que você me ajude a reestruturar a carga operacional. Vamos definir prioridades juntos e te darei autonomia total em algumas áreas. Conto com você.\" (Delegação com foco e apoio, apesar do atraso)", "next_node_id": "node_final_neutral", "feedback": "Mesmo tardia, sua decisão de delegar com clareza e apoio a Lucas é um passo na direção certa. Você conseguiu minimizar um desastre, mas o impacto do atraso e da sobrecarga inicial ainda se fará sentir.", "is_optimal": false, "points": 5}, {"id": "choice_6C_2", "text": "“Lucas, estou sobrecarregada. Pegue o que puder do meu prato, por favor. Qualquer coisa me pergunte.\" (Delegação sem estrutura e sem empoderamento)", "next_node_id": "node_final_bad", "feedback": "Delegar sem clareza, estrutura ou empoderamento é pedir por problemas. Lucas pode ficar perdido, e você pode acabar com mais trabalho para corrigir ou refazer, além de desmotivar sua equipe. Uma delegação eficaz exige mais do que apenas 'passar o trabalho'.", "is_optimal": false, "points": -15}]}, {"id": "node_final_good", "type": "ending", "title": "Desfecho Positivo: Líder Estratégica e Equipe Forte", "narrative": "O relatório estratégico é apresentado à diretoria com grande sucesso. Seus insights e a visão de futuro são elogiados. Helena a parabeniza pessoalmente: \"Ana, estou orgulhosa do seu trabalho e da sua evolução como líder. Você não apenas entregou um relatório excepcional, mas também desenvolveu Lucas, que agora está pronto para novos desafios. É assim que um verdadeiro líder atua!\". Sua equipe está mais engajada, Lucas se tornou um pilar e você, Ana, finalmente se sente uma líder completa, focada no que realmente importa: a estratégia e o desenvolvimento de pessoas.", "character_speaking": "Helena Ribeiro", "is_ending": true, "ending_type": "good", "score": 95, "choices": []}, {"id": "node_final_neutral", "type": "ending", "title": "Desfecho Neutro: Equilíbrio Encontrado (Com Esforço Extra)", "narrative": "Você consegue entregar o relatório estratégico, mas com algumas seções que poderiam ter sido mais aprofundadas, resultado da demora em delegar totalmente. Helena reconhece seu esforço, mas sinaliza a necessidade de mais proatividade. \"Ana, o relatório foi aceitável, e agradeço seu empenho. No entanto, em um futuro próximo, espero ver mais profundidade e agilidade em sua visão estratégica. O caminho é a delegação proativa. Continue desenvolvendo Lucas e sua equipe.\" Você aprendeu a lição, mas o custo foi alto em termos de estresse e uma oportunidade perdida de impressionar totalmente.", "character_speaking": "Helena Ribeiro", "is_ending": true, "ending_type": "neutral", "score": 60, "choices": []}, {"id": "node_final_bad", "type": "ending", "title": "Desfecho Ruim: Sobrecarga e Descredibilidade", "narrative": "O relatório estratégico é entregue com atraso ou com qualidade insatisfatória, ou nem chega a ser entregue. Sua imagem como líder é abalada. Helena a chama para uma conversa séria: \"Ana, sua incapacidade de delegar e focar na estratégia está impactando a equipe e os resultados. Não vimos a liderança proativa que esperávamos. Precisamos rever suas prioridades e seu papel aqui na InovaTech.\" Você se sente sobrecarregada, desmotivada e com sua posição em risco. A equipe percebe sua dificuldade, e Lucas, desestimulado, começa a buscar novas oportunidades.", "character_speaking": "Helena Ribeiro", "is_ending": true, "ending_type": "bad", "score": 25, "choices": []}], "start_node_id": "node_1", "config": {"theme": "Delegação e Transição de Carreira", "objectives": "Capacitar o aluno a identificar o momento de delegar tarefas técnicas para focar na gestão estratégica da equipe.", "audience": "Gestores de primeira viagem e líderes intermediários que sofrem com sobrecarga operacional."}, "created_at": "2026-03-18T16:00:34.388144+00:00", "updated_at": "2026-03-18T16:00:34.388144+00:00"}, "style": {}, "startTime": 0, "animations": [{"id": "5c013818-564f-41aa-9f5f-f1f1e86ca1b2", "type": "entrance", "effect": "fade", "trigger": "withPrevious", "duration": 0.5, "delay": 0.3}]}], "annotations": [], "transition": {"type": "fade", "duration": 0.5}, "audio": [], "notes": "O cenário deve levar o aluno a perceber que o microgerenciamento causa gargalos no fluxo de trabalho.", "librasScript": "AGORA PRÁTICA. VOCÊ É LÍDER. MUITA TAREFA TÉCNICA E EQUIPE PRECISA VOCÊ. VOCÊ DELEGA OU FAZ TUDO SOZINHO? ESCOLHA.", "duration": 5.0}, {"id": "b261866f-3b50-4567-929b-693b7c477ecf", "title": "Verificação de Fundamentos", "order": 3, "width": 1920, "height": 820, "background": "#1c1917", "backgroundImage": null, "backgroundOpacity": null, "elements": [{"id": "cfb6a13d-606a-4bb0-84e1-f258c94e5603", "type": "html", "x": 0, "y": 0, "width": 1920, "height": 50, "htmlContent": "__B64__:PGRpdiBzdHlsZT0id2lkdGg6MTAwJTtoZWlnaHQ6 cyBkZSBmZWVkYmFjaywgZXNjdXRhIGF0aXZhIGUgcGxhbmVqYW1lbnRvIGNvbGFib3JhdGl2by48L3A+CjwvZGl2Pg==", "style": {}, "startTime": 0, "animations": [{"id": "397debc2-a9ad-49b1-8ba1-0053a22d0767", "type": "entrance", "effect": "fade", "trigger": "withPrevious", "duration": 0.5, "delay": 0.1}]}, {"id": "f5d455e2-a20e-4c90-9f6f-51039971dc30", "type": "scenario", "x": 160, "y": 270, "width": 1600, "height": 520, "content": "322324b8-c5fc-4133-83df-bece34a87ca7", "scenarioData": {"id": "322324b8-c5fc-4133-83df-bece34a87ca7", "project_id": "860e245f-0ad1-4909-a30e-b220a421b75d", "title": "A Queda do Pilar: Gerenciando Desmotivação em Projeto Crítico", "description": "Um cenário interativo para gestores lidarem com um liderado sênior que apresenta queda de performance e desmotivação, impactando um projeto crucial. O objetivo é aplicar técnicas de feedback, escuta ativa e planejamento colaborativo.", "context": "Você é Sofia Mendes, gerente de projetos sênior na 'Inovatech Solutions', uma empresa de tecnologia conhecida por suas soluções de software personalizadas. Atualmente, você lidera o projeto 'Nexus', um sistema de gestão de dados para um cliente estratégico, com prazo apertado e alta visibilidade. Ricardo Silva, um desenvolvedor sênior com 15 anos de casa e um dos pilares da equipe, tem demonstrado uma queda perceptível em sua produtividade e engajamento nas últimas semanas. Suas entregas estão atrasando e a qualidade tem sido questionável, colocando em risco o cronograma do Projeto Nexus. Ricardo é respeitado na equipe, mas seu comportamento atual está começando a afetar a moral e a produtividade dos outros membros. Você precisa agir rapidamente e de forma eficaz.", "characters": [{"name": "Sofia Mendes", "role": "Gerente de Projetos Sênior", "personality": "Pragmática, orientada a resultados, mas com forte senso de empatia e preocupação com o desenvolvimento de sua equipe. Busca resolver problemas de forma construtiva.", "avatar_description": "Mulher de 30 e poucos anos, com cabelos escuros presos, óculos de aro fino e expressão focada, vestindo blazer e camisa social."}, {"name": "Ricardo Silva", "role": "Desenvolvedor Sênior", "personality": "Experiente, altamente técnico, mas atualmente introspectivo e aparentemente desmotivado. Em tempos normais, é um mentor para os mais jovens e um solucionador de problemas. Agora, parece frustrado e defensivo.", "avatar_description": "Homem de 40 e poucos anos, com barba bem aparada, cabelos grisalhos nas têmporas, expressão cansada, vestindo uma camisa polo e calça jeans."}, {"name": "Laura Costa", "role": "Analista de RH", "personality": "Prestativa, focada em bem-estar e conformidade. Oferece suporte, mas espera que os gestores resolvam as questões de performance diretamente.", "avatar_description": "Mulher de 30 anos, sorriso acolhedor, cabelos loiros lisos, vestindo traje social leve."}], "learning_objectives": ["Aplicar a técnica SCI (Situação-Comportamento-Impacto) para estruturar um feedback construtivo.", "Demonstrar escuta ativa para identificar a causa raiz da desmotivação de um liderado.", "Propor e negociar um plano de ação colaborativo que aborde as necessidades do liderado e os objetivos do projeto."], "competencies_evaluated": ["Gestão de Conflitos e Desempenho", "Comunicação Assertiva e Feedback", "Escuta Ativa e Empatia", "Resolução de Problemas Colaborativa"], "nodes": [{"id": "node_1", "type": "narrative", "title": "O Desempenho de Ricardo: Um Alerta no Projeto Nexus", "narrative": "Você revisa o relatório de progresso do Projeto Nexus e percebe que o módulo X, de responsabilidade de Ricardo, está novamente atrasado. Esta é a terceira semana consecutiva. Além disso, você tem notado que Ricardo tem chegado mais tarde, saído mais cedo e parece distante nas reuniões de equipe. A equipe de QA também reportou um aumento nos bugs nas suas entregas. O cliente está começando a cobrar. Você sabe que precisa intervir, mas também quer entender o que está acontecendo com um colega tão experiente e valioso. Você decide chamar Ricardo para uma conversa. Como você agendaria este encontro?", "character_speaking": "Sofia Mendes", "is_ending": false, "ending_type": null, "score": null, "choices": [{"id": "choice_1_1", "text": "Chamar Ricardo para uma conversa rápida e informal no mesmo dia, no seu escritório. 'Ricardo, podemos conversar por uns minutos?'", "next_node_id": "node_2", "feedback": "Abordar o problema imediatamente pode ser bom para a urgência, mas sem um preparo adequado, a conversa pode parecer abrupta e Ricardo pode se sentir pego de surpresa, dificultando a abertura.", "is_optimal": false, "points": 5}, {"id": "choice_1_2", "text": "Enviar um convite formal para uma reunião de 30 minutos no dia seguinte, indicando o tópico: 'Feedback sobre performance no Projeto Nexus'.", "next_node_id": "node_2_formal", "feedback": "Ótima escolha! Agendar formalmente e informar o tópico da reunião permite que ambos se preparem. Isso demonstra respeito e profissionalismo, criando um ambiente mais propício para uma conversa produtiva e focada.", "is_optimal": true, "points": 20}, {"id": "choice_1_3", "text": "Pedir para Laura, do RH, agendar uma conversa com Ricardo, explicando a situação a ela.", "next_node_id": "node_final_bad_rh", "feedback": "Delegar a conversa ao RH para questões de performance direta pode sinalizar uma falta de liderança e responsabilidade sua. Isso pode desmotivar Ricardo ainda mais, pois a relação de confiança entre líder e liderado é crucial para resolver esses problemas.", "is_optimal": false, "points": 0}]}, {"id": "node_2", "type": "narrative", "title": "A Conversa Informal", "narrative": "Você chama Ricardo para sua sala. Ele parece um pouco apreensivo. 'Pois não, Sofia?' - ele pergunta. Você precisa iniciar a conversa e apresentar o feedback sobre o desempenho dele. Como você faria isso?", "character_speaking": "Sofia Mendes", "is_ending": false, "ending_type": null, "score": null, "choices": [{"id": "choice_2_1", "text": "Diretamente: 'Ricardo, sua performance não tem sido a mesma. O que está acontecendo? Precisamos que você volte aos trilhos.'", "next_node_id": "node_3_defensive", "feedback": "Esta abordagem é muito direta e carece de estrutura. Pode soar acusatória e colocar Ricardo na defensiva, dificultando a abertura para uma discussão honesta sobre as causas da queda de performance.", "is_optimal": false, "points": 5}, {"id": "choice_2_2", "text": "Usando SCI: 'Ricardo, nas últimas três semanas (Situação), tenho notado atrasos significativos nas suas entregas e um aumento nos bugs reportados no módulo X (Comportamento). Isso está comprometendo o cronograma do Projeto Nexus e a qualidade final (Impacto). Gostaria de entender sua perspectiva sobre o que pode estar contribuindo para isso.'", "next_node_id": "node_3_open", "feedback": "Excelente! Você aplicou a técnica SCI (Situação, Comportamento, Impacto) de forma clara e objetiva. Isso foca nos fatos, não em julgamentos, e abre espaço para Ricardo expressar sua visão sem se sentir atacado. É um bom início para uma conversa difícil.", "is_optimal": true, "points": 25}, {"id": "choice_2_3", "text": "Comparando: 'Ricardo, outros membros da equipe estão entregando no prazo. Você é sênior, esperava mais de você. O que está havendo?'", "next_node_id": "node_3_defensive", "feedback": "Comparar Ricardo com outros membros da equipe é contraproducente. Isso pode gerar ressentimento e desmotivação, além de não focar no problema real, mas sim na sua percepção de falha dele em relação aos outros.", "is_optimal": false, "points": 0}]}, {"id": "node_2_formal", "type": "narrative", "title": "O Início da Conversa Formal", "narrative": "Ricardo chega à reunião pontualmente. Ele parece um pouco sério, mas não tão apreensivo como em uma abordagem informal. 'Obrigado por me chamar, Sofia. Sobre o que você gostaria de conversar?', ele pergunta. Você precisa iniciar a conversa e apresentar o feedback sobre o desempenho dele. Como você faria isso?", "character_speaking": "Sofia Mendes", "is_ending": false, "ending_type": null, "score": null, "choices": [{"id": "choice_2f_1", "text": "Diretamente: 'Ricardo, sua performance não tem sido a mesma. O que está acontecendo? Precisamos que você volte aos trilhos.'", "next_node_id": "node_3_defensive", "feedback": "Apesar do agendamento formal, a sua abordagem direta e sem estrutura SCI pode soar acusatória e colocar Ricardo na defensiva. O preparo inicial dele pode não ser suficiente para digerir essa crítica sem uma base factual clara.", "is_optimal": false, "points": 10}, {"id": "choice_2f_2", "text": "Usando SCI: 'Ricardo, nas últimas três semanas (Situação), tenho notado atrasos significativos nas suas entregas e um aumento nos bugs reportados no módulo X (Comportamento). Isso está comprometendo o cronograma do Projeto Nexus e a qualidade final (Impacto). Gostaria de entender sua perspectiva sobre o que pode estar contribuindo para isso.'", "next_node_id": "node_3_open", "feedback": "Excelente! Você aplicou a técnica SCI (Situação, Comportamento, Impacto) de forma clara e objetiva. Isso foca nos fatos, não em julgamentos, e abre espaço para Ricardo expressar sua visão sem se sentir atacado. O ambiente formal preparado ajuda ainda mais a eficácia dessa abordagem.", "is_optimal": true, "points": 30}, {"id": "choice_2f_3", "text": "Focando no projeto: 'Ricardo, precisamos que o módulo X esteja em dia. O que podemos fazer para acelerar isso?'", "next_node_id": "node_3_superficial", "feedback": "Embora foque no projeto, essa pergunta não aborda a raiz do problema de desempenho de Ricardo. Ele pode dar uma solução temporária ou superficial sem resolver a questão subjacente à desmotivação, que é o que você precisa descobrir.", "is_optimal": false, "points": 5}]}, {"id": "node_3_defensive", "type": "narrative", "title": "Ricardo na Defensiva", "narrative": "Ricardo cruza os braços e responde com um tom ríspido: 'Sofia, eu sei o que estou fazendo. Tenho 15 anos de experiência aqui. Talvez o problema não seja eu, mas a pressão irreal desse projeto ou a falta de recursos que ninguém resolve.'", "character_speaking": "Ricardo Silva", "is_ending": false, "ending_type": null, "score": null, "choices": [{"id": "choice_3d_1", "text": "Reafirmar a seriedade: 'Ricardo, entendo sua experiência, mas os fatos são claros. Precisamos de uma solução para os atrasos e bugs urgentemente. Qual é a sua proposta?'", "next_node_id": "node_4_pressure", "feedback": "Você está mantendo o foco no problema do projeto, mas ainda não está abordando a defensividade de Ricardo ou as possíveis causas subjacentes. A pressão direta pode levar a soluções paliativas.", "is_optimal": false, "points": 5}, {"id": "choice_3d_2", "text": "Tentar empatia e escuta ativa: 'Ricardo, eu respeito sua experiência. Não estou questionando sua capacidade, mas os resultados recentes são uma preocupação. Quando você menciona pressão irreal ou falta de recursos, pode me dar exemplos específicos? Estou aqui para ouvir e entender.'", "next_node_id": "node_4_resistance_broken", "feedback": "Boa tentativa de desarmar a defensiva de Ricardo. Você validou a experiência dele e mostrou abertura para ouvir, o que é fundamental para a escuta ativa. Isso pode incentivá-lo a se abrir, mesmo após um começo difícil.", "is_optimal": true, "points": 15}, {"id": "choice_3d_3", "text": "Ignorar a defensiva: 'Entendido. Bem, vamos focar no que podemos controlar. O que você fará para garantir que o módulo X seja entregue no prazo esta semana?'", "next_node_id": "node_final_bad_ignore", "feedback": "Ignorar a defensividade de Ricardo e focar apenas na entrega pode fazer com que ele se sinta desvalorizado e não ouvido. Isso dificilmente resolverá a raiz da desmotivação e pode levar a um maior distanciamento e queda contínua na performance.", "is_optimal": false, "points": 0}]}, {"id": "node_3_open", "type": "narrative", "title": "Ricardo Começa a se Abrir", "narrative": "Ricardo suspira, e seu semblante suaviza um pouco. 'Sofia, obrigado por ser direta, mas também por perguntar. Para ser honesto... estou passando por umas coisas em casa com a saúde da minha mãe, e isso tem me tirado o foco. Além disso, sinto que, apesar de toda a minha experiência, estou estagnado aqui. Sempre os mesmos projetos, as mesmas tecnologias. Vejo os novos chegando com ideias frescas e ganhando destaque, e eu? Parece que sou só o cara que resolve os problemas chatos. Não vejo mais um desafio.'", "character_speaking": "Ricardo Silva", "is_ending": false, "ending_type": null, "score": null, "choices": [{"id": "choice_3o_1", "text": "Demonstrar empatia e explorar: 'Ricardo, lamento muito a situação da sua mãe. Isso é realmente difícil. Quanto à sua estagnação, pode me dar mais detalhes? O que exatamente você gostaria de fazer ou aprender que sente que não está tendo a oportunidade?'", "next_node_id": "node_4_deep_dive", "feedback": "Excelente uso da escuta ativa e empatia. Você validou os sentimentos de Ricardo e buscou mais informações para entender a raiz do problema. Isso constrói confiança e prepara o terreno para uma solução colaborativa e eficaz.", "is_optimal": true, "points": 30}, {"id": "choice_3o_2", "text": "Focar na solução do projeto: 'Entendo, Ricardo. Mas o Projeto Nexus é crítico. Precisamos de você focado aqui. O que podemos fazer para que você se concentre e entregue os módulos a tempo?'", "next_node_id": "node_4_project_first", "feedback": "Embora a urgência do projeto seja real, focar apenas na solução imediata sem explorar as causas da desmotivação pode gerar um alívio temporário, mas não resolverá o problema de longo prazo de Ricardo e a sua relação com a empresa.", "is_optimal": false, "points": 10}, {"id": "choice_3o_3", "text": "Oferecer solução imediata para um problema: 'Ricardo, por que você não tira uns dias de folga para cuidar da sua mãe? Vou falar com o RH.'", "next_node_id": "node_final_neutral_vacation", "feedback": "Você agiu com empatia em relação à situação familiar, o que é positivo. No entanto, focar apenas nas férias ignora a outra parte da queixa de Ricardo sobre estagnação e falta de desafio, que é igualmente importante para sua motivação no trabalho.", "is_optimal": false, "points": 10}]}, {"id": "node_3_superficial", "type": "narrative", "title": "Ricardo Oferece Soluções Superficiais", "narrative": "Ricardo responde: 'Claro, Sofia. Eu me concentrarei mais esta semana. Acho que consigo acelerar e colocar tudo em dia.' Ele parece um pouco evasivo e não se aprofunda nos motivos.", "character_speaking": "Ricardo Silva", "is_ending": false, "ending_type": null, "score": null, "choices": [{"id": "choice_3s_1", "text": "Aceitar a promessa: 'Ótimo, Ricardo. Conto com isso. Vamos acompanhar de perto.'", "next_node_id": "node_final_neutral_superficial", "feedback": "Aceitar uma promessa superficial sem investigar a causa raiz do problema é um risco. A performance pode melhorar temporariamente, mas a desmotivação subjacente provavelmente persistirá e pode ressurgir. Você perdeu a chance de um diálogo mais profundo.", "is_optimal": false, "points": 5}, {"id": "choice_3s_2", "text": "Tentar aprofundar: 'Agradeço seu compromisso, Ricardo. Mas estou sentindo que há algo mais profundo. Algo que possa estar realmente afetando seu foco ou sua motivação? Gostaria de ter certeza de que estamos resolvendo a raiz do problema.'", "next_node_id": "node_4_resistance_broken", "feedback": "Boa iniciativa em tentar aprofundar a conversa, mesmo após uma resposta superficial. Sua persistência em buscar a causa raiz é um sinal de boa liderança e escuta ativa. Isso pode fazer com que Ricardo se sinta mais seguro para se abrir.", "is_optimal": true, "points": 15}]}, {"id": "node_4_resistance_broken", "type": "narrative", "title": "A Resistência Quebra: Ricardo se Abre", "narrative": "Apesar do início difícil, sua persistência em ouvir e sua demonstração de empatia fazem Ricardo finalmente se abrir. 'Olha, Sofia, para ser honesto... estou passando por umas coisas em casa com a saúde da minha mãe, e isso tem me tirado o foco. Além disso, sinto que, apesar de toda a minha experiência, estou estagnado aqui. Sempre os mesmos projetos, as mesmas tecnologias. Vejo os novos chegando com ideias frescas e ganhando destaque, e eu? Parece que sou só o cara que resolve os problemas chatos. Não vejo mais um desafio.'", "character_speaking": "Ricardo Silva", "is_ending": false, "ending_type": null, "score": null, "choices": [{"id": "choice_4r_1", "text": "Demonstrar empatia e explorar: 'Ricardo, lamento muito a situação da sua mãe. Isso é realmente difícil. Quanto à sua estagnação, pode me dar mais detalhes? O que exatamente você gostaria de fazer ou aprender que sente que não está tendo a oportunidade?'", "next_node_id": "node_4_deep_dive", "feedback": "Excelente! Você validou os sentimentos de Ricardo e buscou mais informações para entender a raiz do problema. Isso constrói confiança e prepara o terreno para uma solução colaborativa e eficaz. Sua paciência em desarmar a defensiva valeu a pena.", "is_optimal": true, "points": 30}, {"id": "choice_4r_2", "text": "Focar na solução do projeto: 'Entendo, Ricardo. Mas o Projeto Nexus é crítico. Precisamos de você focado aqui. O que podemos fazer para que você se concentre e entregue os módulos a tempo?'", "next_node_id": "node_4_project_first", "feedback": "Embora a urgência do projeto seja real, focar apenas na solução imediata sem explorar as causas da desmotivação pode gerar um alívio temporário, mas não resolverá o problema de longo prazo de Ricardo e a sua relação com a empresa, especialmente após ele ter se aberto.", "is_optimal": false, "points": 10}]}, {"id": "node_4_project_first", "type": "narrative", "title": "Foco na Entrega do Projeto", "narrative": "Ricardo concorda, mas com um semblante pesado. 'Certo, Sofia. Eu me esforçarei para colocar as entregas em dia. O projeto é importante.' Ele parece menos engajado do que o esperado, mas acata a instrução.", "character_speaking": "Ricardo Silva", "is_ending": false, "ending_type": null, "score": null, "choices": [{"id": "choice_4p_1", "text": "Aceitar o compromisso: 'Ótimo, Ricardo. Conto com isso. Vamos nos falar em breve para acompanhar o progresso.'", "next_node_id": "node_final_neutral_project", "feedback": "Você garantiu um compromisso para o projeto, o que é bom no curto prazo. No entanto, ao não aprofundar nas causas da desmotivação de Ricardo, você perdeu a oportunidade de resolver o problema de forma mais duradoura, o que pode levar a futuros problemas de desempenho.", "is_optimal": false, "points": 10}, {"id": "choice_4p_2", "text": "Tentar novamente abordar o pessoal/profissional: 'Ricardo, sei que o projeto é a prioridade, mas quero que saiba que também me importo com seu bem-estar e sua carreira. Há algo que, fora do projeto, poderíamos pensar para te dar um novo fôlego?'", "next_node_id": "node_final_neutral_attempt", "feedback": "Você tentou novamente abordar os problemas de Ricardo, mostrando que se importa. Isso é melhor do que simplesmente aceitar o compromisso. Contudo, ao fazer isso em um segundo momento, a abertura pode ser menor, resultando em um impacto apenas moderado.", "is_optimal": true, "points": 15}]}, {"id": "node_4_deep_dive", "type": "narrative", "title": "A Raiz da Desmotivação", "narrative": "Ricardo se anima um pouco. 'Bem, Sofia, eu gostaria de me envolver mais com a nova tecnologia de microsserviços que a empresa está explorando. Sinto que tenho a base para aprender e aplicar, mas as oportunidades nunca chegam para quem já está 'acomodado' nos sistemas legados. E sobre a minha mãe... ela está com uma doença crônica, e preciso levá-la a muitas consultas. Às vezes, mal durmo pensando em como conciliar tudo.'", "character_speaking": "Ricardo Silva", "is_ending": false, "ending_type": null, "score": null, "choices": [{"id": "choice_4d_1", "text": "Focar apenas na situação pessoal: 'Ricardo, entendo perfeitamente. Em relação à sua mãe, podemos flexibilizar seus horários ou ver sobre um home office temporário. Isso te ajudaria a focar no projeto?'", "next_node_id": "node_final_neutral_personal_focus", "feedback": "Você demonstrou empatia e ofereceu suporte para a questão pessoal, o que é muito bom. No entanto, ao focar apenas nisso, você ignorou a frustração profissional de Ricardo (desejo de novas tecnologias), que é uma das principais causas da sua desmotivação. Uma solução parcial levará a um resultado apenas regular.", "is_optimal": false, "points": 15}, {"id": "choice_4d_2", "text": "Propor um plano colaborativo (pessoal e profissional): 'Ricardo, lamento muito a situação da sua mãe. Podemos explorar flexibilidade de horário ou home office para suas consultas. E sobre os microsserviços, que tal se, após o Projeto Nexus, ou até mesmo em uma pequena parte dele, você pudesse liderar um 'spike' de pesquisa ou prototipagem com essa tecnologia? Poderíamos ajustar algumas de suas tarefas menos críticas no projeto atual para liberar um pouco de tempo para isso, se você se comprometer com as entregas cruciais.'", "next_node_id": "node_5", "feedback": "Excelente! Você abordou ambas as causas da desmotivação de Ricardo: a questão pessoal com suporte flexível e a necessidade de desenvolvimento profissional com uma oportunidade concreta. A proposta é colaborativa e mostra que você valoriza tanto a pessoa quanto o profissional. Isso é chave para reengajar um talento sênior.", "is_optimal": true, "points": 40}, {"id": "choice_4d_3", "text": "Minimizar o problema: 'Ricardo, sei que é difícil, mas todos temos problemas pessoais. E sobre as tecnologias, é algo que discutiremos no próximo ciclo de planejamento. Por agora, o Projeto Nexus é a prioridade.'", "next_node_id": "node_final_bad_minimize", "feedback": "Minimizar os problemas pessoais e adiar as aspirações profissionais de Ricardo é altamente desmotivador. Ele se sentirá não apenas ignorado, mas também desvalorizado, o que certamente levará a um agravamento da situação e à sua perda de confiança na liderança.", "is_optimal": false, "points": 0}]}, {"id": "node_4_pressure", "type": "narrative", "title": "Ricardo sob Pressão", "narrative": "Ricardo, visivelmente tenso, responde: 'Certo, Sofia. Vou focar em colocar tudo em dia. Consigo entregar o módulo X até o final da semana.' Ele não parece motivado, mas dá a impressão de que fará o que é pedido. Você sente que a conversa foi superficial, focada apenas na entrega, e que o problema de fundo ainda não foi resolvido.", "character_speaking": "Ricardo Silva", "is_ending": false, "ending_type": null, "score": null, "choices": [{"id": "choice_4p_f1", "text": "Aceitar o compromisso: 'Ótimo, Ricardo. Conto com isso. Vamos nos falar em breve para acompanhar o progresso.'", "next_node_id": "node_final_neutral_project", "feedback": "Você garantiu um compromisso para o projeto, o que é bom no curto prazo. No entanto, ao não aprofundar nas causas da desmotivação de Ricardo, você perdeu a oportunidade de resolver o problema de forma mais duradoura, o que pode levar a futuros problemas de desempenho.", "is_optimal": false, "points": 5}, {"id": "choice_4p_f2", "text": "Tentar novamente abordar o pessoal/profissional: 'Ricardo, sei que o projeto é a prioridade, mas quero que saiba que também me importo com seu bem-estar e sua carreira. Há algo que, fora do projeto, poderíamos pensar para te dar um novo fôlego?'", "next_node_id": "node_final_neutral_attempt", "feedback": "Você tentou novamente abordar os problemas de Ricardo, mostrando que se importa. Isso é melhor do que simplesmente aceitar o compromisso. Contudo, ao fazer isso em um segundo momento, a abertura pode ser menor, resultando em um impacto apenas moderado, mas ainda assim melhor do que ignorar completamente.", "is_optimal": true, "points": 10}]}, {"id": "node_5", "type": "narrative", "title": "Plano Colaborativo e Próximos Passos", "narrative": "Ricardo acena com a cabeça, um brilho de esperança em seus olhos. 'Sofia, isso seria incrível! Seria um grande incentivo e me ajudaria muito com tudo. Eu me comprometo totalmente a colocar o Projeto Nexus em dia e a me dedicar à qualidade. Acredito que com esse suporte, consigo gerenciar melhor meu tempo.' Você sente que ele está genuinamente mais motivado. Como você sela este acordo e garante o acompanhamento?", "character_speaking": "Ricardo Silva", "is_ending": false, "ending_type": null, "score": null, "choices": [{"id": "choice_5_1", "text": "Formalizar e agendar follow-up: 'Excelente, Ricardo. Vamos formalizar esses pontos por e-mail e agendar um check-in rápido semanal para acompanhar o progresso do Projeto Nexus e também suas explorações com microsserviços. Como te parece?'", "next_node_id": "node_final_good", "feedback": "Perfeito! Você não apenas criou um plano colaborativo, mas também estabeleceu um processo de acompanhamento claro e formal. Isso demonstra profissionalismo, mantém a responsabilidade mútua e reforça a confiança, garantindo que as ações sejam implementadas e monitoradas. Um desfecho muito positivo.", "is_optimal": true, "points": 30}, {"id": "choice_5_2", "text": "Confiar na palavra: 'Fico feliz em ouvir isso, Ricardo. Conto com você. Qualquer coisa, me procure.'", "next_node_id": "node_final_neutral", "feedback": "Você conseguiu motivar Ricardo, o que é ótimo. No entanto, confiar apenas na palavra sem um plano de acompanhamento formalizado pode levar a desvios no futuro, especialmente se novas pressões surgirem. Um acompanhamento periódico é crucial para consolidar o sucesso.", "is_optimal": false, "points": 10}, {"id": "choice_5_3", "text": "Delegar o acompanhamento: 'Ótimo. Vou pedir para Laura (RH) te acompanhar nessas questões mais pessoais e de desenvolvimento.'", "next_node_id": "node_final_bad_delegate_final", "feedback": "Embora o RH possa ser um suporte, delegar o acompanhamento da motivação e desenvolvimento de um liderado após um plano colaborativo pode enfraquecer o vínculo que você acabou de construir com Ricardo. A liderança direta é fundamental para manter o engajamento.", "is_optimal": false, "points": 0}]}, {"id": "node_final_good", "type": "ending", "title": "Desfecho Positivo: Ricardo Reengajado e Projeto no Caminho Certo", "narrative": "Nas semanas seguintes, Ricardo demonstra uma melhora notável. Suas entregas no Projeto Nexus voltam a ser pontuais e de alta qualidade. Nos check-ins semanais, ele compartilha entusiasticamente suas descobertas com microsserviços e se mostra grato pela flexibilidade de horários. A equipe percebe o reengajamento de Ricardo, e o moral melhora. O Projeto Nexus é entregue no prazo e com sucesso, e Ricardo se torna um evangelista das novas tecnologias na equipe, liderando uma iniciativa interna de treinamento. Sua liderança proativa e empática fez a diferença.", "character_speaking": null, "is_ending": true, "ending_type": "good", "score": 95, "choices": []}, {"id": "node_final_neutral", "type": "ending", "title": "Desfecho Neutro: Melhoria, mas Potencial Não Totalmente Aproveitado", "narrative": "A performance de Ricardo melhora, mas de forma inconsistente. O Projeto Nexus consegue ser entregue, com alguns apertos no prazo final. Ele ainda parece um pouco distante, e as conversas sobre desenvolvimento profissional não avançam muito sem um acompanhamento mais estruturado. Embora a crise imediata tenha sido contornada, você sente que Ricardo ainda tem um potencial inexplorado e que a relação de confiança poderia ser mais forte.", "character_speaking": null, "is_ending": true, "ending_type": "neutral", "score": 60, "choices": []}, {"id": "node_final_neutral_vacation", "type": "ending", "title": "Desfecho Neutro: Alívio Temporário, Mas o Problema Persiste", "narrative": "Ricardo tira alguns dias de folga. Ao retornar, sua performance melhora um pouco no curto prazo, e o Projeto Nexus evita o desastre. No entanto, a conversa sobre seu desejo de novos desafios nunca é retomada. Ricardo continua a cumprir suas tarefas, mas sem o brilho e a proatividade de antes. Ele parece resignado. Você resolveu parte do problema imediato, mas não as causas profundas da desmotivação, e a relação não se fortaleceu.", "character_speaking": null, "is_ending": true, "ending_type": "neutral", "score": 55, "choices": []}, {"id": "node_final_neutral_superficial", "type": "ending", "title": "Desfecho Neutro: Promessa Cumprida, Mas Sem Engajamento Real", "narrative": "Ricardo cumpre sua promessa e o módulo X é entregue no prazo, evitando um atraso maior no Projeto Nexus. Contudo, seu engajamento continua baixo. Ele faz o mínimo necessário e não contribui com ideias ou proatividade. A relação de vocês se mantém profissional, mas distante. Você resolveu o problema de entrega imediato, mas a motivação e o potencial de Ricardo não foram recuperados, e a chance de transformá-lo em um colaborador mais engajado foi perdida.", "character_speaking": null, "is_ending": true, "ending_type": "neutral", "score": 50, "choices": []}, {"id": "node_final_neutral_project", "type": "ending", "title": "Desfecho Neutro: Projeto no Rumo, Mas Relação Frágil", "narrative": "Ricardo intensifica o trabalho, e as entregas do Projeto Nexus voltam a se estabilizar. O projeto avança, mas a custo de um relacionamento fragilizado. Ricardo se sente pressionado e não valorizado em suas aspirações. Ele entrega o necessário, mas com um mínimo de entusiasmo. Você cumpriu o objetivo do projeto, mas Ricardo perdeu parte de seu engajamento e pode ser um risco para a equipe a longo prazo.", "character_speaking": null, "is_ending": true, "ending_type": "neutral", "score": 65, "choices": []}, {"id": "node_final_neutral_attempt", "type": "ending", "title": "Desfecho Neutro: Reconhecimento Tardio, Efeito Limitado", "narrative": "Ricardo reconhece seu esforço em tentar se conectar, mas o impacto é limitado. Ele sente que a oportunidade de uma conversa mais profunda e proativa foi perdida no início. Sua performance melhora um pouco, mas a desmotivação não se dissipa completamente. O Projeto Nexus é entregue com alguns desafios finais, e Ricardo continua um contribuinte competente, mas sem o brilho e a proatividade de um liderado totalmente engajado.", "character_speaking": null, "is_ending": true, "ending_type": "neutral", "score": 70, "choices": []}, {"id": "node_final_neutral_personal_focus", "type": "ending", "title": "Desfecho Neutro: Alívio Pessoal, Mas Insatisfação Profissional", "narrative": "A flexibilidade de horários ajuda Ricardo a lidar com a situação da sua mãe, e ele agradece. Sua performance melhora em termos de consistência, mas a qualidade e a proatividade ainda não atingem o nível esperado. A falta de novos desafios e o sentimento de estagnação continuam a corroer sua motivação. O Projeto Nexus é entregue, mas você percebe que Ricardo está apenas 'cumprindo tabela', e a longo prazo, ele pode buscar oportunidades em outro lugar. Você resolveu uma parte do problema, mas não a outra.", "character_speaking": null, "is_ending": true, "ending_type": "neutral", "score": 75, "choices": []}, {"id": "node_final_bad_rh", "type": "ending", "title": "Desfecho Ruim: Desengajamento e Perda de Confiança", "narrative": "Laura (RH) tenta conversar com Ricardo, mas ele se sente preterido e desvalorizado por não ter sido abordado diretamente por você. Ele vê isso como uma falta de confiança em sua capacidade. Sua performance piora significativamente, ele se isola da equipe e, após algumas semanas, entrega seu pedido de demissão, alegando que a cultura da empresa não valoriza a experiência. O Projeto Nexus sofre um atraso crítico e a equipe fica desmotivada. Você perdeu um membro chave e a credibilidade.", "character_speaking": "Laura Costa", "is_ending": true, "ending_type": "bad", "score": 10, "choices": []}, {"id": "node_final_bad_ignore", "type": "ending", "title": "Desfecho Ruim: Agravamento e Dano à Equipe", "narrative": "A performance de Ricardo não melhora e, na verdade, piora. Ele se torna mais ressentido e menos comunicativo. A equipe, percebendo a inação e o baixo engajamento de um colega sênior, começa a demonstrar sinais de desmotivação e fofocas. O Projeto Nexus atrasa criticamente, com falhas de qualidade graves que demandam retrabalho extenso. Sua credibilidade como líder é questionada, e a empresa pode sofrer perdas financeiras e de reputação.", "character_speaking": null, "is_ending": true, "ending_type": "bad", "score": 5, "choices": []}, {"id": "node_final_bad_minimize", "type": "ending", "title": "Desfecho Ruim: Perda de Talento e Colapso da Motivação", "narrative": "Ricardo, sentindo-se completamente desvalorizado e não ouvido, encerra a conversa de forma fria. Nas semanas seguintes, ele apenas cumpre o essencial, sem qualquer iniciativa. A qualidade de suas entregas continua baixa. Em um mês, ele entrega seu pedido de demissão, aceitando uma proposta de outra empresa que lhe ofereceu desafios com as novas tecnologias. O Projeto Nexus fica em sérios apuros com a perda de um desenvolvedor sênior, causando atrasos críticos e grande impacto na equipe e no cliente. Sua gestão falhou em reter um talento valioso.", "character_speaking": null, "is_ending": true, "ending_type": "bad", "score": 0, "choices": []}, {"id": "node_final_bad_delegate_final", "type": "ending", "title": "Desfecho Ruim: Oportunidade Perdida e Desconfiança", "narrative": "Ricardo fica visivelmente desapontado com a sua decisão de delegar o acompanhamento ao RH. Ele sente que a sua promessa de apoio não era sincera e que você está se esquivando de sua responsabilidade como líder. Embora o RH tente auxiliar, a relação de confiança que você estava construindo com Ricardo se quebra. Sua performance se estabiliza em um nível mediano, sem proatividade. O Projeto Nexus é entregue com dificuldades, e a longo prazo, Ricardo se torna um colaborador apático, sem o brilho de antes, refletindo a falta de um líder que o acompanhe de perto.", "character_speaking": "Ricardo Silva", "is_ending": true, "ending_type": "bad", "score":
