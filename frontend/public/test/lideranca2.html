                                            element.style.animation = 'ppt-emphasis-pulse ' + animDuration + 's ' + (anim.easing || 'ease');
                                            
                                            // Remove highlight after animation
                                            setTimeout(function() {
                                                element.style.borderColor = 'transparent';
                                                element.style.boxShadow = 'none';
                                            }, animDuration * 1000);
                                        }, actualDelay * 1000);
                                        timelineTimers.push(highlightTimer);
                                        
                                    } else if (anim.type === 'entrance') {
                                        // Regular entrance animation
                                        element.style.opacity = '0';
                                        element.style.visibility = 'hidden';
                                        var eff = anim.effect || 'fadeIn';
                                        // Set initial transform based on effect
                                        if (eff === 'slideInLeft') element.style.transform = 'translateX(-60px)';
                                        else if (eff === 'slideInRight') element.style.transform = 'translateX(60px)';
                                        else if (eff === 'slideInUp') element.style.transform = 'translateY(40px)';
                                        else if (eff === 'slideInDown') element.style.transform = 'translateY(-40px)';
                                        else if (eff === 'zoomIn') element.style.transform = 'scale(0.5)';
                                        else if (eff === 'bounce') element.style.transform = 'translateY(-30px)';
                                        else if (eff === 'typewriter') { element.style.opacity = '1'; element.style.clipPath = 'inset(0 100% 0 0)'; }
                                        
                                        var showTimer = setTimeout(function() {
                                            element.style.visibility = 'visible';
                                            if (eff === 'typewriter') {
                                                element.style.transition = 'clip-path ' + animDuration + 's steps(20, end)';
                                                element.style.clipPath = 'inset(0 0% 0 0)';
                                            } else if (eff === 'bounce') {
                                                element.style.transition = 'opacity ' + animDuration + 's ease, transform ' + animDuration + 's cubic-bezier(0.34, 1.56, 0.64, 1)';
                                                element.style.opacity = '1';
                                                element.style.transform = 'translateY(0) translateX(0) scale(1)';
                                            } else {
                                                var easeFunc = anim.easing || 'cubic-bezier(0.25, 0.46, 0.45, 0.94)';
                                                element.style.transition = 'opacity ' + animDuration + 's ' + easeFunc + ', transform ' + animDuration + 's ' + easeFunc;
                                                element.style.opacity = '1';
                                                element.style.transform = 'translateY(0) translateX(0) scale(1)';
                                            }
                                        }, (startTime + actualDelay) * 1000);
                                        timelineTimers.push(showTimer);
                                        
                                        // Update cumulative delay
                                        animationDelay = actualDelay + animDuration;
                                        
                                    } else if (anim.type === 'exit') {
                                        var exitEffect = 'ppt-exit-' + (anim.effect || 'fade');
                                        var hideTimer = setTimeout(function() {
                                            element.style.animation = exitEffect + ' ' + animDuration + 's ' + (anim.easing || 'ease') + ' forwards';
                                            setTimeout(function() {
                                                element.style.visibility = 'hidden';
                                            }, animDuration * 1000);
                                        }, (startTime + actualDelay) * 1000);
                                        timelineTimers.push(hideTimer);
                                        
                                    } else if (anim.type === 'emphasis') {
                                        var emphasisTimer = setTimeout(function() {
                                            element.style.animation = animEffect + ' ' + animDuration + 's ' + (anim.easing || 'ease');
                                        }, (startTime + actualDelay) * 1000);
                                        timelineTimers.push(emphasisTimer);
                                    }
                                });
                                
                            } else {
                                // No PPT animations - use timeline startTime/endTime
                                if (startTime > 0) {
                                    var showTimer = setTimeout(function() {
                                        element.style.display = '';
                                        element.style.animation = 'fadeIn 0.3s ease-out';
                                    }, startTime * 1000);
                                    timelineTimers.push(showTimer);
                                }
                                
                                if (endTime < slideDuration) {
                                    var hideTimer = setTimeout(function() {
                                        element.style.animation = 'fadeOut 0.3s ease-out';
                                        setTimeout(function() {
                                            element.style.display = 'none';
                                        }, 300);
                                    }, endTime * 1000);
                                    timelineTimers.push(hideTimer);
                                }
                            }
                        }
                    });
                }
                
                // Setup timeline for annotations with startTime/endTime
                if (slide.annotations) {
                    slide.annotations.forEach(function(ann, annIndex) {

                                    annotation.style.display = '';

                                }, startTime * 1000);
                                timelineTimers.push(showTimer);
                            }
                            
                            // Schedule annotation to hide at endTime (if before slide ends)
                            if (endTime < slideDuration) {

                                    annotation.style.opacity = '0';
                                    setTimeout(function() {
                                        annotation.style.display = 'none';
                                    }, 300);
                                }, endTime * 1000);
                                timelineTimers.push(hideTimer);
                            }

                // Start slide audio if exists

            function isMobileLandscape() {
                // More restrictive check: must be landscape AND have mobile-like dimensions
                // Typical mobile landscape: width < 950px AND height < 450px
                var isLandscape = window.innerWidth > window.innerHeight;
                var hasMobileDimensions = window.innerWidth <= 950 && window.innerHeight <= 450;
                var isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
                // Return true only if definitely on mobile landscape
                return isLandscape && (hasMobileDimensions || (isTouchDevice && window.innerWidth <= 950));
            }
            
            function updateSlideScale() {
                var container = document.getElementById('slide-container');
                var wrapper = document.getElementById('slide-wrapper');
                if (!container || !wrapper || !course.slides) return;
                
                var slide = course.slides[currentSlide];
                var slideWidth = slide.width || 1920;
                var slideHeight = slide.height || 820;
                
                // Detect mobile device
                var isMobileDevice = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
                var isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
                var isSmallScreen = window.innerWidth < 1024;
                var isMobile = isMobileDevice || (isSmallScreen && isTouchDevice);
                
                // Detect portrait orientation
                var isPortrait = window.innerHeight > window.innerWidth;
                var isMobilePortrait = isMobile && isPortrait;
                var isMobileLand = isMobileLandscape();
                
                if (isMobilePortrait) {
                    // MOBILE PORTRAIT MODE - Fill the screen width completely
                    var screenWidth = Math.max(window.innerWidth, document.documentElement.clientWidth);
                    var screenHeight = Math.max(window.innerHeight, document.documentElement.clientHeight);
                    
                    var viewportWidth = screenWidth;
                    var viewportHeight = screenHeight - 40; // Space for counter
                    
                    // Calculate scale to fill width completely
                    var scaleForWidth = viewportWidth / slideWidth;
                    
                    // Calculate the scaled height
                    var scaledHeight = slideHeight * scaleForWidth;
                    
                    // Center vertically if there's extra space
                    var topOffset = 0;
                    if (scaledHeight < viewportHeight) {
                        topOffset = (viewportHeight - scaledHeight) / 2;
                    }
                    
                    // Force wrapper to have no padding and full width
                    wrapper.style.padding = '0';
                    wrapper.style.margin = '0';
                    wrapper.style.width = '100vw';
                    wrapper.style.maxWidth = '100vw';
                    wrapper.style.alignItems = 'flex-start';
                    wrapper.style.justifyContent = 'flex-start';
                    wrapper.style.paddingTop = topOffset + 'px';
                    
                    // Apply scale with left-aligned transform origin for true full-width
                    container.style.width = slideWidth + 'px';
                    container.style.height = slideHeight + 'px';
                    container.style.transform = 'scale(' + scaleForWidth + ')';
                    container.style.transformOrigin = 'left top';
                    container.style.marginLeft = '0';
                    container.style.boxShadow = 'none';
                    
                    console.log('[Scale] Mobile portrait - scale:', scaleForWidth.toFixed(3));
                    return;
                }
                
                // DESKTOP / LANDSCAPE MODE
                // Reset wrapper styles that might have been modified
                wrapper.style.padding = '';
                wrapper.style.margin = '';
                wrapper.style.width = '';
                wrapper.style.maxWidth = '';
                wrapper.style.alignItems = '';
                wrapper.style.justifyContent = '';
                wrapper.style.paddingTop = '';
                container.style.marginLeft = '';
                container.style.marginRight = '';
                container.style.marginBottom = '';
                container.style.boxShadow = '';
                container.style.transformOrigin = '0 0';
                
                var wrapperRect = wrapper.getBoundingClientRect();
                
                // Use minimal padding on mobile landscape for maximum slide size
                var padding = (isPresentationMode || isMobileLand) ? 10 : 40;
                var availableWidth = wrapperRect.width - padding;
                var availableHeight = wrapperRect.height - padding;
                
                // On mobile landscape, account for the floating controls at bottom
                if (isMobileLand) {
                    availableHeight -= 70; // Space for mobile float controls
                }
                
                if (availableWidth < 50 || availableHeight < 50) return;
                
                var scaleX = availableWidth / slideWidth;
                var scaleY = availableHeight / slideHeight;
                var scale = Math.min(scaleX, scaleY);
                
                // Allow higher scale for better visibility
                // No upper limit on mobile landscape - fill the screen!
                var maxScale;
                if (isPresentationMode || isMobileLand) {
                    maxScale = 5.0; // Virtually no limit
                } else {
                    // Allow scale up to 1.5 to accommodate smaller slides
                    maxScale = 1.5;
                }
                scale = Math.min(scale, maxScale);
                
                container.style.transform = 'scale(' + scale + ')';
                
                // Shrink layout box to match visual size so flexbox centering works
                container.style.marginRight = -(slideWidth * (1 - scale)) + 'px';
                container.style.marginBottom = -(slideHeight * (1 - scale)) + 'px';
            }

                            '<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;">' +
                            '<span style="width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;' + 
                            (wasCorrect ? 'background:#22c55e;color:#fff;' : 'background:#ef4444;color:#fff;') + '">' + (wasCorrect ? '✓' : '✕') + '</span>' +
                            '<span style="font-weight:600;font-size:12px;' + (wasCorrect ? 'color:#22c55e;' : 'color:#ef4444;') + '">' + (wasCorrect ? 'Correto!' : 'Incorreto') + '</span></div>';
                        
                        if (question.explanation) {
                            html += '<p style="color:#cbd5e1;font-size:11px;margin:0;line-height:1.4;">' + question.explanation + '</p>';
                        }
                        if (!wasCorrect && correctAlt) {
                            html += '<p style="color:#94a3b8;margin-top:4px;font-size:10px;">Correta: <span style="color:#22c55e;font-weight:500;">' + correctAlt.text + '</span></p>';
                        }
                        html += '</div>';
                    }
                    
                    html += '</div>' +
                        '<div style="padding:10px 16px;border-top:1px solid #334155;display:flex;justify-content:space-between;align-items:center;background:#1e293b;">' +
                        '<button style="padding:6px 12px;background:transparent;border:none;color:#94a3b8;cursor:pointer;font-size:12px;' + 
                        (quiz.currentIndex === 0 || quiz.showingFeedback ? 'opacity:0.4;cursor:not-allowed;' : '') + '" ' + 
                        (quiz.currentIndex === 0 || quiz.showingFeedback ? 'disabled' : '') + 
                        ' onclick="QuizController.prevQuestion(\'' + elementId + '\')">‹ Anterior</button>';
                    
                    if (quiz.showingFeedback) {
                        if (quiz.currentIndex < total - 1) {
                            html += '<button style="padding:8px 16px;background:#475569;color:#fff;border:none;border-radius:6px;font-weight:500;font-size:12px;cursor:pointer;" onclick="QuizController.nextQuestion(\'' + elementId + '\')">Próxima ›</button>';
                        } else {
                            html += '<button style="padding:8px 16px;background:#22c55e;color:#fff;border:none;border-radius:6px;font-weight:500;font-size:12px;cursor:pointer;" onclick="QuizController.showResults(\'' + elementId + '\')">Ver Resultado</button>';
                        }
                    } else {
                        html += '<button style="padding:8px 16px;background:#475569;color:#fff;border:none;border-radius:6px;font-weight:500;font-size:12px;cursor:pointer;' + 
                            (!quiz.selectedAnswer ? 'opacity:0.4;cursor:not-allowed;' : '') + '" ' +
                            (!quiz.selectedAnswer ? 'disabled' : '') + 
                            ' onclick="QuizController.confirmAnswer(\'' + elementId + '\')">Confirmar ✓</button>';
                    }
                    
                    html += '</div></div>';
                    container.innerHTML = html;
                },
                
                selectAnswer: function(elementId, altId) {
                    var quiz = quizzes[elementId];
                    if (!quiz || quiz.showingFeedback) return;
                    quiz.selectedAnswer = altId;
                    this.renderQuestion(elementId);
                },
                
                confirmAnswer: function(elementId) {
                    var quiz = quizzes[elementId];
                    if (!quiz || !quiz.selectedAnswer) return;
                    
                    var question = quiz.questions[quiz.currentIndex];
                    var selectedAlt = question.alternatives.find(function(a) { return a.id === quiz.selectedAnswer; });
                    
                    quiz.answers.push({
                        questionId: question.id,
                        selectedAlternativeId: quiz.selectedAnswer,
                        isCorrect: selectedAlt && selectedAlt.isCorrect
                    });
                    
                    if (quiz.config.showFeedback !== false) {
                        quiz.showingFeedback = true;
                        this.renderQuestion(elementId);
                    } else {
                        this.nextQuestion(elementId);
                    }
                },
                
                nextQuestion: function(elementId) {
                    var quiz = quizzes[elementId];
                    if (!quiz) return;
                    
                    quiz.showingFeedback = false;
                    quiz.selectedAnswer = null;
                    
                    if (quiz.currentIndex < quiz.questions.length - 1) {
                        quiz.currentIndex++;
                        this.renderQuestion(elementId);
                    } else {
                        this.showResults(elementId);
                    }
                },
                
                prevQuestion: function(elementId) {
                    var quiz = quizzes[elementId];
                    if (!quiz || quiz.currentIndex === 0 || quiz.showingFeedback) return;
                    
                    quiz.currentIndex--;
                    quiz.selectedAnswer = quiz.answers[quiz.currentIndex] ? quiz.answers[quiz.currentIndex].selectedAlternativeId : null;
                    quiz.answers.pop();
                    this.renderQuestion(elementId);
                },
                
                showResults: function(elementId) {
                    var quiz = quizzes[elementId];
                    if (!quiz) return;
                    
                    var container = document.querySelector('.quiz-player-container[data-element-id="' + elementId + '"]');
                    if (!container) return;
                    
                    var correctCount = quiz.answers.filter(function(a) { return a.isCorrect; }).length;
                    var totalCount = quiz.answers.length;
                    var percentage = totalCount > 0 ? (correctCount / totalCount) * 100 : 0;
                    var score = Math.round(percentage) / 10;
                    var passed = percentage >= (quiz.config.passingScore || 60);
                    
                    var html = '<style>.quiz-scroll::-webkit-scrollbar{width:4px;}.quiz-scroll::-webkit-scrollbar-thumb{background:rgba(100,116,139,0.4);border-radius:4px;}.quiz-scroll{scrollbar-width:thin;}</style>' +
                        '<div class="quiz-scroll" style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:16px;background:linear-gradient(135deg,#1e293b,#0f172a);color:#fff;overflow:auto;border-radius:12px;">' +
                        '<div style="max-width:360px;width:100%;background:#0f172a;border-radius:12px;padding:20px;text-align:center;">' +
                        '<div style="width:60px;height:60px;margin:0 auto 12px;border-radius:50%;display:flex;align-items:center;justify-content:center;' +
                        (passed ? 'background:rgba(34,197,94,0.2);' : 'background:rgba(239,68,68,0.2);') + '">' +
                        '<span style="font-size:32px;">' + (passed ? '🏆' : '⚠️') + '</span></div>' +
                        '<h2 style="font-size:20px;font-weight:bold;margin-bottom:4px;">' + (passed ? 'Parabéns!' : 'Não foi dessa vez') + '</h2>' +
                        '<p style="color:#94a3b8;font-size:13px;margin-bottom:16px;">' + (passed ? 'Você atingiu a nota mínima' : 'Tente novamente para melhorar') + '</p>' +
                        '<div style="margin-bottom:16px;">' +
                        '<div style="font-size:48px;font-weight:bold;line-height:1;' + (passed ? 'color:#22c55e;' : 'color:#ef4444;') + '">' + score.toFixed(1) + '</div>' +
                        '<p style="color:#94a3b8;font-size:12px;margin-top:4px;">de 10</p></div>' +
                        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;padding:12px;background:#1e293b;border-radius:8px;">' +
                        '<div><p style="font-size:20px;font-weight:bold;color:#22c55e;margin:0;">' + correctCount + '</p><p style="font-size:11px;color:#94a3b8;margin:2px 0 0;">Corretas</p></div>' +
                        '<div><p style="font-size:20px;font-weight:bold;color:#ef4444;margin:0;">' + (totalCount - correctCount) + '</p><p style="font-size:11px;color:#94a3b8;margin:2px 0 0;">Incorretas</p></div></div>' +
                        '<div style="margin-bottom:16px;">' +
                        '<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;"><span>Aproveitamento</span><span>' + Math.round(percentage) + '%</span></div>' +
                        '<div style="height:8px;background:#334155;border-radius:4px;overflow:hidden;">' +
                        '<div style="height:100%;width:' + percentage + '%;' + (passed ? 'background:#22c55e;' : 'background:#ef4444;') + '"></div></div>' +
                        '<p style="font-size:11px;color:#94a3b8;margin-top:4px;">Nota mínima: ' + (quiz.config.passingScore || 60) + '%</p></div>' +
                        '<button style="width:100%;padding:10px 20px;background:linear-gradient(135deg,#06b6d4,#8b5cf6);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;" onclick="QuizController.restartQuiz(\'' + elementId + '\')">🔄 Tentar Novamente</button>' +
                        '</div></div>';
                    
                    container.innerHTML = html;
                },
                
                restartQuiz: function(elementId) {
                    var quiz = quizzes[elementId];
                    if (!quiz) return;
                    
                    quiz.currentIndex = 0;
                    quiz.answers = [];
                    quiz.selectedAnswer = null;
                    quiz.showingFeedback = false;
                    
                    if (quiz.config.shuffleQuestions !== false) {
                        quiz.questions = shuffleArray(quiz.questions);
                    }
                    if (quiz.config.shuffleAlternatives !== false) {
                        quiz.questions = quiz.questions.map(function(q) {
                            return Object.assign({}, q, { alternatives: shuffleArray(q.alternatives || []) });
                        });
                    }
                    
                    this.renderQuestion(elementId);
                }
            };
        })();
        
        // Initialize QuizController with course data
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof courseData !== 'undefined' && courseData.questions) {
                QuizController.init(courseData);
                console.log('QuizController initialized with ' + courseData.questions.length + ' questions');
            } else {
                console.log('No questions found in courseData');
            }
        });

        // ScenarioController for interactive scenario playback in exports
        var ScenarioController = (function() {
            var scenarios = {};

            return {
                startScenario: function(elementId) {
                    var container = document.querySelector('.scenario-player-container[data-element-id="' + elementId + '"]');
                    if (!container) return;
                    var data = (window.__scenarioDataMap && window.__scenarioDataMap[elementId]) || null;
                    if (!data) { console.error('[ScenarioController] No scenario data for:', elementId); return; }
                    var nodesMap = {};
                    var maxPoints = 0;
                    (data.nodes || []).forEach(function(n) {
                        nodesMap[n.id] = n;
                        if (!n.is_ending && n.choices && n.choices.length > 0) {
                            var best = 0;
                            n.choices.forEach(function(c) { if ((c.points || 0) > best) best = c.points || 0; });
                            maxPoints += best;
                        }
                    });
                    scenarios[elementId] = {
                        data: data,
                        nodesMap: nodesMap,
                        currentNodeId: data.start_node_id || (data.nodes && data.nodes[0] ? data.nodes[0].id : null),
                        history: [],
                        totalPoints: 0,
                        optimalCount: 0,
                        totalDecisions: 0,
                        maxPoints: maxPoints || 1,
                        container: container
                    };
                    this.renderNode(elementId);
                },

                renderNode: function(elementId) {
                    var sc = scenarios[elementId];
                    if (!sc) return;
                    var node = sc.nodesMap[sc.currentNodeId];
                    if (!node) return;

                    if (node.is_ending) {
                        this.renderEnding(elementId, node);
                        return;
                    }

                    var iconColor = '#22d3ee';
                    var html = '<div style="display:flex;flex-direction:column;height:100%;background:linear-gradient(180deg,#0f172a,#1e293b);border-radius:12px;overflow:hidden;">';
                    // Header
                    html += '<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:rgba(30,41,59,0.8);border-bottom:1px solid rgba(51,65,85,0.5);">';
                    html += '<div style="display:flex;align-items:center;gap:8px;"><svg style="width:16px;height:16px;color:' + iconColor + ';" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 3v12"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></svg>';
                    html += '<span style="font-size:12px;color:#cbd5e1;font-weight:500;">' + (sc.data.title || 'Cenário') + '</span></div>';
                    html += '<div style="display:flex;align-items:center;gap:12px;">';
                    html += '<span style="font-size:11px;color:#64748b;">Cena ' + (sc.history.length + 1) + '</span>';
                    html += '<span style="font-size:11px;color:#fbbf24;">★ ' + sc.optimalCount + '/' + sc.totalDecisions + '</span>';
                    html += '</div></div>';
                    // Content
                    html += '<div style="flex:1;overflow-y:auto;padding:16px;">';
                    if (node.character_speaking) {
                        html += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;">';
                        html += '<div style="width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#06b6d4,#2563eb);display:flex;align-items:center;justify-content:center;flex-shrink:0;">';
                        html += '<svg style="width:14px;height:14px;color:#fff;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>';
                        html += '<span style="font-size:12px;font-weight:500;color:#67e8f9;">' + node.character_speaking + '</span></div>';
                    }
                    html += '<h3 style="font-size:16px;font-weight:600;color:#fff;margin-bottom:8px;">' + (node.title || '') + '</h3>';
                    html += '<p style="font-size:14px;color:#cbd5e1;line-height:1.6;margin-bottom:16px;white-space:pre-line;">' + (node.narrative || '') + '</p>';
                    // Choices
                    if (node.choices && node.choices.length > 0) {
                        html += '<p style="font-size:12px;color:#64748b;margin-bottom:8px;font-weight:500;">O que você faria?</p>';
                        node.choices.forEach(function(choice, idx) {
                            var letter = String.fromCharCode(65 + idx);
                            html += '<button onclick="ScenarioController.selectChoice(\'' + elementId + '\',\'' + choice.id + '\')" style="display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:10px 12px;margin-bottom:8px;border-radius:8px;border:1px solid rgba(51,65,85,0.5);background:rgba(30,41,59,0.5);color:#e2e8f0;font-size:13px;cursor:pointer;transition:all 0.2s;" onmouseover="this.style.background=\'rgba(51,65,85,0.7)\';this.style.borderColor=\'rgba(34,211,238,0.4)\';" onmouseout="this.style.background=\'rgba(30,41,59,0.5)\';this.style.borderColor=\'rgba(51,65,85,0.5)\';">';
                            html += '<span style="width:24px;height:24px;border-radius:50%;background:#334155;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;font-weight:bold;color:#94a3b8;">' + letter + '</span>';
                            html += '<span style="flex:1;">' + (choice.text || '') + '</span>';
                            html += '<span style="color:#475569;font-size:16px;">›</span></button>';
                        });
                    }
                    html += '</div></div>';
                    sc.container.innerHTML = html;
                },

                selectChoice: function(elementId, choiceId) {
                    var sc = scenarios[elementId];
                    if (!sc) return;
                    var node = sc.nodesMap[sc.currentNodeId];
                    if (!node) return;
                    var choice = node.choices.find(function(c) { return c.id === choiceId; });
                    if (!choice) return;
                    sc.totalPoints += (choice.points || 0);
                    sc.totalDecisions += 1;
                    if (choice.is_optimal) sc.optimalCount += 1;
                    this.renderFeedback(elementId, choice);
                },

                renderFeedback: function(elementId, choice) {
                    var sc = scenarios[elementId];
                    if (!sc) return;
                    var fbColor = choice.is_optimal ? '#10b981' : '#f59e0b';
                    var fbBg = choice.is_optimal ? 'rgba(16,185,129,0.1)' : 'rgba(245,158,11,0.1)';
                    var fbBorder = choice.is_optimal ? 'rgba(16,185,129,0.3)' : 'rgba(245,158,11,0.3)';
                    var fbLabel = choice.is_optimal ? 'Excelente escolha!' : 'Considere outras perspectivas';
                    var fbIcon = choice.is_optimal ? '✓' : '⚠';

                    var html = '<div style="display:flex;flex-direction:column;height:100%;background:linear-gradient(180deg,#0f172a,#1e293b);border-radius:12px;overflow:hidden;padding:16px;">';
                    html += '<div style="padding:10px 12px;border-radius:8px;background:rgba(51,65,85,0.4);border:1px solid rgba(51,65,85,0.4);margin-bottom:12px;">';
                    html += '<p style="font-size:11px;color:#64748b;margin-bottom:4px;">Sua escolha:</p>';
                    html += '<p style="font-size:13px;color:#fff;">' + (choice.text || '') + '</p></div>';
                    html += '<div style="padding:10px 12px;border-radius:8px;background:' + fbBg + ';border:1px solid ' + fbBorder + ';margin-bottom:12px;">';
                    html += '<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;">';
                    html += '<span style="color:' + fbColor + ';font-size:14px;">' + fbIcon + '</span>';
                    html += '<span style="font-size:12px;font-weight:500;color:' + fbColor + ';">' + fbLabel + '</span>';
                    if (choice.points > 0) html += '<span style="margin-left:auto;font-size:11px;color:#fbbf24;">+' + choice.points + ' pts</span>';
                    html += '</div>';
                    html += '<p style="font-size:13px;color:#cbd5e1;line-height:1.5;">' + (choice.feedback || '') + '</p></div>';
                    html += '<button onclick="ScenarioController.proceed(\'' + elementId + '\',\'' + (choice.next_node_id || '') + '\')" style="width:100%;padding:10px 20px;background:linear-gradient(135deg,#0891b2,#2563eb);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;">Continuar →</button>';
                    html += '</div>';
                    sc.container.innerHTML = html;
                },

                proceed: function(elementId, nextNodeId) {
                    var sc = scenarios[elementId];
                    if (!sc) return;
                    sc.history.push(sc.currentNodeId);
                    if (nextNodeId && sc.nodesMap[nextNodeId]) {
                        sc.currentNodeId = nextNodeId;
                        this.renderNode(elementId);
                    } else {
                        // Ended without explicit ending node
                        this.renderEnding(elementId, sc.nodesMap[sc.currentNodeId] || {});
                    }
                },

                renderEnding: function(elementId, node) {
                    var sc = scenarios[elementId];
                    if (!sc) return;
                    var calcScore = sc.totalDecisions > 0 
                        ? Math.round((sc.optimalCount / sc.totalDecisions) * 100) 
                        : 0;
                    var endColor = calcScore >= 80 ? '#10b981' : calcScore >= 50 ? '#f59e0b' : '#ef4444';
                    var endIcon = calcScore >= 80 ? '🏆' : calcScore >= 50 ? '⚠' : '✗';

                    var html = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;background:linear-gradient(180deg,#0f172a,#1e293b);border-radius:12px;padding:24px;text-align:center;">';
                    html += '<div style="font-size:48px;margin-bottom:12px;">' + endIcon + '</div>';
                    html += '<h2 style="font-size:20px;font-weight:bold;color:' + endColor + ';margin-bottom:8px;">' + (node.title || 'Fim') + '</h2>';
                    html += '<p style="font-size:14px;color:#cbd5e1;max-width:400px;line-height:1.6;margin-bottom:16px;">' + (node.narrative || '') + '</p>';
                    html += '<div style="display:flex;align-items:center;gap:8px;background:rgba(51,65,85,0.5);padding:8px 16px;border-radius:999px;margin-bottom:8px;">';
                    html += '<span style="color:#fbbf24;">★</span><span style="color:#fff;font-weight:600;">Pontuação: ' + calcScore + '%</span></div>';
                    html += '<div style="display:flex;flex-direction:column;align-items:center;gap:4px;margin-bottom:16px;">';
                    html += '<span style="font-size:12px;color:#94a3b8;">Decisões ideais: ' + sc.optimalCount + ' de ' + sc.totalDecisions + '</span>';
                    html += '</div>';
                    html += '<button onclick="ScenarioController.startScenario(\'' + elementId + '\')" style="padding:10px 20px;background:transparent;border:1px solid rgba(34,211,238,0.5);color:#22d3ee;border-radius:8px;font-size:14px;cursor:pointer;">↻ Tentar Novamente</button>';
                    html += '</div>';
                    sc.container.innerHTML = html;
                }
            };
        })();
    </script>

    <script>/**
 * AI Tutor Chat Widget for SCORM/HTML Courses
 * Slide-aware: reads the current slide content and provides contextual explanations
 * Communicates with the backend Gemini API for course-specific tutoring
 */
var AiTutor = (function() {
    var config = {};
    var history = [];
    var sessionId = 'tutor-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9);
    var messagesUsed = 0;
    var isOpen = false;
    var isLoading = false;
    var currentSlideIndex = 0;
    var slideContexts = [];

    function init(tutorConfig) {
        config = tutorConfig || {};
        if (!config.enabled) return;
        slideContexts = config.slideContexts || [];
        buildUI();
        addWelcomeMessage();
    }

    function buildUI() {
        // Inject CSS (skip if already inlined in HTML export)
        if (!config.cssInlined) {
            var cssLink = document.createElement('link');
            cssLink.rel = 'stylesheet';
            cssLink.href = 'styles/tutor.css';
            document.head.appendChild(cssLink);
        }

        // FAB button
        var fab = document.createElement('button');
        fab.className = 'tutor-fab';
        fab.id = 'tutor-fab';
        fab.setAttribute('data-testid', 'tutor-fab-button');
        fab.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span class="tutor-badge"></span>';
        fab.onclick = togglePanel;
        document.body.appendChild(fab);

        // Chat panel
        var panel = document.createElement('div');
        panel.className = 'tutor-panel';
        panel.id = 'tutor-panel';
        panel.setAttribute('data-testid', 'tutor-chat-panel');

        var tutorName = config.tutorName || 'Tutor IA';
        var courseTopic = config.courseTopic || 'este curso';

        // Build suggestions HTML
        var suggestionsHtml = '';
        var suggestions = config.suggestedQuestions || [];
        // Add default slide-aware suggestion
        var allSuggestions = ['Explique o conteudo deste slide'].concat(suggestions);
        suggestionsHtml = '<div class="tutor-suggestions" id="tutor-suggestions" data-testid="tutor-suggestions">';
        for (var i = 0; i < allSuggestions.length && i < 4; i++) {
            suggestionsHtml += '<button class="tutor-suggestion-btn" data-testid="tutor-suggestion-' + i + '" onclick="AiTutor.sendSuggestion(this)">' + escapeHtml(allSuggestions[i]) + '</button>';
        }
        suggestionsHtml += '</div>';

        panel.innerHTML =
            '<div class="tutor-header">' +
                '<div class="tutor-avatar">&#x1F393;</div>' +
                '<div class="tutor-header-info">' +
                    '<h3>' + escapeHtml(tutorName) + '</h3>' +
                    '<p>Assistente do curso</p>' +
                '</div>' +
                '<button class="tutor-close" data-testid="tutor-close-button" onclick="AiTutor.toggle()">&#x2715;</button>' +
            '</div>' +
            '<div class="tutor-slide-indicator" id="tutor-slide-indicator" data-testid="tutor-slide-indicator"></div>' +
            suggestionsHtml +
            '<div class="tutor-messages" id="tutor-messages" data-testid="tutor-messages">' +
                '<div class="tutor-typing" id="tutor-typing"><span></span><span></span><span></span></div>' +
            '</div>' +
            '<div class="tutor-counter" id="tutor-counter" data-testid="tutor-counter"></div>' +
            '<div class="tutor-input-area">' +
                '<input class="tutor-input" id="tutor-input" data-testid="tutor-input" placeholder="Pergunte sobre este slide..." />' +
                '<button class="tutor-send" id="tutor-send" data-testid="tutor-send-button" onclick="AiTutor.send()">' +
                    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>' +
                '</button>' +
            '</div>';

        document.body.appendChild(panel);

        // Stop ALL keyboard events from propagating to the SCORM player
        var tutorInput = document.getElementById('tutor-input');
        tutorInput.addEventListener('keydown', function(e) {
            e.stopPropagation();
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                AiTutor.send();
            }
        });
        tutorInput.addEventListener('keyup', function(e) { e.stopPropagation(); });
        tutorInput.addEventListener('keypress', function(e) { e.stopPropagation(); });

        updateCounter();
        updateSlideIndicator();
    }

    function addWelcomeMessage() {
        var tutorName = config.tutorName || 'Tutor IA';
        var topic = config.courseTopic || 'este curso';
        var welcome = 'Ola! Sou o <strong>' + escapeHtml(tutorName) + '</strong>, seu assistente para o curso sobre <strong>' + escapeHtml(topic) + '</strong>. Posso explicar o conteudo de cada slide - basta perguntar!';
        appendMessage('assistant', welcome);
    }

    function onSlideChange(slideIndex) {
        currentSlideIndex = slideIndex;
        updateSlideIndicator();
    }

    function updateSlideIndicator() {
        var indicator = document.getElementById('tutor-slide-indicator');
        if (indicator) {
            var slideNum = currentSlideIndex + 1;
            var ctx = slideContexts[currentSlideIndex];
            if (ctx) {
                var preview = ctx.length > 60 ? ctx.substring(0, 60) + '...' : ctx;
                indicator.innerHTML = '<strong>Slide ' + slideNum + '</strong>: ' + escapeHtml(preview);
            } else {
                indicator.innerHTML = '<strong>Slide ' + slideNum + '</strong>';
            }
            indicator.style.display = 'block';
        }
    }

    function getCurrentSlideContext() {
        var ctx = slideContexts[currentSlideIndex] || '';
        var slideNum = currentSlideIndex + 1;
        return 'O aluno esta no Slide ' + slideNum + '. Conteudo do slide atual:\n' + ctx;
    }

    function togglePanel() {
        isOpen = !isOpen;
        var panel = document.getElementById('tutor-panel');
        if (panel) {
            if (isOpen) {
                panel.classList.add('open');
                var input = document.getElementById('tutor-input');
                if (input) input.focus();
                updateSlideIndicator();
            } else {
                panel.classList.remove('open');
            }
        }
    }

    function appendMessage(role, text) {
        var container = document.getElementById('tutor-messages');
        if (!container) return;
        var typing = document.getElementById('tutor-typing');
        var div = document.createElement('div');
        div.className = 'tutor-msg ' + role;
        div.innerHTML = role === 'assistant' ? formatMarkdown(text) : escapeHtml(text);
        container.insertBefore(div, typing);
        container.scrollTop = container.scrollHeight;
    }

    function showTyping(show) {
        var el = document.getElementById('tutor-typing');
        if (el) el.className = show ? 'tutor-typing show' : 'tutor-typing';
    }

    function updateCounter() {
        var el = document.getElementById('tutor-counter');
        var limit = config.messageLimit || 50;
        if (el) {
            el.textContent = messagesUsed + ' / ' + limit + ' mensagens';
        }
    }

    function setLoading(val) {
        isLoading = val;
        var btn = document.getElementById('tutor-send');
        var input = document.getElementById('tutor-input');
        if (btn) btn.disabled = val;
        if (input) input.disabled = val;
        showTyping(val);
    }

    function send() {
        if (isLoading) return;
        var input = document.getElementById('tutor-input');
        var text = input ? input.value.trim() : '';
        if (!text) return;

        input.value = '';
        appendMessage('user', text);
        history.push({ role: 'user', content: text });
        messagesUsed++;
        updateCounter();

        // Hide suggestions after first message
        var sugg = document.getElementById('tutor-suggestions');
        if (sugg) sugg.style.display = 'none';

        setLoading(true);

        // Build context: current slide + general course context
        var slideContext = getCurrentSlideContext();
        var fullContext = slideContext + '\n\n--- Contexto geral do curso ---\n' + (config.courseContext || '');

        var payload = {
            message: text,
            courseTopic: config.courseTopic || '',
            courseContext: fullContext,
            history: history,
            sessionId: sessionId
        };

        fetch(config.apiUrl + '/api/tutor/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(function(res) {
            if (!res.ok) {
                return res.text().then(function(text) {
                    throw new Error('HTTP ' + res.status + ': ' + text.substring(0, 200));
                });
            }
            return res.json();
        })
        .then(function(data) {
            setLoading(false);
            if (data.response) {
                appendMessage('assistant', data.response);
                history.push({ role: 'assistant', content: data.response });
            }
            if (data.limitReached) {
                var input = document.getElementById('tutor-input');
                if (input) { input.disabled = true; input.placeholder = 'Limite de mensagens atingido'; }
                var btn = document.getElementById('tutor-send');
                if (btn) btn.disabled = true;
            }
            if (data.messagesUsed) messagesUsed = data.messagesUsed;
            updateCounter();
        })
        .catch(function(err) {
            setLoading(false);
            var errorMsg = 'Desculpe, ocorreu um erro ao conectar com o tutor.';
            if (err.message) {
                errorMsg += ' (' + err.message + ')';
            }
            appendMessage('assistant', errorMsg);
            console.error('Tutor error:', err, 'API URL:', config.apiUrl);
        });
    }

    function sendSuggestion(btn) {
        var input = document.getElementById('tutor-input');
        if (input) {
            input.value = btn.textContent;
            send();
        }
    }

    function escapeHtml(text) {
        var div = document.createElement('div');
        div.appendChild(document.createTextNode(text));
        return div.innerHTML;
    }

    function formatMarkdown(text) {
        if (!text) return '';
        return text
            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
            .replace(/\*(.*?)\*/g, '<em>$1</em>')
            .replace(/`(.*?)`/g, '<code>$1</code>')
            .replace(/\n\n/g, '</p><p>')
            .replace(/\n- /g, '</p><ul><li>')
            .replace(/\n\d+\. /g, '</p><ol><li>')
            .replace(/\n/g, '<br>')
            .replace(/^/, '<p>')
            .replace(/$/, '</p>');
    }

    return {
        init: init,
        toggle: togglePanel,
        send: send,
        sendSuggestion: sendSuggestion,
        onSlideChange: onSlideChange
    };
})();
</script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof AiTutor !== 'undefined') {
                var tutorConfig = {"enabled": true, "apiUrl": "https://browser-video-gen.preview.emergentagent.com", "tutorName": "Tutor especialista do Curso", "messageLimit": 100, "suggestedQuestions": ["Explique este slide!"], "courseTopic": "Liderança de Impacto: Do Fundamental à Gestão de Alta Performance", "courseContext": "Slide: Liderança de Impacto\nConteudo: Liderança de Impacto\nSeja bem-vindo a uma jornada de transformação profissional desenhada para elevar seu patamar de influência e resultados. Neste curso, exploraremos como a liderança moderna transcende a gestão de tarefas, focando no desenvolvimento de pessoas e na criação de valor sustentável para a organização. Prepare-se para transitar de um executor técnico para um estrategista que inspira equipes a alcançarem o extraordinário através de competências comportamentais e decisões assertivas. | Trilha do Curso1. Abertura2. O Líder do Século XXI3. Comunicação e Influência4. Motivação e Alta Performance5. Gestão de Conflitos e Decisão6. Conclusão e Próximos Passos\nNotas: Slide de abertura: O instrutor deve demonstrar entusiasmo e estabelecer a promessa de transformação na carreira do aluno.\nNarracao: BEM-VINDOS CURSO LIDERANÇA IMPACTO. OBJETIVO: ENSINAR VOCÊ LIDERAR EQUIPES ALTA PERFORMANCE. VAMOS APRENDER FUNDAMENTOS, COMUNICAÇÃO E MOTIVAÇÃO. PREPARADOS?\n---\nSlide: Mindset: Chefe vs. Líder\nConteudo: O Líder do Século XXI\nMindset: Chefe vs. Líder | Mindset: A Diferença entre Autoridade e InfluênciaA Evolução da GestãoA transição do modelo de comando e controle para a liderança inspiradora é o pilar central da gestão moderna. Enquanto o chefe tradicional baseia seu poder na hierarquia e no medo, o líder contemporâneo utiliza a inteligência emocional para engajar e desenvolver talentos. Esta mudança de paradigma é essencial em ambientes de trabalho voláteis e complexos, onde a retenção de talentos depende mais da cultura organizacional do que apenas de salários competitivos.Pontos-Chave de DiferenciaçãoFoco em Resultados vs. Pessoas: O chefe foca exclusivamente nas metas numéricas (o 'quê'), enquanto o líder foca em quem entrega o resultado (o 'quem'), entendendo que pessoas motivadas superam metas naturalmente.Direcionamento vs. Desenvolvimento: O chefe diz 'vá', delegando ordens; o líder diz 'vamos', mentorando sua equipe para que cada membro ganhe autonomia e competência técnica.Cultura do Erro: Em modelos autoritários, o erro é punido, gerando estagnação. Na liderança de impacto, o erro é visto como uma oportunidade de aprendizado e inovação segura.Na PráticaPara aplicar este conceito hoje, substitua o monitoramento constante de microgerenciamento por reuniões de alinhamento e feedforwards. Em vez de perguntar 'por que você não terminou?', experimente perguntar 'que recurso ou suporte você precisa para concluir essa entrega com excelência?'. Essa mudança simples de linguagem desloca o foco da culpa para a solução conjunta.\nNotas: Enfatizar que ser líder não significa ser 'bonzinho', mas sim ser focado em desenvolvimento e resultados sustentáveis.\nNarracao: DIFERENÇA CHEFE E LÍDER. CHEFE MANDA, FOCO SÓ RESULTADO. LÍDER INSPIRA, FOCO PESSOAS E DESENVOLVIMENTO. LÍDER CONSTRÓI CONFIANÇA.\n---\nSlide: O Desafio da Transição\nConteudo: CENÁRIO - O Líder do Século XXI | Simulação Interativa\n\nA Escalada do Líder: Delegação Estratégica\nEste cenário interativo coloca o gestor de primeira viagem no dilema entre manter-se operacional ou focar na gestão estratégica, aprendendo a identificar e executar a delegação eficaz de tarefas técnicas.\nNotas: O cenário deve levar o aluno a perceber que o microgerenciamento causa gargalos no fluxo de trabalho.\nNarracao: AGORA PRÁTICA. VOCÊ É LÍDER. MUITA TAREFA TÉCNICA E EQUIPE PRECISA VOCÊ. VOCÊ DELEGA OU FAZ TUDO SOZINHO? ESCOLHA.\n---\nSlide: Verificação de Fundamentos\nConteudo: QUIZ - O Líder do Século XXI | Hora de Praticar!\n\nTeste seus Conhecimentos\nResponda as perguntas para verificar seu aprendizado sobre O Líder do Século XXI\nNotas: Certifique-se de que o aluno compreenda as justificativas para cada resposta correta.\nNarracao: HORA TESTE. TRÊS PERGUNTAS SOBRE LIDERANÇA. RESPONDA COM ATENÇÃO. VAMOS VER SE VOCÊ APRENDEU.\n---\nSlide: Escuta Ativa e Empatia\nConteudo: Comunicação e Influência\nEscuta Ativa e Empatia | Escuta Ativa e EmpatiaA Base da InfluênciaA comunicação eficaz na liderança intermediária exige mais do que apenas falar com clareza; ela requer a habilidade de ouvir com intenção. A Escuta Ativa é um processo psicoterapêutico adaptado ao mundo corporativo que visa garantir que o receptor compreenda não apenas as palavras, mas a intenção e os sentimentos do emissor. Ao aplicar a empatia cognitiva, o líder consegue se colocar na perspectiva do liderado, removendo ruídos e julgamentos que frequentemente bloqueiam a produtividade da equipe.Técnicas de ConexãoEspelhamento (Mirroring): Repetir sutilmente as últimas palavras ou termos-chave usados pelo colaborador para criar rapport e validar que você está sintonizado na mesma frequência.Validação Emocional: Reconhecer o sentimento por trás do discurso, utilizando frases como 'Eu percebo que essa mudança de processo está gerando insegurança em você', o que reduz a resistência defensiva.Silêncio Estratégico: Permitir pausas de 3 a 5 segundos após a fala do liderado, dando espaço para que ele processe pensamentos complexos e se sinta encorajado a compartilhar informações mais profundas.Parafraseamento: Resumir com suas próprias palavras o que foi dito para garantir o alinhamento total: 'Então, se entendi bem, seu principal desafio atual é a gestão do tempo com as novas demandas?'.Na PráticaImagine uma reunião de 1:1 onde um colaborador parece evasivo. Em vez de cobrar entregas imediatamente, utilize o espelhamento para demonstrar presença. Ao validar as dificuldades dele antes de propor soluções, você quebra a barreira do medo, transformando uma conversa tensa em uma sessão de resolução conjunta de problemas, aumentando o engajamento e a confiança mútua.\nNotas: Enfatize que a escuta ativa não é passiva; ela gasta energia mental. Sugira que os alunos pratiquem o espelhamento em conversas informais primeiro.\nNarracao: Líder precisa escutar com atenção. Usar técnica: repetir palavras, entender sentimento do colega e dar tempo para falar. Isso cria confiança na equipe.\n---\nSlide: Feedback: O Modelo SCI\nConteudo: Comunicação e Influência\nFeedback: O Modelo SCI | Feedback: O Modelo SCIEstruturando Conversas de Alta PerformanceO modelo SCI (Situação, Comportamento e Impacto), desenvolvido pelo Center for Creative Leadership, é uma das ferramentas mais poderosas para remover a subjetividade e a defensividade das sessões de feedback. Líderes de alto impacto utilizam esta estrutura para transformar críticas vagas em oportunidades de aprendizado mensuráveis. Ao focar em fatos observáveis em vez de traços de personalidade, o líder garante que a conversa permaneça profissional e focada no desenvolvimento contínuo.Os Pilares do SCISituação: Defina o contexto específico no tempo e no espaço. Evite termos genéricos como 'sempre' ou 'nunca'. Exemplo: 'Na reunião de apresentação de resultados da última terça-feira...'.Comportamento: Descreva apenas o que foi observado fisicamente ou ouvido, sem julgamentos de valor. Exemplo: '...você interrompeu a fala do diretor financeiro três vezes antes dele concluir o raciocínio'.Impacto: Explique as consequências reais daquele comportamento para a equipe ou para o negócio. Exemplo: 'Isso causou um desconforto visível na sala e impediu que os dados críticos fossem apresentados na íntegra'.Na PráticaAo utilizar o SCI, você retira o 'peso' emocional do erro. Em vez de dizer 'Você é desorganizado' (que ataca a identidade), você diz: 'No projeto X (Situação), você entregou o relatório com 2 dias de atraso (Comportamento), o que obrigou a equipe de design a fazer hora extra para compensar (Impacto)'. Essa abordagem gera clareza e um compromisso muito maior com a mudança de atitude.\nNotas: Explique que o 'Impacto' é a parte mais negligenciada pelos líderes, mas é a que gera a verdadeira mudança de comportamento.\nNarracao: Feedback usar regra SCI: 1 - Contexto (Onde/Quando), 2 - Ação (O que pessoa fez), 3 - Consequência (O que causou). Ajuda a melhorar trabalho sem briga.\n---\nSlide: O Feedback Difícil\nConteudo: CENÁRI", "slideContexts": ["Liderança de Impacto Seja bem-vindo a uma jornada de transformação profissional desenhada para elevar seu patamar de influência e resultados. Neste curso, exploraremos como a liderança moderna transcende a gestão de tarefas, focando no desenvolvimento de pessoas e na criação de valor sustentável para a organização. Prepare-se para transitar de um executor técnico para um estrategista que inspira equipes a alcançarem o extraordinário através de competências comportamentais e decisões assertivas. | Trilha do Curso 1. Abertura 2. O Líder do Século XXI 3. Comunicação e Influência 4. Motivação e Alta Performance 5. Gestão de Conflitos e Decisão 6. Conclusão e Próximos Passos | Notas: Slide de abertura: O instrutor deve demonstrar entusiasmo e estabelecer a promessa de transformação na carreira do aluno. | Narracao: BEM-VINDOS CURSO LIDERANÇA IMPACTO. OBJETIVO: ENSINAR VOCÊ LIDERAR EQUIPES ALTA PERFORMANCE. VAMOS APRENDER FUNDAMENTOS, COMUNICAÇÃO E MOTIVAÇÃO. PREPARADOS?", "O Líder do Século XXI Mindset: Chefe vs. Líder | Mindset: A Diferença entre Autoridade e Influência A Evolução da Gestão A transição do modelo de comando e controle para a liderança inspiradora é o pilar central da gestão moderna. Enquanto o chefe tradicional baseia seu poder na hierarquia e no medo, o líder contemporâneo utiliza a inteligência emocional para engajar e desenvolver talentos. Esta mudança de paradigma é essencial em ambientes de trabalho voláteis e complexos, onde a retenção de talentos depende mais da cultura organizacional do  | Notas: Enfatizar que ser líder não significa ser 'bonzinho', mas sim ser focado em desenvolvimento e resultados sustentáveis. | Narracao: DIFERENÇA CHEFE E LÍDER. CHEFE MANDA, FOCO SÓ RESULTADO. LÍDER INSPIRA, FOCO PESSOAS E DESENVOLVIMENTO. LÍDER CONSTRÓI CONFIANÇA.", "CENÁRIO - O Líder do Século XXI | Simulação Interativa A Escalada do Líder: Delegação Estratégica Este cenário interativo coloca o gestor de primeira viagem no dilema entre manter-se operacional ou focar na gestão estratégica, aprendendo a identificar e executar a delegação eficaz de tarefas técnicas. | a67b4b3a-cb84-4214-a8a8-f112a490d35f | Notas: O cenário deve levar o aluno a perceber que o microgerenciamento causa gargalos no fluxo de trabalho. | Narracao: AGORA PRÁTICA. VOCÊ É LÍDER. MUITA TAREFA TÉCNICA E EQUIPE PRECISA VOCÊ. VOCÊ DELEGA OU FAZ TUDO SOZINHO? ESCOLHA.", "QUIZ - O Líder do Século XXI | Hora de Praticar! Teste seus Conhecimentos Responda as perguntas para verificar seu aprendizado sobre O Líder do Século XXI | Notas: Certifique-se de que o aluno compreenda as justificativas para cada resposta correta. | Narracao: HORA TESTE. TRÊS PERGUNTAS SOBRE LIDERANÇA. RESPONDA COM ATENÇÃO. VAMOS VER SE VOCÊ APRENDEU.", "Comunicação e Influência Escuta Ativa e Empatia | Escuta Ativa e Empatia A Base da Influência A comunicação eficaz na liderança intermediária exige mais do que apenas falar com clareza; ela requer a habilidade de ouvir com intenção. A Escuta Ativa é um processo psicoterapêutico adaptado ao mundo corporativo que visa garantir que o receptor compreenda não apenas as palavras, mas a intenção e os sentimentos do emissor. Ao aplicar a empatia cognitiva, o líder consegue se colocar na perspectiva do liderado, removendo ruídos e julgamentos que freque | Notas: Enfatize que a escuta ativa não é passiva; ela gasta energia mental. Sugira que os alunos pratiquem o espelhamento em conversas informais primeiro. | Narracao: Líder precisa escutar com atenção. Usar técnica: repetir palavras, entender sentimento do colega e dar tempo para falar. Isso cria confiança na equipe.", "Comunicação e Influência Feedback: O Modelo SCI | Feedback: O Modelo SCI Estruturando Conversas de Alta Performance O modelo SCI (Situação, Comportamento e Impacto) , desenvolvido pelo Center for Creative Leadership, é uma das ferramentas mais poderosas para remover a subjetividade e a defensividade das sessões de feedback. Líderes de alto impacto utilizam esta estrutura para transformar críticas vagas em oportunidades de aprendizado mensuráveis. Ao focar em fatos observáveis em vez de traços de personalidade, o líder garante que a conversa per | Notas: Explique que o 'Impacto' é a parte mais negligenciada pelos líderes, mas é a que gera a verdadeira mudança de comportamento. | Narracao: Feedback usar regra SCI: 1 - Contexto (Onde/Quando), 2 - Ação (O que pessoa fez), 3 - Consequência (O que causou). Ajuda a melhorar trabalho sem briga.", "CENÁRIO - Comunicação e Influência | Simulação Interativa A Queda do Pilar: Gerenciando Desmotivação em Projeto Crítico Um cenário interativo para gestores lidarem com um liderado sênior que apresenta queda de performance e desmotivação, impactando um projeto crucial. O objetivo é aplicar técnicas de feedback, escuta ativa e planejamento colaborativo. | 322324b8-c5fc-4133-83df-bece34a87ca7 | Notas: Monitore as escolhas dos alunos. Se eles escolherem opções agressivas, o cenário deve mostrar o fechamento do canal de comunicação do liderado. | Narracao: Agora praticar! Você é líder e conversa com funcionário desmotivado. Use SCI e escuta ativa. Escolha melhor opção.", "QUIZ - Comunicação e Influência | Hora de Praticar! Teste seus Conhecimentos Responda as perguntas para verificar seu aprendizado sobre Comunicação e Influência | Notas: As perguntas foram desenhadas para reforçar a diferença entre observação de fato e julgamento de valor. | Narracao: Hora do teste! Ler perguntas sobre comunicação e escolher resposta certa. Atenção nos detalhes.", "Motivação e Alta Performance Gatilhos de Engajamento | Gatilhos de Engajamento: A Tríade da Motivação Moderna Para liderar equipes de alta performance no nível intermediário, é fundamental compreender que a motivação não é um evento isolado, mas um estado sustentado por pilares psicológicos profundos. Segundo as teorias modernas de gestão, como a de Daniel Pink, o engajamento genuíno surge quando o ambiente de trabalho nutre necessidades intrínsecas do colaborador. Ao focar em autonomia, maestria e propósito, o líder deixa de ser um 'cobrador de tar | Notas: Enfatize que o excesso de autonomia sem competência técnica pode gerar ansiedade, enquanto muita maestria sem propósito pode gerar tédio. | Narracao: Motivação moderna tem 3 pilares: Autonomia é liberdade com responsabilidade. Maestria é aprender sempre mais. Propósito é entender a importância do trabalho. Líder deve apoiar esses três pontos para equipe crescer.", "Motivação e Alta Performance Reconhecimento vs. Recompensa | Diferenciando Reconhecimento de Recompensa Um erro comum em gestores intermediários é confundir reconhecimento com recompensa financeira ou material. Embora ambos sejam essenciais, eles operam em frequências psicológicas distintas e possuem impactos diferentes na retenção de talentos e na cultura organizacional. A recompensa é transacional e extrínseca, enquanto o reconhecimento é emocional e intrínseco, sendo muitas vezes mais eficaz para sustentar a moral da equipe a longo prazo sem onerar o o | Notas: Sugira ao instrutor que mencione o 'Efeito Overjustification', onde recompensas externas podem diminuir o interesse interno em uma tarefa. | Narracao: Recompensa é dinheiro ou prêmio material. Reconhecimento é elogio e valorização do trabalho. Dinheiro motiva no curto prazo, elogio e valorização motivam no longo prazo. Líder precisa usar os dois.", "CENÁRIO - Motivação e Alta Performance | Simulação Interativa O Dilema do Reconhecimento: Orçamento Zero, Equipe Nota Dez Navegue por um cenário desafiador onde sua equipe superou as expectativas, mas a empresa enfrenta uma crise orçamentária que impede o tradicional bônus. Suas decisões determinarão a motivação e o engajamento do seu time. | 616eaae0-2437-4864-93d5-3715ef144536 | Notas: O cenário deve focar na comunicação assertiva e na substituição do bônus por formas de reconhecimento intrínseco e promessas de desenvolvimento futuro. | Narracao: Cenário interativo: Equipe trabalhou muito, mas empresa não tem dinheiro para bônus agora. Você é o líder. O que fazer para motivar o grupo? Escolha a melhor ação.", "Gestão de Conflitos e Decisão Mediação de Conflitos | Mediação de Conflitos: O Método Ganha-Ganha O conflito em ambientes corporativos é inevitável e, se mal gerido, pode destruir a produtividade. No entanto, para o líder de alta performance, o conflito é uma oportunidade de inovação e melhoria de processos. O método 'Ganha-Ganha', fundamentado na Negociação Baseada em Interesses de Harvard, busca afastar as pessoas do problema e focar na resolução mútua, onde ambas as partes saem satisfeitas com o acordo final. Etapas da Mediação Eficaz Separar as | Notas: Destaque que o silêncio (evitação) é a pior forma de gerir conflitos, pois gera ressentimento crônico na equipe. | Narracao: Resolver conflitos com método Ganha-Ganha. 1: Separe o problema da pessoa. 2: Entenda o que cada um precisa de verdade. 3: Criar soluções boas para os dois lados. 4: Usar regras justas para decidir.", "Gestão de Conflitos e Decisão Tomada de Decisão Assertiva | Tomada de Decisão Assertiva Ferramentas: Matriz de Prioridade e Urgência A tomada de decisão assertiva é uma competência crítica para líderes de alta performance que precisam gerenciar recursos limitados e prazos agressivos. Utilizar uma abordagem metodológica, como a Matriz de Eisenhower , permite que o líder saia do modo 'incêndio' e passe para o modo estratégico. Esta ferramenta ajuda a discernir entre o que demanda atenção imediata e o que contribui para os objetivos de longo prazo da organi | Notas: Enfatize que a delegação (Quadrante 3) é uma ferramenta de desenvolvimento de equipe, não apenas uma forma de se livrar de trabalho. | Narracao: Líder precisa decidir bem. Usamos Matriz de Prioridade. Dividimos tarefas: Urgente e Importante. Focar no Planejamento evita crises. Delegar o que não é essencial. Eliminar distrações.", "CENÁRIO - Gestão de Conflitos e Decisão | Simulação Interativa A Crise do SIGEC: Conflito em Ponto Crítico Navegue um cenário de alta pressão onde dois especialistas seniores entram em conflito durante a entrega final de um projeto crítico, com apenas 24 horas para o lançamento. | bb664d91-3d9a-4162-b4a2-24cb101f1a70 | Notas: O instrutor deve observar se o aluno prioriza a solução do problema ou a punição dos envolvidos. O foco deve ser na mediação e resultado. | Narracao: Cenário: Conflito no time. Prazo acabando. Dois funcionários brigando. Você líder precisa resolver. Escolha melhor ação para projeto e equipe.", "QUIZ - Gestão de Conflitos e Decisão | Hora de Praticar! Teste seus Conhecimentos Responda as perguntas para verificar seu aprendizado sobre Gestão de Conflitos e Decisão | Notas: As perguntas foram desenhadas para testar o discernimento entre urgente vs. importante e a eficácia na mediação. | Narracao: Hora do Quiz. Três perguntas sobre gestão de crise. Escolha a resposta certa. Pense no líder de impacto.", "Conclusão e Próximos Passos Plano de Desenvolvimento Individual (PDI) | Plano de Desenvolvimento Individual (PDI) Orientando sua Evolução como Líder O encerramento deste curso é, na verdade, o início da sua jornada prática. O Plano de Desenvolvimento Individual (PDI) é a ferramenta que transforma o conhecimento teórico adquirido aqui em mudança comportamental sustentável. Um PDI bem estruturado foca no equilíbrio entre as competências técnicas (hard skills) e as competências comportamentais (soft skills) necessárias para o próximo nível da sua carreira. Estrutura do | Notas: Sugira que o aluno compartilhe seu PDI com seu superior imediato para alinhar expectativas e obter suporte organizacional. | Narracao: Conclusão: Criar PDI. Plano para seu crescimento. Escolher metas SMART. Focar em habilidades novas. Buscar mentor. Evolução constante na liderança.", "RESUMO - Conclusão e Próximos Passos | Conclusão da Jornada Recapitulando os 5 Pilares da Liderança de Impacto Chegamos ao final desta trilha de aprendizagem, onde exploramos as competências essenciais que transformam um gestor comum em um líder de alta performance. Consolidar esses conceitos é fundamental para que você possa transitar do conhecimento teórico para a maestria prática no seu cotidiano corporativo, garantindo que sua liderança seja sustentável, ética e voltada para resultados exponenciais. Os Pilares Fundamentais Comuni | Notas: O instrutor deve enfatizar que este é um momento de fechamento, mas também de início da aplicação prática. Incentive os alunos a revisitarem o conteúdo sempre que enfrentarem um desafio específico em um dos 5 pilares. | Narracao: Resumo final curso Liderança. 5 pilares principais: Comunicar bem, Motivar equipe, Decidir certo, Resolver conflitos e Ensinar liderados. Praticar todo dia para ser líder melhor. Parabéns!"], "cssInlined": true};
