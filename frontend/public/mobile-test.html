<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Teste Overlay Mobile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            min-height: 100vh;
        }
        
        /* Player Container */
        #player-container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #0f0f1a;
        }
        
        .slide-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }
        
        @media screen and (orientation: landscape) and (max-height: 500px) {
            .slide-wrapper {
                padding: 5px;
            }
        }
        
        .slide-container {
            width: 960px;
            height: 540px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 50px rgba(0,0,0,0.5);
            transform-origin: center center;
        }
        
        @media screen and (max-width: 900px) {
            .slide-container {
                box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            }
        }
        
        .content {
            text-align: center;
            color: white;
            padding: 20px;
        }
        
        .content h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        
        .content p {
            font-size: 16px;
            opacity: 0.8;
        }
        
        .controls {
            height: 60px;
            background: #16213e;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-top: 1px solid #0f3460;
        }
        
        @media screen and (max-width: 900px) {
            .controls {
                height: 50px;
                padding: 0 10px;
            }
        }
        
        @media screen and (orientation: landscape) and (max-height: 500px) {
            .controls {
                height: 44px;
                padding: 0 8px;
            }
        }
        
        .control-btn {
            background: #0f3460;
            border: none;
            color: #fff;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        
        @media screen and (max-width: 900px) {
            .control-btn {
                padding: 8px 12px;
                font-size: 12px;
            }
        }
        
        .progress-bar {
            flex: 1;
            margin: 0 20px;
            height: 6px;
            background: #0f3460;
            border-radius: 3px;
        }
        
        .progress-fill {
            height: 100%;
            width: 30%;
            background: linear-gradient(90deg, #7c3aed, #06b6d4);
            border-radius: 3px;
        }
        
        /* Mobile Orientation Overlay */
        #orientation-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            z-index: 99999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        
        /* Force display on mobile portrait mode using CSS media query */
        @media screen and (orientation: portrait) and (max-width: 900px) {
            #orientation-overlay {
                display: flex !important;
            }
            #player-container {
                display: none !important;
            }
        }
        
        /* Also detect by aspect ratio for devices that don't report orientation correctly */
        @media screen and (max-aspect-ratio: 4/5) and (max-width: 900px) {
            #orientation-overlay {
                display: flex !important;
            }
            #player-container {
                display: none !important;
            }
        }
        
        .orientation-content {
            text-align: center;
            padding: 30px;
            color: white;
        }
        
        .orientation-icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: pulse 2s ease-in-out infinite;
        }
        
        .orientation-arrow {
            font-size: 50px;
            margin-bottom: 20px;
            animation: rotate-hint 2s ease-in-out infinite;
            display: inline-block;
        }
        
        .orientation-content h2 {
            font-size: 24px;
            margin-bottom: 15px;
            font-weight: 600;
        }
        
        .orientation-content p {
            font-size: 16px;
            opacity: 0.8;
            max-width: 300px;
            margin: 0 auto 30px;
            line-height: 1.5;
        }
        
        .orientation-hint {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            font-size: 40px;
        }
        
        .phone-icon.vertical {
            transform: rotate(0deg);
        }
        
        .phone-icon.horizontal {
            transform: rotate(-90deg);
        }
        
        .arrow {
            animation: slide-right 1.5s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        @keyframes rotate-hint {
            0%, 100% { transform: rotate(0deg); opacity: 1; }
            50% { transform: rotate(90deg); opacity: 0.5; }
        }
        
        @keyframes slide-right {
            0%, 100% { transform: translateX(0); opacity: 1; }
            50% { transform: translateX(10px); opacity: 0.5; }
        }
        
        /* Debug info */
        .debug {
            position: fixed;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: #0f0;
            padding: 10px;
            font-size: 12px;
            font-family: monospace;
            border-radius: 5px;
            z-index: 999999;
        }
    </style>
</head>
<body>
    <!-- Mobile Orientation Overlay -->
    <div id="orientation-overlay">
        <div class="orientation-content">
            <div class="orientation-icon">📱</div>
            <div class="orientation-arrow">↻</div>
            <h2>Rotacione seu dispositivo</h2>
            <p>Para uma melhor experiência, por favor visualize este conteúdo no modo horizontal (paisagem)</p>
            <div class="orientation-hint">
                <span class="phone-icon vertical">📱</span>
                <span class="arrow">→</span>
                <span class="phone-icon horizontal">📱</span>
            </div>
        </div>
    </div>
    
    <!-- Player Container (shown in landscape) -->
    <div id="player-container">
        <div class="slide-wrapper">
            <div class="slide-container" id="slide-container">
                <div class="content">
                    <h1>✅ Modo Paisagem OK!</h1>
                    <p>O slide agora deve ocupar melhor o espaço disponível.</p>
                </div>
            </div>
        </div>
        <div class="controls">
            <button class="control-btn">← Anterior</button>
            <div class="progress-bar"><div class="progress-fill"></div></div>
            <button class="control-btn">Próximo →</button>
        </div>
    </div>
    
    <!-- Debug info -->
    <div class="debug" id="debug"></div>
    
    <script>
        function updateDebug() {
            const debug = document.getElementById('debug');
            const w = window.innerWidth;
            const h = window.innerHeight;
            const orientation = screen.orientation ? screen.orientation.type : 'N/A';
            const ratio = (w/h).toFixed(2);
            
            debug.innerHTML = `
                Width: ${w}px<br>
                Height: ${h}px<br>
                Ratio: ${ratio}<br>
                Orientation: ${orientation}<br>
                Portrait: ${h > w ? 'YES' : 'NO'}
            `;
            
            // Scale the slide to fit
            const slideContainer = document.getElementById('slide-container');
            const slideWrapper = document.querySelector('.slide-wrapper');
            if (slideContainer && slideWrapper) {
                const slideWidth = 960;
                const slideHeight = 540;
                
                const wrapperRect = slideWrapper.getBoundingClientRect();
                const padding = w < 900 ? 10 : 40;
                const availableWidth = wrapperRect.width - padding;
                const availableHeight = wrapperRect.height - padding;
                
                const scaleX = availableWidth / slideWidth;
                const scaleY = availableHeight / slideHeight;
                let scale = Math.min(scaleX, scaleY);
                
                // On mobile, allow up to 1.5x for better visibility
                const isMobile = w < 900 || h < 600;
                const maxScale = isMobile ? 1.5 : 1.0;
                scale = Math.min(scale, maxScale);
                
                slideContainer.style.transform = 'scale(' + scale + ')';
            }
        }
        
        updateDebug();
        window.addEventListener('resize', updateDebug);
        
        // Handle orientation change with multiple updates
        window.addEventListener('orientationchange', function() {
            // Update immediately
            updateDebug();
            // Update again after delays to ensure correct sizing
            setTimeout(updateDebug, 100);
            setTimeout(updateDebug, 300);
            setTimeout(updateDebug, 500);
        });
        
        // Also update after page is fully loaded
        window.addEventListener('load', function() {
            setTimeout(updateDebug, 50);
            setTimeout(updateDebug, 150);
            setTimeout(updateDebug, 300);
        });
    </script>
</body>
</html>
