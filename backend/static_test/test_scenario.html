<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slides manuais</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Lato:wght@300;400;700&family=Merriweather:wght@300;400;700&family=Montserrat:wght@300;400;500;600;700&family=Nunito:wght@300;400;600;700&family=Open+Sans:wght@300;400;600;700&family=Oswald:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&family=PT+Sans:wght@400;700&family=Raleway:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&family=Source+Sans+3:wght@300;400;600;700&family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            overflow: hidden;
        }
        
        #player-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }
        
        #header {
            height: 50px;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        #header h1 {
            color: #fff;
            font-size: 18px;
            font-weight: 500;
        }
        
        #progress-info {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
        }
        
        #main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        
        #sidebar {
            width: 0;
            background: rgba(0, 0, 0, 0.3);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            overflow-y: auto;
            transition: width 0.3s ease;
        }
        
        #sidebar.open {
            width: 250px;
        }
        
        .sidebar-item {
            padding: 10px 15px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: background 0.2s;
        }
        
        .sidebar-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .sidebar-item.active {
            background: rgba(99, 102, 241, 0.3);
            border-left: 3px solid #6366f1;
        }
        
        .sidebar-item-title {
            color: #fff;
            font-size: 14px;
            margin-bottom: 4px;
        }
        
        .sidebar-item-number {
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
        }
        
        #slide-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #0f0f1a;
            overflow: hidden;
        }
        
        @media screen and (orientation: landscape) and (max-height: 500px) {
            #slide-wrapper {
                padding: 5px;
            }
        }
        
        /* AUTO FULLSCREEN on mobile landscape - only for actual mobile devices 
           Using max-height to ensure we're on a true mobile screen in landscape,
           not just a resized desktop window. Mobile landscape typically has height < 500px */
        @media screen and (orientation: landscape) and (max-height: 450px) and (max-width: 950px) {
            #header {
                display: none !important;
            }
            #controls {
                display: none !important;
            }
            #sidebar {
                display: none !important;
            }
            #slide-wrapper {
                padding: 5px !important;
                background: #000 !important;
            }
            #mobile-float-controls {
                display: flex !important;
            }
        }
        
        /* Also apply for touch devices with coarse pointer in landscape mode */
        @media screen and (orientation: landscape) and (max-width: 950px) and (pointer: coarse) {
            #header {
                display: none !important;
            }
            #controls {
                display: none !important;
            }
            #sidebar {
                display: none !important;
            }
            #slide-wrapper {
                padding: 5px !important;
                background: #000 !important;
            }
            #mobile-float-controls {
                display: flex !important;
            }
        }
        
        /* MOBILE PORTRAIT MODE - Full width slide */
        @media screen and (max-width: 1024px) and (orientation: portrait) {
            html, body {
                width: 100vw !important;
                max-width: 100vw !important;
                min-width: 100vw !important;
                overflow-x: hidden !important;
                margin: 0 !important;
                padding: 0 !important;
                box-sizing: border-box !important;
            }
            
            #player-container {
                width: 100vw !important;
                max-width: 100vw !important;
                min-width: 100vw !important;
                padding: 0 !important;
                margin: 0 !important;
                box-sizing: border-box !important;
            }
            
            #slide-wrapper {
                padding: 0 !important;
                margin: 0 !important;
                width: 100vw !important;
                max-width: 100vw !important;
                min-width: 100vw !important;
                align-items: flex-start !important;
                justify-content: flex-start !important;
                overflow-y: auto;
                overflow-x: hidden;
                -webkit-overflow-scrolling: touch;
                box-sizing: border-box !important;
            }
            
            #slide-container {
                box-shadow: none !important;
                margin: 0 !important;
                transform-origin: left top !important;
            }
            
            #header {
                display: none !important;
            }
            
            #sidebar {
                display: none !important;
            }
            
            #controls {
                display: none !important;
            }
        }
        
        /* Mobile floating controls - always available on mobile landscape */
        #mobile-float-controls {
            display: none;
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            align-items: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.85);
            padding: 10px 20px;
            border-radius: 25px;
            z-index: 10001;
        }
        
        #mobile-float-controls button {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: #fff;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            touch-action: manipulation;
        }
        
        #mobile-float-controls button:active {
            background: rgba(255, 255, 255, 0.4);
        }
        
        #mobile-float-controls .progress-text {
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            min-width: 50px;
            text-align: center;
        }
        
        #slide-container {
            width: 1920px;
            height: 820px;
            background: #fff;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.5);
            transform-origin: 0 0;
        }
        
        .slide-background {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: fill; /* Fill to match PPT slide proportions - same as SCORM */
        }
        
        .slide-element {
            position: absolute;
            transition: opacity 0.3s ease;
            overflow: hidden;
        }
        
        .slide-element.text-element {
            padding: 10px;
            overflow: hidden;
            background: transparent;
            border-radius: 0;
        }
        
        .slide-element.shape-element {
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
        }
        
        .slide-element.animation_mask-element {
            position: absolute;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
        
        .slide-element.animation_clip-element {
            position: absolute;
            pointer-events: none;
            overflow: hidden;
        }
        
        .slide-element.animation_clip-element .animation-clip {
            transition: opacity 0.5s ease, backdrop-filter 0.5s ease;
        }
        
        .slide-element.animation_highlight-element {
            position: absolute;
            pointer-events: none;
            box-sizing: border-box;
        }
        
        .slide-element.image-element img {
            width: 100%;
            height: 100%;
            /* object-fit is set inline per element */
        }
        
        .slide-element.video-element {
            background: transparent;
            border-radius: 0;
            overflow: hidden;
            position: relative;
        }
        
        .slide-element.video-element .video-embed-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        .slide-element.video-element video,
        .slide-element.video-element iframe {
            width: 100%;
            height: 100%;
            border: 0;
            background: transparent;
        }
        
        /* WebM videos with alpha channel transparency */
        .slide-element.video-element video {
            /* object-fit is set inline per element */
            background-color: transparent !important;
        }
        
        .slide-element.button-element {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .slide-element.button-element a {
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }
        
        .slide-element.button-element button {
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: none;
        }
        
        .slide-element.button-element button:hover {
            transform: scale(1.05);
        }
        
        .button-primary {
            background: linear-gradient(135deg, #7c3aed, #06b6d4);
            color: white;
        }
        
        .button-secondary {
            background: #4b5563;
            color: white;
        }
        
        .button-outline {
            background: transparent;
            border: 2px solid #7c3aed !important;
            color: #7c3aed;
        }
        
        #controls {
            height: 60px;
            background: #16213e;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-top: 1px solid #0f3460;
        }
        
        @media screen and (max-width: 900px) {
            #controls {
                height: 50px;
                padding: 0 10px;
            }
        }
        
        .nav-buttons {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .control-btn {
            background: #0f3460;
            border: none;
            color: #fff;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .control-btn:hover {
            background: #1a4980;
        }
        
        .control-btn:active {
            transform: scale(0.98);
        }
        
        .control-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .control-btn.icon-btn {
            padding: 10px;
        }
        
        @media screen and (max-width: 900px) {
            .control-btn {
                padding: 8px 12px;
                font-size: 12px;
            }
        }
        
        .progress-container {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 0 20px;
        }
        
        .progress-bar {
            flex: 1;
            height: 6px;
            background: #0f3460;
            border-radius: 3px;
            cursor: pointer;
            position: relative;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #7c3aed, #06b6d4);
            border-radius: 3px;
            transition: width 0.3s ease;
        }
        
        .progress-dots {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        
        .progress-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }
        
        .progress-dot:hover {
            background: rgba(255, 255, 255, 0.5);
        }
        
        .progress-dot.active {
            background: #06b6d4;
            transform: scale(1.2);
        }
        
        .progress-dot.completed {
            background: #10b981;
        }
        
        .volume-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .volume-slider {
            width: 80px;
            height: 4px;
            -webkit-appearance: none;
            background: #0f3460;
            border-radius: 2px;
            outline: none;
        }
        
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: #06b6d4;
            border-radius: 50%;
            cursor: pointer;
        }
        
        /* SVG Annotations */
        .annotations-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 100;
        }
        
        /* Mobile orientation overlay */
        #orientation-overlay {
            display: none;
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            z-index: 99999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        
        /* Force display on mobile portrait mode - JS controlled, dismissable */
        @media screen and (orientation: portrait) and (max-width: 900px) {
            /* JS controls overlay display */
        }
        
        /* Also detect by aspect ratio for devices that don't report orientation correctly */
        @media screen and (max-aspect-ratio: 4/5) and (max-width: 900px) {
            /* JS controls overlay display */
        }
        
        /* Extra aggressive detection for very tall screens (phones in portrait) */
        @media screen and (max-aspect-ratio: 7/10) {
            /* JS controls overlay display */
        }
        
        /* Override for landscape - always hide overlay */
        @media screen and (orientation: landscape) {
            #orientation-overlay {
                display: none !important;
            }
            #player-container {
                display: flex !important;
            }
        }
        
        /* Override for wide screens - always hide overlay */
        @media screen and (min-aspect-ratio: 10/9) {
            #orientation-overlay {
                display: none !important;
            }
            #player-container {
                display: flex !important;
            }
        }
        
        .orientation-content {
            text-align: center;
            padding: 30px;
            color: white;
            max-width: 90%;
        }
        
        .orientation-icon {
            font-size: 70px;
            margin-bottom: 10px;
            animation: shake 1.5s ease-in-out infinite;
        }
        
        .orientation-arrow {
            font-size: 50px;
            color: #7c3aed;
            margin-bottom: 15px;
            animation: rotate-hint 2s ease-in-out infinite;
        }
        
        @keyframes rotate-hint {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
        }
        
        @keyframes shake {
            0%, 100% { transform: rotate(-10deg); }
            50% { transform: rotate(10deg); }
        }
        
        .orientation-content h2 {
            font-size: 24px;
            margin-bottom: 12px;
            color: #fff;
        }
        
        .orientation-content p {
            font-size: 14px;
            color: #a0aec0;
            margin-bottom: 25px;
            line-height: 1.5;
            max-width: 300px;
            margin: 0 auto 25px auto;
        }
        
        .orientation-hint {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
        }
        
        .phone-icon {
            font-size: 40px;
            transition: all 0.3s ease;
        }
        
        .phone-icon.vertical {
            opacity: 0.5;
        }
        
        .phone-icon.horizontal {
            transform: rotate(90deg);
            color: #7c3aed;
        }
        
        .orientation-hint .arrow {
            font-size: 24px;
            color: #7c3aed;
            animation: pulse-arrow 1s ease-in-out infinite;
        }
        
        @keyframes pulse-arrow {
            0%, 100% { transform: translateX(0); opacity: 1; }
            50% { transform: translateX(10px); opacity: 0.5; }
        }
        
        /* Continue in portrait button */
        .continue-portrait-btn {
            margin-top: 25px;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.3);
            color: #94a3b8;
            padding: 12px 28px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .continue-portrait-btn:hover,
        .continue-portrait-btn:active {
            background: rgba(255,255,255,0.1);
            color: #fff;
            border-color: rgba(255,255,255,0.5);
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes fadeOut {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(-10px); }
        }
        
        /* PowerPoint Animation Effects */
        @keyframes ppt-appear {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes ppt-fade {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes ppt-fly-left {
            from { opacity: 0; transform: translateX(-100%); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        @keyframes ppt-fly-right {
            from { opacity: 0; transform: translateX(100%); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        @keyframes ppt-fly-top {
            from { opacity: 0; transform: translateY(-100%); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes ppt-fly-bottom {
            from { opacity: 0; transform: translateY(100%); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes ppt-zoom {
            from { opacity: 0; transform: scale(0.3); }
            to { opacity: 1; transform: scale(1); }
        }
        
        @keyframes ppt-grow {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }
        
        @keyframes ppt-shrink {
            from { transform: scale(1.5); }
            to { transform: scale(1); }
        }
        
        @keyframes ppt-spin {
            from { opacity: 0; transform: rotate(-360deg) scale(0.5); }
            to { opacity: 1; transform: rotate(0deg) scale(1); }
        }
        
        @keyframes ppt-swivel {
            from { opacity: 0; transform: rotateY(-90deg); }
            to { opacity: 1; transform: rotateY(0deg); }
        }
        
        @keyframes ppt-bounce {
            0% { opacity: 0; transform: translateY(-100%); }
            50% { transform: translateY(10%); }
            70% { transform: translateY(-5%); }
            100% { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes ppt-float {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes ppt-wipe-left {
            from { clip-path: inset(0 100% 0 0); }
            to { clip-path: inset(0 0 0 0); }
        }
        
        @keyframes ppt-wipe-right {
            from { clip-path: inset(0 0 0 100%); }
            to { clip-path: inset(0 0 0 0); }
        }
        
        @keyframes ppt-wipe-top {
            from { clip-path: inset(100% 0 0 0); }
            to { clip-path: inset(0 0 0 0); }
        }
        
        @keyframes ppt-wipe-bottom {
            from { clip-path: inset(0 0 100% 0); }
            to { clip-path: inset(0 0 0 0); }
        }
        
        @keyframes ppt-blinds {
            from { opacity: 0; clip-path: polygon(0% 0%, 10% 0%, 10% 100%, 0% 100%, 0% 0%, 20% 0%, 20% 100%, 30% 0%, 30% 100%, 40% 0%, 40% 100%, 50% 0%, 50% 100%); }
            to { opacity: 1; clip-path: polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%); }
        }
        
        @keyframes ppt-emphasis-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        @keyframes ppt-emphasis-teeter {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(3deg); }
            75% { transform: rotate(-3deg); }
        }
        
        @keyframes ppt-exit-fade {
            from { opacity: 1; }
            to { opacity: 0; }
        }
        
        @keyframes ppt-exit-fly {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(-100%); }
        }
        
        @keyframes ppt-exit-zoom {
            from { opacity: 1; transform: scale(1); }
            to { opacity: 0; transform: scale(0.3); }
        }
        
        /* Presentation Mode - Fullscreen optimized */
        .presentation-mode #slide-wrapper {
            padding: 5px !important;
            background: #000 !important;
        }
        
        .presentation-mode #sidebar {
            display: none !important;
        }
        
        /* Floating controls for presentation mode */
        #floating-controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(0, 0, 0, 0.8);
            padding: 12px 25px;
            border-radius: 30px;
            z-index: 10001;
            backdrop-filter: blur(10px);
        }
        
        #floating-controls button {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        
        #floating-controls button:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        #floating-controls button:active {
            transform: scale(0.95);
        }
        
        #float-progress {
            color: #fff;
            font-size: 16px;
            font-weight: 500;
            min-width: 60px;
            text-align: center;
        }
        
        /* Touch-friendly on mobile */
        @media screen and (max-width: 900px) {
            #floating-controls {
                bottom: 15px;
                padding: 10px 20px;
            }
            
            #floating-controls button {
                width: 50px;
                height: 50px;
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Mobile Orientation Overlay -->
    <div id="orientation-overlay">
        <div class="orientation-content">
            <div class="orientation-icon">📱</div>
            <div class="orientation-arrow">↻</div>
            <h2>Rotacione seu dispositivo</h2>
            <p>Para uma melhor experiência, por favor visualize este conteúdo no modo horizontal (paisagem)</p>
            <div class="orientation-hint">
                <span class="phone-icon vertical">📱</span>
                <span class="arrow">→</span>
                <span class="phone-icon horizontal">📱</span>

idade Corporativa Digital", "description": "Neste cenário interativo, você, como Gestor de RH, lidera a transformação digital da Universidade Corporativa da Inovare Solutions. Suas decisões impactarão diretamente a eficácia, o engajamento e o sucesso dos programas de aprendizagem à distância.", "context": "A Inovare Solutions, uma acelerada empresa de tecnologia com mais de 1000 colaboradores distribuídos globalmente, enfrenta um desafio crítico: a sua Universidade Corporativa (UC) atual é predominantemente presencial e não consegue escalar para atender às crescentes demandas de treinamento e desenvolvimento. A alta gerência designou você para liderar a digitalização e expansão da UC, transformando-a em uma plataforma de aprendizagem à distância robusta e engajadora. Você tem um orçamento considerável, mas também prazos apertados e a expectativa de resultados rápidos e mensuráveis.", "characters": [{"name": "Mariana Souza", "role": "Gerente de RH Sênior (Protagonista)", "personality": "Você é proativa, orientada a resultados e apaixonada por desenvolvimento humano. Está determinada a modernizar a área de T&D da Inovare.", "avatar_description": "Mulher jovem, entre 30 e 35 anos, com expressão confiante, vestindo um blazer elegante. Cabelos castanhos médios e óculos discretos."}, {"name": "Dr. Arthur Costa", "role": "Diretor de Treinamento e Desenvolvimento", "personality": "Experiente, com uma visão mais tradicional de treinamento, mas aberto a inovações desde que apresentem um ROI claro. Valoriza a estrutura, o controle e a comprovação de resultados.", "avatar_description": "Homem de 50-60 anos, cabelos grisalhos bem cortados, usando terno. Postura formal e olhar analítico."}, {"name": "Sofia Oliveira", "role": "Especialista em E-learning e Experiência do Usuário (UX)", "personality": "Jovem e inovadora, sempre atualizada com as últimas tendências em tecnologia educacional e design instrucional. Prioriza a experiência do aprendiz, o engajamento e a acessibilidade.", "avatar_description": "Mulher na casa dos 20-30 anos, cabelos cacheados, vestindo roupas casuais de escritório. Expressão criativa e entusiasmada."}], "learning_objectives": ["Avaliar e selecionar as melhores estratégias para criação e gestão de conteúdo EAD.", "Compreender a importância da curadoria de conteúdo e personalização na aprendizagem digital.", "Gerenciar expectativas de stakeholders em projetos complexos de EAD.", "Identificar e aplicar métricas de sucesso para conteúdos de aprendizagem à distância."], "competencies_evaluated": ["Pensamento Estratégico", "Gestão de Projetos", "Comunicação Interpessoal", "Tomada de Decisão sob Pressão", "Visão de Negócio"], "nodes": [{"id": "node_1", "type": "narrative", "title": "O Desafio Inicial: Digitalizando a UC", "narrative": "Você, Mariana Souza, senta-se à mesa de reunião com Arthur e Sofia. O projeto de digitalização da Universidade Corporativa é grande e o prazo, apertado. Arthur inicia a conversa:\n\n\"Mariana, a diretoria espera que nossa UC esteja totalmente digital e funcional em 6 meses. O principal desafio é como vamos transpor nosso conteúdo atual, que é denso e presencial, para o formato EAD e, ao mesmo tempo, criar novos módulos com agilidade e relevância.\"\n\nSofia complementa:\n\"A chave será o engajamento. Não podemos apenas jogar PDFs na plataforma e esperar que funcione. Precisamos de uma estratégia inteligente que considere a experiência do aprendiz desde o início.\"", "character_speaking": "Dr. Arthur Costa", "is_ending": false, "ending_type": null, "score": null, "choices": [{"id": "choice_1_1", "text": "Priorizar a velocidade: Converter o máximo de material existente para o formato EAD rapidamente, focando na quantidade para cumprir o prazo.", "next_node_id": "node_2", "feedback": "Embora a velocidade seja importante, focar apenas na quantidade e conversão direta pode comprometer a qualidade e o engajamento, resultando em conteúdo genérico e pouco eficaz. Isso pode gerar frustração e baixa adesão dos colaboradores, custando mais no longo prazo em retrabalho e baixa adoção. É uma estratégia de alto risco.", "is_optimal": false, "points": 5}, {"id": "choice_1_2", "text": "Foco na qualidade: Desenvolver um planejamento detalhado para criar todo o conteúdo do zero, com metodologia instrucional robusta e alta interatividade, sem reaproveitar nada.", "next_node_id": "node_2", "feedback": "A qualidade é crucial, mas recriar tudo do zero pode consumir muito tempo e recursos, tornando o projeto inviável dentro do prazo e orçamento estipulados. O risco é entregar algo excelente, mas tarde demais, perdendo a janela de oportunidade para o negócio. É uma abordagem idealista, mas pouco pragmática para este cenário.", "is_optimal": false, "points": 10}, {"id": "choice_1_3", "text": "Abordagem híbrida e curadoria: Reaproveitar e adaptar conteúdos relevantes, enquanto cria novos módulos estratégicos com design instrucional moderno e focado no engajamento.", "next_node_id": "node_2", "feedback": "Excelente escolha! Esta abordagem equilibra velocidade e qualidade. A curadoria inteligente permite focar recursos onde são mais necessários, garantindo que o conteúdo seja relevante e engajador, sem atrasar o cronograma de forma excessiva. É um pensamento estratégico alinhado às necessidades do negócio e à realidade de prazos e recursos.", "is_optimal": true, "points": 20}]}, {"id": "node_2", "type": "narrative", "title": "Estratégia de Produção e Manutenção de Conteúdo", "narrative": "Após definir a abordagem inicial, Arthur pergunta:\n\n\"Mariana, agora que temos uma ideia do que queremos fazer, precisamos definir como vamos produzir todo esse conteúdo. Nossas equipes internas já estão sobrecarregadas com as operações diárias. Qual sua estratégia para a produção contínua de material de alta qualidade, garantindo que seja relevante e atualizado?\"\n\nSofia, ansiosa, complementa:\n\"Sim, e não podemos esquecer da manutenção e atualização constante dos materiais! O conteúdo estático logo se torna obsoleto, e a experiência do usuário se deteriora.\"", "character_speaking": "Dr. Arthur Costa", "is_ending": false, "ending_type": null, "score": null, "choices": [{"id": "choice_2_1", "text": "Contratar uma grande equipe interna de designers instrucionais, produtores de vídeo e redatores para gerenciar toda a criação e manutenção.", "next_node_id": "node_3", "feedback": "Criar uma equipe interna robusta oferece controle total e alinhamento cultural, mas é um investimento alto e leva tempo para montar. Pode gerar gargalos se a demanda variar, e a empresa assume todos os riscos de especialização e infraestrutura. É menos flexível para picos de demanda e pode se tornar um centro de custo pesado.", "is_optimal": false, "points": 5}, {"id": "choice_2_2", "text": "Terceirizar completamente a produção de conteúdo para agências especializadas em EAD, com contratos de manutenção.", "next_node_id": "node_3", "feedback": "A terceirização pode acelerar a produção e trazer expertise externa rapidamente, mas a empresa pode perder o controle sobre a voz e a cultura interna, além da relevância contextual. Há risco de dependência do fornecedor e custos elevados para personalização e atualizações futuras. A gestão da qualidade e o alinhamento constante com a cultura da empresa pode ser desafiadora.", "is_optimal": false, "points": 10}, {"id": "choice_2_3", "text": "Capacitar SMEs (Subject Matter Experts) internos com ferramentas de autoria e design instrucional básico, complementando com uma pequena equipe interna de curadoria e edição.", "next_node_id": "node_3", "feedback": "Essa é uma excelente estratégia! Ela empodera os colaboradores com conhecimento interno para serem criadores de conteúdo, garantindo relevância e alinhamento cultural. Reduz custos de produção e aumenta a agilidade nas atualizações, enquanto a equipe de curadoria assegura a qualidade e padronização. É um modelo escalável, sustentável e que promove a cultura de aprendizagem interna.", "is_optimal": true, "points": 20}]}, {"id": "node_3", "type": "narrative", "title": "Métricas de Sucesso e Melhoria Contínua", "narrative": "Seis meses se passaram. A nova Universidade Corporativa digital está no ar e recebendo os primeiros feedbacks. Arthur e Sofia se reúnem com você para avaliar os resultados iniciais.\n\n\"Os números de acesso são razoáveis, Mariana, mas como vamos saber se realmente estamos gerando impacto nos resultados do negócio?\", questiona Arthur, com um tom de preocupação.\n\nSofia acrescenta: \"Precisamos mais do que cliques ou simples aprovações em testes. O que os colaboradores estão realmente aprendendo, aplicando no dia a dia e como isso se traduz em valor para a Inovare?\"", "character_speaking": "Dr. Arthur Costa", "is_ending": false, "ending_type": null, "score": null, "choices": [{"id": "choice_3_1", "text": "Focar apenas nas taxas de conclusão dos cursos e nas notas das avaliações formais para medir o sucesso da UC.", "next_node_id": "node_final_bad", "feedback": "Embora importantes, essas métricas são insuficientes para avaliar o verdadeiro impacto da aprendizagem. Altas taxas de conclusão não garantem que o conhecimento está sendo aplicado ou que os objetivos de negócio estão sendo atingidos. Essa visão limitada pode levar a investimentos em programas que não geram valor real, resultando em desmotivação e perda de credibilidade da UC.", "is_optimal": false, "points": 5}, {"id": "choice_3_2", "text": "Realizar pesquisas de satisfação e coletar feedback qualitativo dos usuários regularmente para entender a percepção e fazer ajustes no conteúdo.", "next_node_id": "node_final_neutral", "feedback": "O feedback qualitativo é valioso para entender a experiência do usuário e identificar pontos de melhoria no design instrucional e relevância do conteúdo. Contudo, sem dados quantitativos sobre o impacto real no desempenho e nos resultados de negócio, é difícil justificar o ROI e tomar decisões estratégicas mais robustas. É um passo importante, mas não oferece a visão completa necessária.", "is_optimal": false, "points": 10}, {"id": "choice_3_3", "text": "Cruzamento de dados: Analisar engajamento, taxas de conclusão, e correlacionar com KPIs de desempenho do negócio (e.g., produtividade, vendas, retenção, erros, tempo de rampa para novos hires).", "next_node_id": "node_final_good", "feedback": "Perfeito! Esta abordagem holística permite demonstrar o valor estratégico da UC. Ao cruzar dados de engajamento e conclusão com métricas de negócio, você pode provar o ROI da aprendizagem, identificar onde os programas estão gerando impacto real e otimizar continuamente baseando-se em dados concretos. É a base para uma Universidade Corporativa de sucesso e um ativo estratégico para a empresa.", "is_optimal": true, "points": 20}]}, {"id": "node_final_good", "type": "ending", "title": "Desfecho Positivo: Inovação e Resultados Comprovados", "narrative": "Sua abordagem estratégica para a Universidade Corporativa digital foi um sucesso retumbante. O engajamento dos colaboradores disparou, e a correlação entre os programas de aprendizagem e os KPIs de negócio tornou-se inegável, com melhorias claras em produtividade e retenção. A Inovare Solutions está à frente da curva, com uma força de trabalho altamente capacitada e em constante evolução. Arthur e Sofia te parabenizam pelo excelente trabalho, e a diretoria reconhece seu projeto como um case de sucesso de transformação digital e um diferencial competitivo.\n\n\"Mariana, você realmente transformou a forma como aprendemos e crescemos na Inovare. Parabéns! Este é um legado que terá impacto por anos!\", celebra Arthur com um sorriso.", "character_speaking": "Dr. Arthur Costa", "is_ending": true, "ending_type": "good", "score": 95, "choices": []}, {"id": "node_final_neutral", "type": "ending", "title": "Desfecho Neutro: Resultados Moderados e Desafios Contínuos", "narrative": "A Universidade Corporativa digital foi lançada, mas os resultados são mistos. Embora haja algum acesso aos conteúdos, o engajamento está abaixo do esperado e o impacto nos indicadores de desempenho ainda não é claramente demonstrado. Arthur comenta:\n\n\"Mariana, o projeto foi entregue e a plataforma está no ar, o que é um feito. Mas ainda precisamos trabalhar no engajamento e em como medir o impacto real no negócio. Temos muito a aprender e otimizar. Os custos também estão um pouco acima do previsto para o retorno que estamos vendo.\"\n\nSofia acena com a cabeça, preocupada com a experiência do usuário. Você sabe que o caminho ainda é longo e que há muito a ajustar para alcançar o potencial máximo da UC, exigindo mais esforço e justificativa para investimentos futuros.", "character_speaking": "Dr. Arthur Costa", "is_ending": true, "ending_type": "neutral", "score": 60, "choices": []}, {"id": "node_final_bad", "type": "ending", "title": "Desfecho Negativo: Projeto Abaixo das Expectativas", "narrative": "O lançamento da Universidade Corporativa digital foi problemático. Os colaboradores reclamam da relevância e do formato dos conteúdos, as taxas de abandono são altas, e os custos de manutenção se mostram insustentáveis. Arthur demonstra sua frustração:\n\n\"Mariana, infelizmente, o engajamento e o impacto deste projeto estão muito aquém das nossas expectativas. Investimos tempo e recursos significativos, mas não estamos vendo o retorno esperado e há sérias dúvidas sobre a eficácia da plataforma. Precisamos reavaliar toda a estratégia, e a diretoria está questionando a viabilidade de continuar com este modelo.\"\n\nSofia expressa sua decepção com a experiência do usuário e a falta de adesão. O projeto é considerado um fracasso inicial, e a confiança da diretoria em sua liderança na UC foi seriamente abalada. Você percebe que as escolhas iniciais não foram as mais adequadas, e o projeto precisa de uma revisão drástica e urgente para evitar o cancelamento.", "character_speaking": "Dr. Arthur Costa", "is_ending": true, "ending_type": "bad", "score": 30, "choices":             function updateSlideScale() {

                var wrapper = document.getElementById('slide-wrapper');
                if (!container || !wrapper || !course.slides) return;
                
                var slide = course.slides[currentSlide];
                var slideWidth = slide.width || 1920;
                var slideHeight = slide.height || 820;
                
                // Detect mobile device

                var isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
                var isSmallScreen = window.innerWidth < 1024;
                var isMobile = isMobileDevice || (isSmallScreen && isTouchDevice);
                
                // Detect portrait orientation

                var isMobilePortrait = isMobile && isPortrait;
                var isMobileLand = isMobileLandscape();
                
                if (isMobilePortrait) {
                    // MOBILE PORTRAIT MODE - Fill the screen width completely
                    var screenWidth = Math.max(window.innerWidth, document.documentElement.clientWidth);
                    var screenHeight = Math.max(window.innerHeight, document.documentElement.clientHeight);
                    
                    var viewportWidth = screenWidth;
                    var viewportHeight = screenHeight - 40; // Space for counter
                    
                    // Calculate scale to fill width completely
                    var scaleForWidth = viewportWidth / slideWidth;
                    
                    // Calculate the scaled height
                    var scaledHeight = slideHeight * scaleForWidth;
                    
                    // Center vertically if there's extra space
                    var topOffset = 0;
                    if (scaledHeight < viewportHeight) {
                        topOffset = (viewportHeight - scaledHeight) / 2;
                    }
                    
                    // Force wrapper to have no padding and full width
                    wrapper.style.padding = '0';
                    wrapper.style.margin = '0';
                    wrapper.style.width = '100vw';
                    wrapper.style.maxWidth = '100vw';
                    wrapper.style.alignItems = 'flex-start';
                    wrapper.style.justifyContent = 'flex-start';
                    wrapper.style.paddingTop = topOffset + 'px';
                    
                    // Apply scale with left-aligned transform origin for true full-width
                    container.style.width = slideWidth + 'px';
                    container.style.height = slideHeight + 'px';
                    container.style.transform = 'scale(' + scaleForWidth + ')';
                    container.style.transformOrigin = 'left top';
                    container.style.marginLeft = '0';
                    container.style.boxShadow = 'none';
                    
                    console.log('[Scale] Mobile portrait - scale:', scaleForWidth.toFixed(3));
                    return;
                }
                
                // DESKTOP / LANDSCAPE MODE
                // Reset wrapper styles that might have been modified
                wrapper.style.padding = '';
                wrapper.style.margin = '';
                wrapper.style.width = '';
                wrapper.style.maxWidth = '';
                wrapper.style.alignItems = '';
                wrapper.style.justifyContent = '';
                wrapper.style.paddingTop = '';

                container.style.marginRight = '';
                container.style.marginBottom = '';

                    html += '<div style="padding:10px 12px;border-radius:8px;background:rgba(51,65,85,0.4);border:1px solid rgba(51,65,85,0.4);margin-bottom:12px;">';
                    html += '<p style="font-size:11px;color:#64748b;margin-bottom:4px;">Sua escolha:</p>';
                    html += '<p style="font-size:13px;color:#fff;">' + (choice.text || '') + '</p></div>';
                    html += '<div style="padding:10px 12px;border-radius:8px;background:' + fbBg + ';border:1px solid ' + fbBorder + ';margin-bottom:12px;">';
                    html += '<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;">';
                    html += '<span style="color:' + fbColor + ';font-size:14px;">' + fbIcon + '</span>';
                    html += '<span style="font-size:12px;font-weight:500;color:' + fbColor + ';">' + fbLabel + '</span>';
                    if (choice.points > 0) html += '<span style="margin-left:auto;font-size:11px;color:#fbbf24;">+' + choice.points + ' pts</span>';
                    html += '</div>';
                    html += '<p style="font-size:13px;color:#cbd5e1;line-height:1.5;">' + (choice.feedback || '') + '</p></div>';
                    html += '<button onclick="ScenarioController.proceed(\'' + elementId + '\',\'' + (choice.next_node_id || '') + '\')" style="width:100%;padding:10px 20px;background:linear-gradient(135deg,#0891b2,#2563eb);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;">Continuar →</button>';
                    html += '</div>';
                    sc.container.innerHTML = html;
                },

                proceed: function(elementId, nextNodeId) {
                    var sc = scenarios[elementId];
                    if (!sc) return;
                    sc.history.push(sc.currentNodeId);
                    if (nextNodeId && sc.nodesMap[nextNodeId]) {
                        sc.currentNodeId = nextNodeId;
                        this.renderNode(elementId);
                    } else {
                        // Ended without explicit ending node
                        this.renderEnding(elementId, sc.nodesMap[sc.currentNodeId] || {});
                    }
                },

                renderEnding: function(elementId, node) {
                    var sc = scenarios[elementId];
                    if (!sc) return;
                    var calcScore = Math.round((sc.totalPoints / sc.maxPoints) * 100);
                    var endColor = calcScore >= 80 ? '#10b981' : calcScore >= 50 ? '#f59e0b' : '#ef4444';
                    var endIcon = calcScore >= 80 ? '🏆' : calcScore >= 50 ? '⚠' : '✗';

                    var html = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;background:linear-gradient(180deg,#0f172a,#1e293b);border-radius:12px;padding:24px;text-align:center;">';
                    html += '<div style="font-size:48px;margin-bottom:12px;">' + endIcon + '</div>';
                    html += '<h2 style="font-size:20px;font-weight:bold;color:' + endColor + ';margin-bottom:8px;">' + (node.title || 'Fim') + '</h2>';
                    html += '<p style="font-size:14px;color:#cbd5e1;max-width:400px;line-height:1.6;margin-bottom:16px;">' + (node.narrative || '') + '</p>';
                    html += '<div style="display:flex;align-items:center;gap:8px;background:rgba(51,65,85,0.5);padding:8px 16px;border-radius:999px;margin-bottom:8px;">';
                    html += '<span style="color:#fbbf24;">★</span><span style="color:#fff;font-weight:600;">Pontuação: ' + calcScore + '%</span></div>';
                    html += '<div style="display:flex;flex-direction:column;align-items:center;gap:4px;margin-bottom:16px;">';
                    html += '<span style="font-size:12px;color:#94a3b8;">Decisões ideais: ' + sc.optimalCount + ' de ' + sc.totalDecisions + '</span>';
                    html += '<span style="font-size:11px;color:#64748b;">Pontos: ' + sc.totalPoints + ' / ' + sc.maxPoints + '</span></div>';
                    html += '<button onclick="ScenarioController.startScenario(\'' + elementId + '\')" style="padding:10px 20px;background:transparent;border:1px solid rgba(34,211,238,0.5);color:#22d3ee;border-radius:8px;font-size:14px;cursor:pointer;">↻ Tentar Novamente</button>';
                    html += '</div>';
                    sc.container.innerHTML = html;
                }
            };
        })();
    </script>

    <script>/**
 * AI Tutor Chat Widget for SCORM/HTML Courses
 * Slide-aware: reads the current slide content and provides contextual explanations
 * Communicates with the backend Gemini API for course-specific tutoring
 */
var AiTutor = (function() {
    var config = {};
    var history = [];
    var sessionId = 'tutor-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9);
    var messagesUsed = 0;
    var isOpen = false;
    var isLoading = false;
    var currentSlideIndex = 0;
    var slideContexts = [];

    function init(tutorConfig) {
        config = tutorConfig || {};
        if (!config.enabled) return;
        slideContexts = config.slideContexts || [];
        buildUI();
        addWelcomeMessage();
    }

    function buildUI() {
        // Inject CSS (skip if already inlined in HTML export)
        if (!config.cssInlined) {
            var cssLink = document.createElement('link');
            cssLink.rel = 'stylesheet';
            cssLink.href = 'styles/tutor.css';
            document.head.appendChild(cssLink);
        }

        // FAB button
        var fab = document.createElement('button');
        fab.className = 'tutor-fab';
        fab.id = 'tutor-fab';
        fab.setAttribute('data-testid', 'tutor-fab-button');
        fab.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span class="tutor-badge"></span>';
        fab.onclick = togglePanel;
        document.body.appendChild(fab);

        // Chat panel
        var panel = document.createElement('div');
        panel.className = 'tutor-panel';
        panel.id = 'tutor-panel';
        panel.setAttribute('data-testid', 'tutor-chat-panel');

        var tutorName = config.tutorName || 'Tutor IA';
        var courseTopic = config.courseTopic || 'este curso';

        // Build suggestions HTML
        var suggestionsHtml = '';
        var suggestions = config.suggestedQuestions || [];
        // Add default slide-aware suggestion
        var allSuggestions = ['Explique o conteudo deste slide'].concat(suggestions);
        suggestionsHtml = '<div class="tutor-suggestions" id="tutor-suggestions" data-testid="tutor-suggestions">';
        for (var i = 0; i < allSuggestions.length && i < 4; i++) {
            suggestionsHtml += '<button class="tutor-suggestion-btn" data-testid="tutor-suggestion-' + i + '" onclick="AiTutor.sendSuggestion(this)">' + escapeHtml(allSuggestions[i]) + '</button>';
        }
        suggestionsHtml += '</div>';

        panel.innerHTML =
            '<div class="tutor-header">' +
                '<div class="tutor-avatar">&#x1F393;</div>' +
                '<div class="tutor-header-info">' +
                    '<h3>' + escapeHtml(tutorName) + '</h3>' +
                    '<p>Assistente do curso</p>' +
                '</div>' +
                '<button class="tutor-close" data-testid="tutor-close-button" onclick="AiTutor.toggle()">&#x2715;</button>' +
            '</div>' +
            '<div class="tutor-slide-indicator" id="tutor-slide-indicator" data-testid="tutor-slide-indicator"></div>' +
            suggestionsHtml +
            '<div class="tutor-messages" id="tutor-messages" data-testid="tutor-messages">' +
                '<div class="tutor-typing" id="tutor-typing"><span></span><span></span><span></span></div>' +
            '</div>' +
            '<div class="tutor-counter" id="tutor-counter" data-testid="tutor-counter"></div>' +
            '<div class="tutor-input-area">' +
                '<input class="tutor-input" id="tutor-input" data-testid="tutor-input" placeholder="Pergunte sobre este slide..." />' +
                '<button class="tutor-send" id="tutor-send" data-testid="tutor-send-button" onclick="AiTutor.send()">' +
                    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>' +
                '</button>' +
            '</div>';

        document.body.appendChild(panel);

        // Stop ALL keyboard events from propagating to the SCORM player
        var tutorInput = document.getElementById('tutor-input');
        tutorInput.addEventListener('keydown', function(e) {
            e.stopPropagation();
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                AiTutor.send();
            }
        });
        tutorInput.addEventListener('keyup', function(e) { e.stopPropagation(); });
        tutorInput.addEventListener('keypress', function(e) { e.stopPropagation(); });

        updateCounter();
        updateSlideIndicator();
    }

    function addWelcomeMessage() {
        var tutorName = config.tutorName || 'Tutor IA';
        var topic = config.courseTopic || 'este curso';
        var welcome = 'Ola! Sou o <strong>' + escapeHtml(tutorName) + '</strong>, seu assistente para o curso sobre <strong>' + escapeHtml(topic) + '</strong>. Posso explicar o conteudo de cada slide - basta perguntar!';
        appendMessage('assistant', welcome);
    }

    function onSlideChange(slideIndex) {
        currentSlideIndex = slideIndex;
        updateSlideIndicator();
    }

    function updateSlideIndicator() {
        var indicator = document.getElementById('tutor-slide-indicator');
        if (indicator) {
            var slideNum = currentSlideIndex + 1;
            var ctx = slideContexts[currentSlideIndex];
            if (ctx) {
                var preview = ctx.length > 60 ? ctx.substring(0, 60) + '...' : ctx;
                indicator.innerHTML = '<strong>Slide ' + slideNum + '</strong>: ' + escapeHtml(preview);
            } else {
                indicator.innerHTML = '<strong>Slide ' + slideNum + '</strong>';
            }
            indicator.style.display = 'block';
        }
    }

    function getCurrentSlideContext() {
        var ctx = slideContexts[currentSlideIndex] || '';
        var slideNum = currentSlideIndex + 1;
        return 'O aluno esta no Slide ' + slideNum + '. Conteudo do slide atual:\n' + ctx;
    }

    function togglePanel() {
        isOpen = !isOpen;
        var panel = document.getElementById('tutor-panel');
        if (panel) {
            if (isOpen) {
                panel.classList.add('open');
                var input = document.getElementById('tutor-input');
                if (input) input.focus();
                updateSlideIndicator();
            } else {
                panel.classList.remove('open');
            }
        }
    }

    function appendMessage(role, text) {
        var container = document.getElementById('tutor-messages');
        if (!container) return;
        var typing = document.getElementById('tutor-typing');
        var div = document.createElement('div');
        div.className = 'tutor-msg ' + role;
        div.innerHTML = role === 'assistant' ? formatMarkdown(text) : escapeHtml(text);
        container.insertBefore(div, typing);
        container.scrollTop = container.scrollHeight;
    }

    function showTyping(show) {
        var el = document.getElementById('tutor-typing');
        if (el) el.className = show ? 'tutor-typing show' : 'tutor-typing';
    }

    function updateCounter() {
        var el = document.getElementById('tutor-counter');
        var limit = config.messageLimit || 50;
        if (el) {
            el.textContent = messagesUsed + ' / ' + limit + ' mensagens';
        }
    }

    function setLoading(val) {
        isLoading = val;
        var btn = document.getElementById('tutor-send');
        var input = document.getElementById('tutor-input');
        if (btn) btn.disabled = val;
        if (input) input.disabled = val;
        showTyping(val);
    }

    function send() {
        if (isLoading) return;
        var input = document.getElementById('tutor-input');
        var text = input ? input.value.trim() : '';
        if (!text) return;

        input.value = '';
        appendMessage('user', text);
        history.push({ role: 'user', content: text });
        messagesUsed++;
        updateCounter();

        // Hide suggestions after first message
        var sugg = document.getElementById('tutor-suggestions');
        if (sugg) sugg.style.display = 'none';

        setLoading(true);

        // Build context: current slide + general course context
        var slideContext = getCurrentSlideContext();
        var fullContext = slideContext + '\n\n--- Contexto geral do curso ---\n' + (config.courseContext || '');

        var payload = {
            message: text,
            courseTopic: config.courseTopic || '',
            courseContext: fullContext,
            history: history,
            sessionId: sessionId
        };

        fetch(config.apiUrl + '/api/tutor/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(function(res) {
            if (!res.ok) {
                return res.text().then(function(text) {
                    throw new Error('HTTP ' + res.status + ': ' + text.substring(0, 200));
                });
            }
            return res.json();
        })
        .then(function(data) {
            setLoading(false);
            if (data.response) {
                appendMessage('assistant', data.response);
                history.push({ role: 'assistant', content: data.response });
            }
            if (data.limitReached) {
                var input = document.getElementById('tutor-input');
                if (input) { input.disabled = true; input.placeholder = 'Limite de mensagens atingido'; }
                var btn = document.getElementById('tutor-send');
                if (btn) btn.disabled = true;
            }
            if (data.messagesUsed) messagesUsed = data.messagesUsed;
            updateCounter();
        })
        .catch(function(err) {
            setLoading(false);
            var errorMsg = 'Desculpe, ocorreu um erro ao conectar com o tutor.';
            if (err.message) {
                errorMsg += ' (' + err.message + ')';
            }
            appendMessage('assistant', errorMsg);
            console.error('Tutor error:', err, 'API URL:', config.apiUrl);
        });
    }

    function sendSuggestion(btn) {
        var input = document.getElementById('tutor-input');
        if (input) {
            input.value = btn.textContent;
            send();
        }
    }

    function escapeHtml(text) {
        var div = document.createElement('div');
        div.appendChild(document.createTextNode(text));
        return div.innerHTML;
    }

    function formatMarkdown(text) {
        if (!text) return '';
        return text
            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
            .replace(/\*(.*?)\*/g, '<em>$1</em>')
            .replace(/`(.*?)`/g, '<code>$1</code>')
            .replace(/\n\n/g, '</p><p>')
            .replace(/\n- /g, '</p><ul><li>')
            .replace(/\n\d+\. /g, '</p><ol><li>')
            .replace(/\n/g, '<br>')
            .replace(/^/, '<p>')
            .replace(/$/, '</p>');
    }

    return {
        init: init,
        toggle: togglePanel,
        send: send,
        sendSuggestion: sendSuggestion,
        onSlideChange: onSlideChange
    };
})();
</script>
    <script>

ão: A falta de contato físico pode diminuir a interação social entre colegas e professores, afetando a troca de experiências.\n  Tecnologia: O acesso a computadores e internet de qualidade é essencial, o que pode ser um obstáculo para alguns estudantes.\n---\nSlide: New Slide\n---\nSlide: New Slide", "slideContexts": ["Cursos a Distância Os cursos a distância, também conhecidos como EAD (Educação a Distância), são uma modalidade de ensino que tem crescido significativamente nos últimos anos devido à flexibilidade e à acessibilidade que oferecem. Estes cursos permitem que estudantes aprendam de qualquer lugar, a qualquer momento, através de plataformas online. Vantagens dos Cursos a Distância Flexibilidade de Horários: Os cursos a distância permitem que os alunos assistam às aulas e realizem as atividades nos h", "", "977282e5-a893-4760-8732-e50c1dc32458"], "cssInlined": true};
