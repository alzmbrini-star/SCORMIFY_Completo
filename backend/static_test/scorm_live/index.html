<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Teste de Libras</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Lato:wght@300;400;700&family=Merriweather:wght@300;400;700&family=Montserrat:wght@300;400;500;600;700&family=Nunito:wght@300;400;600;700&family=Open+Sans:wght@300;400;600;700&family=Oswald:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&family=PT+Sans:wght@400;700&family=Raleway:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&family=Source+Sans+3:wght@300;400;600;700&family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #fff;
            overflow: hidden;
        }
        
        #player-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            transition: height 0.3s ease;
            overflow: hidden;
        }
        
        /* When controls are hidden, allow full height */
        #player-container.controls-hidden {
            height: 100vh;
        }
        
        /* When controls are hidden */
        #player-container.controls-hidden #controls {
            position: absolute !important;
            bottom: 0;
            left: 0;
            right: 0;
            transform: translateY(100%);
            opacity: 0;
            pointer-events: none;
        }
        
        #player-container.controls-hidden #slide-wrapper {
            height: 100vh !important;
            flex: none !important;
        }
        
        /* Sidebar Navigation Styles */
        #slide-sidebar {
            position: fixed;
            left: -280px;
            top: 0;
            width: 280px;
            height: calc(100vh - 60px);
            background: #16213e;
            z-index: 500;
            transition: left 0.3s ease;
            display: flex;
            flex-direction: column;
            box-shadow: 4px 0 20px rgba(0,0,0,0.3);
        }
        
        #slide-sidebar.open {
            left: 0;
        }
        
        .sidebar-header {
            padding: 20px;
            background: #0f3460;
            border-bottom: 1px solid #1a4980;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .sidebar-header h3 {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
            color: #f1f5f9;
        }
        
        .sidebar-close {
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 20px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            transition: all 0.2s;
        }
        
        .sidebar-close:hover {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }
        
        #sidebar-slides {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        
        #sidebar-slides::-webkit-scrollbar {
            width: 6px;
        }
        
        #sidebar-slides::-webkit-scrollbar-track {
            background: #0f3460;
        }
        
        #sidebar-slides::-webkit-scrollbar-thumb {
            background: #1a4980;
            border-radius: 3px;
        }
        
        .sidebar-slide-item {
            display: flex;
            align-items: center;
            padding: 10px;
            margin-bottom: 8px;
            background: #0f3460;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
        }
        
        .sidebar-slide-item:hover {
            background: #1a4980;
        }
        
        .sidebar-slide-item.active {
            border-color: #7c3aed;
            background: linear-gradient(135deg, rgba(124, 58, 237, 0.2), rgba(6, 182, 212, 0.1));
        }
        
        .sidebar-thumbnail {
            width: 80px;
            height: 45px;
            border-radius: 4px;
            background-size: cover;
            background-position: center;
            flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .sidebar-slide-info {
            margin-left: 12px;
            flex: 1;
            min-width: 0;
        }
        
        .sidebar-slide-title {
            font-size: 14px;
            font-weight: 500;
            color: #f1f5f9;
            margin-bottom: 4px;
        }
        
        .sidebar-slide-status {
            font-size: 12px;
            color: #64748b;
        }
        
        .sidebar-slide-status.completed {
            color: #22c55e;
        }
        
        .sidebar-slide-status.current {
            color: #7c3aed;
        }
        
        /* Adjust main content when sidebar is open */
        #slide-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #0f0f1a;
            overflow: hidden;
            transition: margin-left 0.3s ease;
        }
        
        /* Mobile landscape optimization - standard scaling (reflow removed) */
        @media screen and (orientation: landscape) and (max-height: 700px) {
            html, body {
                width: 100vw !important;
                max-width: 100vw !important;
                overflow: hidden !important;
                margin: 0 !important;
                padding: 0 !important;
            }
            
            #player-container {
                width: 100vw !important;
                max-width: 100vw !important;
                padding: 0 !important;
                margin: 0 !important;
                overflow: hidden !important;
            }
            
            #slide-wrapper {
                padding: 0 !important;
                margin: 0 !important;
                width: 100vw !important;
                max-width: 100vw !important;
                justify-content: center !important;
                align-items: center !important;
                overflow: hidden !important;
            }
            
            #slide-container {
                box-shadow: none !important;
            }
        }
        
        /* Mobile portrait and small screens - also reduce padding */
        @media screen and (max-width: 768px) {
            #slide-wrapper {
                padding: 5px;
            }
        }
        
        /* Mobile portrait mode: ensure player is visible when JS shows it */
        @media screen and (max-width: 1024px) and (orientation: portrait) {
            #slide-wrapper {
                padding: 5px;
                overflow: hidden;
            }
        }
        
        /* Mobile portrait mode - overlay shown by JS, dismissable */
        @media screen and (max-width: 1024px) and (orientation: portrait) {
            /* JS controls overlay display */
        }
        
        /* Very small mobile screens in landscape - remove padding entirely */
        @media screen and (max-height: 450px) and (orientation: landscape) {
            #slide-wrapper {
                padding: 2px;
            }
        }
        
        /* Mobile landscape - standard scaling, no scroll needed */
        @media screen and (max-height: 700px) and (orientation: landscape) {
            body {
                overflow: hidden !important;
            }
            #player-container {
                overflow: hidden !important;
                height: 100vh !important;
            }
        }
        
        #slide-wrapper.sidebar-open {
            margin-left: 280px;
        }
        
        #slide-container {
            width: 1920px;
            height: 820px;
            background: #fff;
            position: relative;
            overflow: visible; /* Allow elements with negative positions to be visible */
            box-shadow: 0 10px 50px rgba(0,0,0,0.5);
            transform-origin: 0 0;
            /* Scale will be calculated dynamically by JS */
        }
        
        /* Mobile: reduce shadow for cleaner look */
        @media screen and (max-width: 900px) {
            #slide-container {
                box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            }
        }
        
        /* Swipe zones for mobile navigation */
        .swipe-zone {
            display: none;
            position: absolute;
            top: 0;
            width: 40px;
            height: 100%;
            z-index: 1000;
            cursor: pointer;
        }
        
        #swipe-zone-left {
            left: 0;
        }
        
        #swipe-zone-right {
            right: 0;
        }
        
        /* Show swipe zones on mobile only */
        @media screen and (max-width: 1024px) {
            .swipe-zone {
                display: block;
            }
            
            /* Optional: visual indicator on hover/touch */
            .swipe-zone:active {
                background: rgba(34, 211, 238, 0.2);
            }
        }
        
        /* Mobile Navigation Buttons - Side buttons */
        .mobile-nav-btn {
            display: none; /* Hidden by default, shown on mobile */
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 44px;
            height: 80px;
            background: rgba(15, 23, 42, 0.7);
            border: none;
            color: #fff;
            font-size: 32px;
            font-weight: 300;
            cursor: pointer;
            z-index: 200;
            transition: background 0.2s ease, opacity 0.2s ease;
            border-radius: 4px;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        
        .mobile-nav-btn:hover,
        .mobile-nav-btn:active {
            background: rgba(34, 211, 238, 0.8);
        }
        
        #mobile-nav-prev {
            left: 5px;
            border-radius: 0 8px 8px 0;
        }
        
        #mobile-nav-next {
            right: 5px;
            border-radius: 8px 0 0 8px;
        }
        
        .mobile-menu-btn {
            top: 10px;
            left: 10px;
            transform: none;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            font-size: 20px;
        }
        
        .mobile-slide-counter {
            display: none;
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.8);
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            z-index: 200;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        
        /* Show mobile navigation on mobile devices - CSS media query */
        @media screen and (max-width: 1024px) {
            .mobile-nav-btn {
                display: flex;
                align-items: center;
                justify-content: center;
            }
            
            .mobile-slide-counter {
                display: block;
            }
            
            /* Hide desktop controls on mobile */
            #controls {
                display: none !important;
            }
            
            /* Expand slide wrapper to full height on mobile */
            #slide-wrapper {
                height: 100vh !important;
            }
            
            #player-container {
                height: 100vh !important;
            }
        }
        
        /* Mobile mode via JavaScript detection (for iframe scenarios) */
        body.mobile-mode .mobile-nav-btn {
            display: flex !important;
            align-items: center;
            justify-content: center;
        }
        
        body.mobile-mode .mobile-slide-counter {
            display: block !important;
        }
        
        body.mobile-mode #controls {
            display: none !important;
        }
        
        body.mobile-mode #slide-wrapper {
            height: 100vh !important;
        }
        
        body.mobile-mode #player-container {
            height: 100vh !important;
        }
        
        .slide-element {
            position: absolute !important;
            overflow: hidden !important;
        }
        
        /* Mobile optimization: expand elements and ensure content fits */
        @media screen and (max-width: 1024px) {
            .slide-element.quiz-element {
                /* These will be adjusted by JavaScript */
                overflow: auto !important;
            }
            
            /* Ensure text doesn't overflow on mobile */
            .slide-element.html-element iframe {
                max-width: 100% !important;
                max-height: 100% !important;
            }
        }
        
        /* Ensure iframe content stays within bounds */
        .html-element {
            overflow: hidden !important;
        }
        
        .html-element iframe {
            width: 100% !important;
            height: 100% !important;
            border: none !important;
            overflow: auto !important;
        }
        
        .text-element {
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-wrap: break-word;
            border-radius: 4px;
            padding: 8px;
            overflow: hidden !important;
            /* Background is set via inline style - transparent or custom */
        }
        
        .text-element iframe {
            width: 100% !important;
            height: 100% !important;
            border: none !important;
            overflow: auto !important;
        }
        
        .image-element {
            /* object-fit is set inline per element */
        }
        
        .image-element img {
            width: 100% !important;
            height: 100% !important;
            /* object-fit is set inline per element */
        }
        
        .video-element {
            border: none !important;
            background: transparent !important;
            position: relative !important;
            overflow: hidden !important;
        }
        
        .video-element .video-embed-container,
        .video-element .youtube-thumb-container {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
        }
        
        .video-element iframe,
        .video-element video {
            width: 100% !important;
            height: 100% !important;
            border: none !important;
            background: transparent !important;
        }
        
        /* WebM videos with transparent background */
        .video-element video[src*=".webm"] {
            background: transparent !important;
        }
        
        /* Button Element Styles */
        .button-element {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .scorm-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
        }
        
        .scorm-button.primary {
            background: linear-gradient(135deg, #7c3aed, #06b6d4);
            color: white;
        }
        
        .scorm-button.primary:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.4);
        }
        
        .scorm-button.secondary {
            background: #4b5563;
            color: white;
        }
        
        .scorm-button.secondary:hover {
            background: #374151;
        }
        
        .scorm-button.outline {
            background: transparent;
            border: 2px solid #7c3aed;
            color: #7c3aed;
        }
        
        .scorm-button.outline:hover {
            background: rgba(124, 58, 237, 0.1);
        }
        
        .scorm-button.ghost {
            background: transparent;
            color: #374151;
        }
        
        .scorm-button.ghost:hover {
            background: rgba(0, 0, 0, 0.05);
        }
        
        .scorm-button .btn-icon {
            font-size: 1.2em;
        }
        
        /* HTML Element Styles */
        .html-element {
            background: transparent;
            border-radius: 4px;
            overflow: hidden;
        }
        
        /* Mobile: allow scrolling inside html elements */
        @media screen and (max-width: 1024px) {
            .html-element {
                overflow: auto !important;
                -webkit-overflow-scrolling: touch;
            }
            
            .html-element iframe {
                pointer-events: auto !important;
            }
        }
        
        /* Mobile mode via JS - HTML elements */
        body.mobile-mode .html-element {
            overflow: auto !important;
            -webkit-overflow-scrolling: touch;
        }
        
        body.mobile-mode .html-element iframe {
            pointer-events: auto !important;
        }
        
        .html-element iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
        }
        
        /* Flipbook Element Styles */
        .flipbook-element {
            background: #f0f0f0;
            border-radius: 4px;
            overflow: hidden;
        }
        
        .flipbook-element iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        .flipbook-images-container {
            width: 100%;
            height: 100%;
        }
        
        #controls {
            height: 60px;
            background: #16213e;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-top: 1px solid #0f3460;
            transition: transform 0.3s ease, opacity 0.3s ease, height 0.3s ease;
            flex-shrink: 0;
            position: relative;
            z-index: 100;
        }
        
        /* Mobile: smaller controls */
        @media screen and (max-width: 900px) {
            #controls {
                height: 50px;
                padding: 0 10px;
            }
        }
        
        @media screen and (orientation: landscape) and (max-height: 500px) {
            #controls {
                height: 44px;
                padding: 0 8px;
            }
        }
        
        /* Quiz Player Container - Mobile Optimization */
        .quiz-player-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: rgba(15, 15, 26, 0.95);
            border-radius: 8px;
            overflow: auto;
        }
        
        @media screen and (max-width: 1024px) {
            .quiz-player-container {
                border-radius: 4px;
                font-size: 20px;
            }
            
            .quiz-player-container h2,
            .quiz-player-container h3 {
                font-size: 1.4em !important;
            }
            
            .quiz-player-container button {
                padding: 14px 20px !important;
                font-size: 18px !important;
            }
            
            .quiz-player-container .quiz-option {
                padding: 16px 18px !important;
                font-size: 18px !important;
                margin: 8px 0 !important;
                line-height: 1.4 !important;
            }
            
            .quiz-player-container p {
                font-size: 18px !important;
                line-height: 1.5 !important;
            }
            
            /* Feedback text */
            .quiz-player-container .feedback,
            .quiz-player-container [class*="feedback"],
            .quiz-player-container div[style*="background"] p {
                font-size: 18px !important;
                line-height: 1.5 !important;
            }
        }
        
        /* Mobile mode via JS - Quiz fonts */
        body.mobile-mode .quiz-player-container {
            font-size: 20px !important;
        }
        
        body.mobile-mode .quiz-player-container h2,
        body.mobile-mode .quiz-player-container h3 {
            font-size: 1.4em !important;
        }
        
        body.mobile-mode .quiz-player-container .quiz-option {
            padding: 16px 18px !important;
            font-size: 18px !important;
            margin: 8px 0 !important;
            line-height: 1.4 !important;
        }
        
        body.mobile-mode .quiz-player-container button {
            padding: 14px 20px !important;
            font-size: 18px !important;
        }
        
        body.mobile-mode .quiz-player-container p {
            font-size: 18px !important;
            line-height: 1.5 !important;
        }
        
        /* Feedback text - mobile mode */
        body.mobile-mode .quiz-player-container .feedback,
        body.mobile-mode .quiz-player-container [class*="feedback"],
        body.mobile-mode .quiz-player-container div[style*="background"] p {
            font-size: 18px !important;
            line-height: 1.5 !important;
        }
        
        @media screen and (orientation: landscape) and (max-height: 600px) {
            .quiz-player-container {
                font-size: 12px;
            }
            
            .quiz-player-container h2,
            .quiz-player-container h3 {
                font-size: 1.1em !important;
                margin: 5px 0 !important;
            }
            
            .quiz-player-container button {
                padding: 8px 12px !important;
                font-size: 12px !important;
            }
            
            .quiz-player-container .quiz-option {
                padding: 8px 12px !important;
                margin: 4px 0 !important;
            }
        }
        
        .nav-buttons {
            display: flex;
            gap: 10px;
        }
        
        @media screen and (max-width: 900px) {
            .nav-buttons {
                gap: 5px;
            }
        }
        
        .control-btn {
            background: #0f3460;
            border: none;
            color: #fff;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        
        /* Mobile: smaller buttons */
        @media screen and (max-width: 900px) {
            .control-btn {
                padding: 8px 12px;
                font-size: 12px;
                border-radius: 4px;
            }
        }
        
        @media screen and (orientation: landscape) and (max-height: 500px) {
            .control-btn {
                padding: 6px 10px;
                font-size: 11px;
            }
        }
        
        .control-btn:hover:not(:disabled) {
            background: #1a4980;
        }
        
        .control-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        #progress-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 20px;
        }
        
        .progress-dots {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .progress-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }
        
        .progress-dot:hover {
            background: rgba(255, 255, 255, 0.5);
        }
        
        .progress-dot.active {
            background: #06b6d4;
            transform: scale(1.2);
        }
        
        .progress-dot.completed {
            background: #10b981;
        }
        
        @media screen and (max-width: 900px) {
            .progress-dots {
                gap: 4px;
            }
            .progress-dot {
                width: 8px;
                height: 8px;
            }
        }
        
        /* Mobile Quiz Optimization - Make quiz readable on small screens */
        @media screen and (max-width: 1024px) {
            .quiz-player-container {
                font-size: 16px !important;
            }
            .quiz-player-container h2,
            .quiz-player-container h3 {
                font-size: 18px !important;
            }
            .quiz-player-container p {
                font-size: 14px !important;
            }
            .quiz-player-container button {

                font-size: 16px !important;

                padding: 8px 16px !important;
            }

            .quiz-player-container div[onclick] {
                padding: 12px !important;
                margin: 6px 0 !important;
            }
        }
        
        /* Portrait mobile - even larger fonts for readability */
        @media screen and (orientation: portrait) and (max-width: 600px) {
            .quiz-player-container {
                font-size: 16px !important;
                padding: 12px !important;
            }
            .quiz-player-container h2,
            .quiz-player-container h3 {
                font-size: 20px !important;
            }
            .quiz-player-container p {
                font-size: 15px !important;
            }
            .quiz-player-container button {
                font-size: 15px !important;
                padding: 12px 24px !important;

        #volume-slider::-webkit-slider-thumb {

            background: linear-gradient(135deg, #7c3aed, #06b6d4);
            cursor: pointer;
            transition: transform 0.1s;
        }
        
        #volume-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }
        
        #volume-slider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;

            top: 0;
            left: 0;
            right: 0;
            bottom: 60px;
            background: rgba(15, 23, 42, 0.95);

            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }
        
        .start-overlay-content {
            text-align: center;
            color: #fff;
            padding: 40px;
            max-width: 400px;
        }
        
        .start-overlay-icon {
            font-size: 64px;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }
        
        .start-overlay-content h2 {
            font-size: 24px;
            margin: 0 0 10px 0;
            color: #f1f5f9;
        }
        
        .start-overlay-content p {
            font-size: 14px;
            color: #94a3b8;
            margin: 0 0 30px 0;
        }
        
        .start-btn {
            background: linear-gradient(135deg, #7c3aed, #06b6d4);

            color: #fff;
            padding: 16px 40px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 18px;
            font-weight: 600;

        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(124, 58, 237, 0.6);
        }
        
        .start-btn:active {
            transform: translateY(0);
        }
        
        /* Mobile Orientation Overlay */
        #orientation-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            z-index: 99999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        
        /* Force orientation overlay in portrait mode on mobile devices - JS controlled */
        @media screen and (orientation: portrait) and (max-width: 1024px) {
            /* JS controls overlay display, can be dismissed */
        }
        
        /* Also catch tall-narrow viewports (portrait in iframe/LMS) - JS controlled */
        @media screen and (max-aspect-ratio: 4/5) and (max-width: 1024px) {
            /* JS controls overlay display, can be dismissed */
        }
        
        /* Catch any tall viewport regardless of orientation API support */
        @media screen and (max-width: 1024px) and (min-height: 500px) {
            /* When height > width, we're in portrait */
        }
        
        .orientation-content {
            text-align: center;
            padding: 30px;
            color: white;
            max-width: 90%;
        }
        
        .orientation-icon {
            font-size: 70px;
            margin-bottom: 10px;
            animation: shake 1.5s ease-in-out infinite;
        }
        
        .orientation-arrow {
            font-size: 50px;
            color: #7c3aed;
            margin-bottom: 15px;
            animation: rotate-hint 2s ease-in-out infinite;
        }
        
        @keyframes rotate-hint {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
        }
        
        @keyframes shake {
            0%, 100% { transform: rotate(-10deg); }
            50% { transform: rotate(10deg); }
        }
        
        .orientation-content h2 {
            font-size: 24px;
            margin-bottom: 12px;
            color: #fff;
        }
        
        .orientation-content p {
            font-size: 14px;
            color: #a0aec0;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        
        .orientation-hint {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
        }
        
        .phone-icon {
            font-size: 40px;
            transition: all 0.3s ease;
        }
        
        .phone-icon.vertical {
            opacity: 0.5;
        }
        
        .phone-icon.horizontal {
            transform: rotate(90deg);
            color: #7c3aed;
        }
        
        .orientation-hint .arrow {
            font-size: 24px;
            color: #7c3aed;
            animation: pulse-arrow 1s ease-in-out infinite;
        }
        
        @keyframes pulse-arrow {
            0%, 100% { transform: translateX(0); opacity: 1; }
            50% { transform: translateX(10px); opacity: 0.5; }
        }
        
        /* Continue in portrait button */
        .continue-portrait-btn {
            margin-top: 25px;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.3);
            color: #94a3b8;
            padding: 12px 28px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .continue-portrait-btn:hover,
        .continue-portrait-btn:active {
            background: rgba(255,255,255,0.1);
            color: #fff;
            border-color: rgba(255,255,255,0.5);
        }
        
        /* Scroll indicator */
        .scroll-indicator {
            position: fixed;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: rgba(255,255,255,0.6);
            font-size: 12px;
            z-index: 300;
            animation: scroll-bounce 2s ease-in-out infinite;
            pointer-events: none;
        }
        
        .scroll-indicator-arrow {
            font-size: 20px;
            animation: scroll-bounce 2s ease-in-out infinite;
        }
        
        @keyframes scroll-bounce {
            0%, 100% { transform: translateY(0); opacity: 0.6; }
            50% { transform: translateY(8px); opacity: 1; }
        }
    
        /* Slide Timeline Progress Bar */
        #slide-timeline-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: rgba(255,255,255,0.1);
            z-index: 500;
            overflow: hidden;
            transition: height 0.2s ease;
        }
        #slide-timeline-bar:hover {
            height: 6px;
        }
        #slide-timeline-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #06b6d4, #8b5cf6);
            transition: width 0.15s linear;
            border-radius: 0 2px 2px 0;
        }
        #slide-timeline-fill.complete {
            background: linear-gradient(90deg, #22c55e, #16a34a);
            width: 100% !important;
        }
        /* Pulsing glow when complete */
        #slide-timeline-fill.complete::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(34, 197, 94, 0.4);
            animation: timeline-pulse 1.5s ease-in-out 2;
        }
        @keyframes timeline-pulse {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }
        /* Mobile adjustments */
        body.mobile-mode #slide-timeline-bar {
            height: 3px;
        }

    </style>
</head>
<body>

    <!-- VLibras - Acessibilidade em LIBRAS -->
    <script>
        // CORS proxy for VLibras servers - intercept XHR to dicionario2 and traducao2
        (function() {
            var PROXY_BASE = "https://scormfy-synthesia.preview.emergentagent.com/api/vlibras-proxy";
            if (!PROXY_BASE) return;
            var _domainMap = {
                "dicionario2.vlibras.gov.br": PROXY_BASE + "/dicionario2",
                "traducao2.vlibras.gov.br": PROXY_BASE + "/traducao2"
            };
            var _origOpen = XMLHttpRequest.prototype.open;
            XMLHttpRequest.prototype.open = function(method, url) {
                if (typeof url === "string") {
                    for (var domain in _domainMap) {
                        if (url.indexOf(domain) !== -1) {
                            try {
                                var u = new URL(url);
                                var newUrl = _domainMap[domain] + u.pathname + u.search;
                                console.log("[VLibras Proxy] " + method + " " + domain + u.pathname + " -> proxy");
                                arguments[1] = newUrl;
                            } catch(e) { console.warn("[VLibras Proxy] URL parse error:", e); }
                            break;
                        }
                    }
                }
                return _origOpen.apply(this, arguments);
            };
        })();
    </script>
