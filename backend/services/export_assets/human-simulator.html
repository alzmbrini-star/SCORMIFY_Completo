<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#0b1428;color:#e8f0ff}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #ffc861;outline-offset:2px}button:disabled{cursor:not-allowed;opacity:.5}#app{height:100%;display:flex;flex-direction:column;background:radial-gradient(at right top,#1b3962,transparent 65%)}header{flex:none;padding:12px 18px;border-bottom:1px solid #ffffff1c}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;color:#7fdfcf}h1{font-size:clamp(22px,2.4vw,32px);margin:5px 0}h2{font-size:22px;margin:8px 0;line-height:1.3}h3{font-size:17px}p{font-size:16px;line-height:1.5;margin:8px 0}.mission{margin:4px 0;color:#bacce7;font-size:14px}.layout{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(320px,1fr);gap:12px;padding:12px}.conversation,.panel{min-height:0;border:1px solid #7595c33d;border-radius:18px;overflow:hidden;display:flex;flex-direction:column}.conversation{background:#10223b}.scene{height:125px;flex:none;position:relative;background:#1c3857}.scene svg{width:100%;height:100%;display:block}.scene-caption{position:absolute;top:8px;left:10px;padding:5px 8px;border-radius:8px;background:#0c1d34df;font-size:12px;color:white}.transcript{flex:1;min-height:0;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px}.bubble{background:#1d3858;border:1px solid #8eb5dc33;border-radius:12px;padding:12px;max-width:95%;font-size:16px;line-height:1.5;white-space:pre-wrap}.bubble.user{background:#245e9e;align-self:flex-end}.speaker{display:block;color:#a8d7f1;font-size:12px;font-weight:700;margin-bottom:5px}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));flex:none;gap:8px;padding:10px;background:#132944}.metric{min-width:0;font-size:12px;color:#c6d8ee;overflow-wrap:anywhere}.metric strong{display:block;font-size:23px;color:#86e6d4;margin:4px 0}progress{width:100%;height:8px;accent-color:#46c8b2}.panel{background:#f5f8fd;color:#172c49}.body{flex:1;min-height:0;overflow:auto;padding:18px}.body .eyebrow{color:#176c75}.muted{font-size:13px;color:#58718e}.profile{font-size:14px;line-height:1.5;padding:12px;background:#e7eef8;border-radius:12px}.prompt{padding:13px;border-left:3px solid #3ca99b;background:#e6f5f1;border-radius:5px;font-size:16px;line-height:1.5}.choice{display:block;border:1px solid #acbfda;border-radius:12px;padding:13px;width:100%;margin:9px 0;background:white;color:#193151;text-align:left;line-height:1.45;font-size:16px;min-height:44px}.choice.selected{border:2px solid #2566ca;background:#e5efff}.choice:disabled{opacity:.65}.feedback{margin:12px 0;padding:13px;border-radius:12px;background:#e2eeff;border:1px solid #9db9dc;line-height:1.5;font-size:15px}.delta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;font-size:12px}.delta span{padding:4px 6px;background:#fff8;border-radius:6px}.funnel{display:grid;gap:6px;margin:12px 0}.milestone{padding:9px 12px;border:1px solid #bbcae0;border-radius:8px;background:#e9eef7;font-size:13px}.milestone.done{background:#d7f3e9;border-color:#63bda0;color:#175443}.facts{border-top:1px solid #c7d3e4;padding-top:12px}.fact{font-size:14px;padding:8px;border-radius:8px;background:#e4f2ed;margin:6px 0}.review{border:1px solid #bed0e5;background:white;border-radius:12px;padding:13px;margin:12px 0}.review p{font-size:15px}footer{flex:none;display:flex;gap:10px;padding:12px;background:#e8eef8;border-top:1px solid #c4d1e4}.primary,.secondary{border:0;border-radius:9px;padding:11px 15px;min-height:42px;font-weight:700}.primary{flex:1;background:#2366c6;color:white}.secondary{background:#1e385a;color:white}.notice{font-size:12px;color:#536c88;line-height:1.5}details{margin:12px 0}summary{font-size:14px;cursor:pointer;font-weight:700}
@media(max-width:680px){.layout{grid-template-columns:1fr;grid-template-rows:minmax(125px,35%) minmax(0,1fr);padding:7px;gap:7px}.scene{display:none}.metrics{padding:7px}.metric strong{font-size:19px}.body{padding:12px}header{padding:9px 12px}.mission{display:none}h1{font-size:22px}footer{padding:9px}}
</style></head><body data-human-simulator-version="1"><main id="app"><header><h1>Simulação de conversa</h1><p>Prepare sua estratégia: escute o interlocutor, investigue necessidades e acompanhe as consequências das suas decisões.</p></header></main><script id="dialogue-data" type="application/json">__DIALOGUE_DATA__</script><script id="scormify-simulator-plan" type="application/json">__PLAN_DATA__</script><script>
(function(){'use strict';
const data=JSON.parse(document.getElementById('dialogue-data').textContent),root=document.getElementById('app');
let turn=0,metrics=[50,50,35],facts=new Set(),history=[],locked=false,finished=false;
function node(tag,cls,text,parent){const n=document.createElement(tag);n.className=cls||'';if(text!==undefined)n.textContent=text;if(parent)parent.appendChild(n);return n}
function button(text,cls,action,parent,disabled=false){const b=node('button',cls,text,parent);b.type='button';b.disabled=disabled;b.onclick=action;return b}
function reset(){turn=0;metrics=[50,50,35];facts=new Set();history=[];locked=false;finished=false;render()}
function mood(){return metrics[0]<45?'Na defensiva':metrics[0]>=65?'Receptivo':'Cauteloso'}
function office(parent){const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 600 180');svg.setAttribute('role','img');svg.setAttribute('aria-label','Escritório com mesa, computador, janela e interlocutor '+mood().toLowerCase());parent.appendChild(svg);
function shape(tag,attrs){const n=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,String(v)));svg.appendChild(n);return n}
shape('rect',{width:600,height:180,fill:'#24435d'});shape('rect',{x:345,y:12,width:220,height:112,rx:5,fill:'#b9ddeb',stroke:'#6f97ad','stroke-width':5});
[[353,65,25,59],[386,42,30,82],[426,76,24,48],[460,33,34,91],[505,58,25,66],[538,82,20,42]].forEach(([x,y,width,height])=>{shape('rect',{x,y,width,height,fill:'#678ca7'});shape('path',{d:`M${x+7} ${y+10}v${height-15}`,stroke:'#c1e5ec','stroke-width':3,'stroke-dasharray':'5 7'})});shape('path',{d:'M455 12v112M345 66h220',stroke:'#547e99','stroke-width':4});
shape('rect',{x:25,y:25,width:92,height:65,rx:4,fill:'#405f74',stroke:'#8ba6b9','stroke-width':3});shape('path',{d:'M38 72l20-20 18 10 24-25',fill:'none',stroke:'#7ee1ce','stroke-width':4});
shape('rect',{x:147,y:76,width:100,height:103,rx:24,fill:'#11273d'});shape('path',{d:'M154 167v-36q43-35 85 0v36Z',fill:'#427ea6'});shape('path',{d:'M184 117l13 19 13-19',fill:'#f2d4bd'});shape('ellipse',{cx:197,cy:77,rx:30,ry:37,fill:'#dcae8c'});shape('path',{d:'M166 77q-9-51 34-45 37 3 27 48l-7-25q-27 9-43-4Z',fill:'#2b292e'});
shape('path',{d:metrics[0]<45?'M179 69l11 4M206 73l11-4':'M179 69h11M206 69h11',stroke:'#493a36','stroke-width':2});shape('circle',{cx:185,cy:79,r:2,fill:'#2f303c'});shape('circle',{cx:211,cy:79,r:2,fill:'#2f303c'});shape('path',{d:metrics[0]<45?'M186 99q12-8 23 0':metrics[0]>=65?'M186 94q12 14 23 0':'M189 97h18',fill:'none',stroke:'#814e48','stroke-width':2});
shape('path',{d:'M96 144h430l23 22H73Z',fill:'#b08762'});shape('rect',{x:85,y:164,width:454,height:12,rx:3,fill:'#72543e'});shape('rect',{x:318,y:89,width:96,height:61,rx:5,fill:'#1a293a',stroke:'#7693aa','stroke-width':3});shape('path',{d:'M366 149v10m-19 0h38',stroke:'#607e96','stroke-width':5});shape('rect',{x:258,y:146,width:35,height:5,rx:2,fill:'#cbe0e9'});shape('path',{d:'M465 137v-32m0 20q-26-25-26-7 3 13 26 7m0-5q26-25 24-8-2 12-24 8',fill:'#539578',stroke:'#72b698','stroke-width':2});shape('path',{d:'M450 136h30l-6 21h-18Z',fill:'#d4b49a'});
}
function choose(index){if(locked||finished)return;const choice=data.turns[turn].choices[index];if(choice.requiresFact&&!facts.has(choice.requiresFact))return;
const prompt=metrics[0]<45?data.turns[turn].guardedPrompt:data.turns[turn].openPrompt;
metrics=metrics.map((value,i)=>Math.max(0,Math.min(100,value+choice.effects[i])));choice.reveals.forEach(key=>facts.add(key));const response=metrics[0]<45?choice.guardedResponse:choice.openResponse;
history.push({...choice,response,prompt,turn,metrics:[...metrics]});locked=true;render()}
function render(){root.replaceChildren();const head=node('header','',undefined,root);node('div','eyebrow','SIMULAÇÃO · CONVERSA COM CONSEQUÊNCIAS',head);node('h1','',data.title,head);node('p','mission',data.mission,head);
const layout=node('div','layout',undefined,root),conversation=node('section','conversation',undefined,layout),scene=node('div','scene',undefined,conversation);office(scene);node('span','scene-caption',data.profile.name+' · '+mood(),scene);
const transcript=node('div','transcript',undefined,conversation);transcript.setAttribute('aria-label','Histórico da conversa');function speech(text,user){const bubble=node('div','bubble '+(user?'user':''),undefined,transcript);node('span','speaker',user?'Sua ação':data.profile.name,bubble);node('span','',text,bubble)}speech(data.profile.opening,false);history.forEach(item=>{speech(item.label,true);speech(item.response,false)});transcript.scrollTop=transcript.scrollHeight;
const indicators=node('div','metrics',undefined,conversation);data.metrics.forEach((label,i)=>{const box=node('div','metric',label,indicators);node('strong','',metrics[i]+'/100',box);const progress=node('progress','',undefined,box);progress.max=100;progress.value=metrics[i];progress.setAttribute('aria-label',label)});
const panel=node('section','panel',undefined,layout),body=node('div','body',undefined,panel),footer=node('footer','',undefined,panel);
if(finished){const quality=history.reduce((sum,item)=>sum+item.quality,0)/(data.turns.length*2);node('div','eyebrow','ANÁLISE DA NEGOCIAÇÃO / CONVERSA',body);node('h2','',quality>=.7&&metrics[0]>=45&&facts.size>=3?'Conversa bem encaminhada':quality>=.4&&metrics[0]>=30?'Avanço parcial: há pontos a retomar':'A relação precisa ser reconstruída',body);node('p','',data.debrief,body);history.forEach(item=>{const review=node('article','review',undefined,body);node('h3','',data.turns[item.turn].title,review);node('p','','Sua ação: '+item.label,review);node('p','','Reação: '+item.response,review);node('p','',item.feedback,review);if(item.quality<2){const best=data.turns[item.turn].choices.find(c=>c.quality===2);node('p','','Compare com: '+best.label,review)}});button('Reiniciar conversa','primary',reset,footer)}
else{const current=data.turns[turn];node('div','eyebrow','TURNO '+(turn+1)+' DE '+data.turns.length,body);node('h2','',current.title,body);node('div','profile',data.profile.role+' · Objetivo: '+data.profile.goal+' · Restrição: '+data.profile.constraint,body);node('p','prompt',locked?history[history.length-1].prompt:metrics[0]<45?current.guardedPrompt:current.openPrompt,body);
current.choices.forEach((choice,i)=>{const unavailable=choice.requiresFact&&!facts.has(choice.requiresFact),b=button(choice.label,'choice '+(locked&&history[history.length-1].label===choice.label?'selected':''),()=>choose(i),body,locked||unavailable);if(unavailable){const fact=data.facts.find(f=>f.id===choice.requiresFact);node('p','muted','Antes desta ação, é necessário descobrir: '+fact.text,body)}b.setAttribute('aria-label',choice.label)});
if(locked){const last=history[history.length-1],feedback=node('div','feedback',last.feedback,body);feedback.setAttribute('role','status');const deltas=node('div','delta',undefined,feedback);last.effects.forEach((value,i)=>node('span','',data.metrics[i]+': '+(value>0?'+':'')+value,deltas));button(turn===data.turns.length-1?'Ver resultado':'Continuar conversa →','primary',()=>{if(turn===data.turns.length-1)finished=true;else turn++;locked=false;render()},footer)}else node('p','muted','Escolha uma fala ou ação. O interlocutor reagirá conforme a confiança e o histórico.',body);button('Reiniciar','secondary',reset,footer)}
const funnel=node('div','funnel',undefined,body);node('h3','','Progresso por descobertas',funnel);data.milestones.forEach((milestone,i)=>{const done=milestone.factIds.every(key=>facts.has(key));node('div','milestone '+(done?'done':''),(done?'✓ ':'○ ')+(i+1)+'. '+milestone.title,funnel)});
const details=node('details','facts',undefined,body);node('summary','',facts.size+' informações descobertas',details);data.facts.filter(f=>facts.has(f.id)).forEach(f=>node('p','fact',f.text,details));if(!facts.size)node('p','muted','Investigue o contexto e escute o interlocutor para descobrir informações.',details);node('p','notice','Cenário fictício. Indicadores são índices didáticos; não representam previsões comerciais ou avaliação psicológica.',body);
}render();
})();
</script></body></html>
