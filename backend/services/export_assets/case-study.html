<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;color:#eaf1ff;background:#0c1730}button,textarea{font:inherit}button{cursor:pointer}button:focus-visible,textarea:focus-visible{outline:3px solid #fbbf24;outline-offset:2px}button:disabled{opacity:.5;cursor:not-allowed}#app{height:100%;display:flex;flex-direction:column;background:radial-gradient(at top right,#203e72,transparent 65%)}header{padding:14px 20px;border-bottom:1px solid #b6cfff30;flex:none}.eyebrow{color:#75dfd5;font-size:12px;font-weight:800;letter-spacing:.08em}h1{font-size:clamp(22px,2.5vw,32px);margin:6px 0}h2{font-size:22px;line-height:1.3;margin:8px 0}h3{font-size:17px}p{font-size:16px;line-height:1.55;margin:10px 0}nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.step{padding:7px 12px;border-radius:20px;background:#1e3154;color:#bfcfed;font-size:13px}.step.active{background:#246bcb;color:white}.step.done{color:#87f0cd}.layout{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(320px,1fr);gap:14px;padding:14px}.dossier,.decision{min-height:0;border:1px solid #adc6ff30;border-radius:18px;background:#12223e;overflow:hidden}.dossier{overflow:auto;padding:18px}.decision{display:flex;flex-direction:column;background:#f7f9fe;color:#142542}.body{flex:1;min-height:0;overflow:auto;padding:20px}footer{flex:none;display:flex;gap:10px;padding:12px 18px;border-top:1px solid #bccce5;background:#eaf0fa}.primary,.secondary{border:0;border-radius:10px;min-height:42px;padding:10px 16px;font-weight:700}.primary{flex:1;background:#2566cc;color:white}.secondary{background:#20375d;color:white}.evidence{margin-top:12px;padding:14px;border:1px solid #6889b5;border-radius:12px;background:#182e50}.evidence.read{border-color:#59cfb1}.evidence button{display:flex;align-items:center;gap:10px;width:100%;background:transparent;border:0;color:inherit;text-align:left;font-weight:700;min-height:42px}.evidence svg{width:30px;height:30px;flex:none;color:#7eddd5}.evidence .source{font-size:13px;color:#bad1f3;border-top:1px solid #6889b550;padding-top:8px}.muted{font-size:14px;color:#b4c8e5}.body .muted{color:#516787}.choice{display:block;width:100%;border:1px solid #b6c7e2;border-radius:12px;background:white;color:#182c4d;text-align:left;padding:14px;margin:10px 0;font-size:16px;line-height:1.45}.choice.selected{border:2px solid #2566cc;background:#e5efff}.choice:disabled{opacity:1}label{display:block;margin-top:16px;font-weight:700}textarea{width:100%;min-height:85px;border:1px solid #a8bad6;border-radius:10px;padding:12px;margin-top:8px;resize:vertical;font-size:16px}.feedback{padding:14px;border-radius:12px;background:#e1efff;border:1px solid #88b7ee;margin-top:12px}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}.metric{padding:10px;background:#213b60;border-radius:10px;font-size:13px;overflow-wrap:anywhere}.metric b{display:block;font-size:23px;margin:5px 0;color:#7ce4d0}progress{width:100%;accent-color:#39bca8;height:8px}.review{padding:15px;border:1px solid #bccce5;border-radius:12px;margin:12px 0;background:white}.notice{padding:10px;border-left:3px solid #49bdb0;background:#49bdb015;font-size:14px}.error{color:#ad2447;font-size:14px}blockquote{border-left:3px solid #5d82bc;margin:10px 0;padding-left:12px;font-size:15px;line-height:1.5}
@media(max-width:680px){.layout{grid-template-columns:1fr;grid-template-rows:minmax(130px,38%) minmax(0,1fr);gap:8px;padding:8px}header{padding:9px 12px}h1{font-size:22px}.body,.dossier{padding:12px}.metrics{gap:4px}.metric{padding:7px}.step{font-size:12px;padding:5px 8px}}
.body .eyebrow{color:#1c6477}
</style></head><body data-case-study-version="2"><main id="app"><header><h1>Estudo de caso interativo</h1><p>Preparando o dossiê: consulte as evidências, justifique suas decisões e compare as consequências na análise final.</p></header></main><script id="case-data" type="application/json">__CASE_DATA__</script><script>
(function(){
'use strict';
const spec=JSON.parse(document.getElementById('case-data').textContent),root=document.getElementById('app');
let index=0,selected=null,justification='',showResult=false,history=[],read=new Set(),opened=new Set(),metrics=[50,50,50];
function el(tag,cls,text,parent){const n=document.createElement(tag);n.className=cls||'';if(text!==undefined)n.textContent=text;if(parent)parent.appendChild(n);return n}
function btn(text,cls,fn,parent,disabled=false){const b=el('button',cls,text,parent);b.type='button';b.disabled=disabled;b.onclick=fn;return b}
function reset(){index=0;selected=null;justification='';showResult=false;history=[];read=new Set();opened=new Set();metrics=[50,50,50];render()}
function icon(parent){const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg'),p=document.createElementNS(ns,'path');svg.setAttribute('viewBox','0 0 32 32');svg.setAttribute('aria-hidden','true');p.setAttribute('d','M8 3h12l5 5v21H7V3zm11 1v6h6M11 15h10M11 20h10M11 25h7');p.setAttribute('fill','none');p.setAttribute('stroke','currentColor');p.setAttribute('stroke-width','2');svg.appendChild(p);parent.appendChild(svg)}
function render(){root.replaceChildren();const head=el('header','',undefined,root);el('div','eyebrow','ESTUDO DE CASO · INVESTIGAR E DECIDIR',head);el('h1','',spec.title,head);const nav=el('nav','',undefined,head);nav.setAttribute('aria-label','Etapas do caso');['Investigar',...spec.decisions.map((d,i)=>'Decisão '+(i+1)),'Análise final'].forEach((text,i)=>el('span','step '+(i=== (showResult?4:index+1)?'active':i<=history.length?'done':''),text,nav));
const layout=el('div','layout',undefined,root),left=el('section','dossier',undefined,layout);el('div','eyebrow','DOSSIÊ DO CASO',left);el('h2','','Sua missão',left);el('p','',spec.mission,left);el('p','',spec.context,left);el('p','notice','Cenário e evidências fictícios para prática. Indicadores são índices didáticos, não previsões reais.',left);el('h3','','Evidências · '+read.size+'/'+spec.evidence.length+' consultadas',left);
spec.evidence.forEach(e=>{const card=el('article','evidence '+(read.has(e.id)?'read':''),undefined,left);const b=btn((read.has(e.id)?'✓ ':'')+e.title,'',()=>{read.add(e.id);if(opened.has(e.id))opened.delete(e.id);else opened.add(e.id);render()},card);b.setAttribute('aria-expanded',String(opened.has(e.id)));icon(b);if(opened.has(e.id)){el('p','',e.text,card);el('p','source','Conceito do curso: '+e.sourceEvidence,card)}});
const indicators=el('div','metrics',undefined,left);spec.metrics.forEach((label,i)=>{const box=el('div','metric',label,indicators);el('b','',String(metrics[i])+'/100',box);const p=el('progress','',undefined,box);p.max=100;p.value=metrics[i];p.setAttribute('aria-label',label)});
const panel=el('section','decision',undefined,layout),body=el('div','body',undefined,panel),foot=el('footer','',undefined,panel);
if(showResult){const score=history.reduce((sum,h)=>sum+h.quality,0);el('div','eyebrow','ANÁLISE DA SUA TRAJETÓRIA',body);el('h2','',score>=5?'Estratégia bem fundamentada':score>=3?'Resultado parcial: revise os pontos de atenção':'Há decisões importantes a reconsiderar',body);el('p','',spec.debrief,body);history.forEach((h,i)=>{const box=el('article','review',undefined,body);el('h3','',spec.decisions[i].title,box);el('p','','Sua ação: '+h.label,box);el('blockquote','',h.justification,box);el('p','',h.feedback,box);if(h.quality<2){const best=spec.decisions[i].choices.find(c=>c.quality===2);el('p','','Alternativa mais fundamentada: '+best.label+'. '+best.feedback,box)}});el('p','muted','Sua justificativa foi registrada para reflexão; o sistema não atribui nota automática ao texto livre.',body);btn('Reiniciar estudo de caso','primary',reset,foot);return}
const d=spec.decisions[index],last=history[index];el('div','eyebrow','DECISÃO '+(index+1)+' DE '+spec.decisions.length,body);el('h2','',d.title,body);el('p','',d.question,body);el('p','muted','Consulte as evidências relacionadas antes de confirmar. Depois, justifique sua decisão com base nelas.',body);
const relevant=d.evidenceIds.every(id=>read.has(id));d.choices.forEach((c,i)=>{const b=btn(c.label,'choice '+(selected===i?'selected':''),()=>{selected=i;render()},body,Boolean(last));b.setAttribute('aria-pressed',String(selected===i))});
const label=el('label','','Como as evidências sustentam sua decisão?',body);label.htmlFor='reason';const input=el('textarea','',undefined,body);input.id='reason';input.value=justification;input.maxLength=1500;input.disabled=Boolean(last);input.placeholder='Relacione sua ação aos fatos do caso…';
if(last){const feedback=el('div','feedback',last.feedback,body);feedback.setAttribute('role','status');btn(index===2?'Ver análise final':'Próxima decisão →','primary',()=>{index++;selected=null;justification='';if(index>=3)showResult=true;render()},foot)}
else{const status=el('p',relevant?'muted':'error',relevant?'Registre uma justificativa de pelo menos 15 caracteres.':'Abra todas as evidências relacionadas a esta decisão.',body);status.setAttribute('role','status');const confirm=btn('Confirmar decisão','primary',()=>{if(selected===null||!relevant||justification.trim().length<15)return;const choice=d.choices[selected];history.push({...choice,justification});metrics=metrics.map((v,i)=>Math.max(0,Math.min(100,v+choice.effects[i])));render()},foot,selected===null||!relevant||justification.trim().length<15);input.oninput=()=>{justification=input.value;confirm.disabled=selected===null||!relevant||justification.trim().length<15}}
btn('Recomeçar','secondary',reset,foot);
}render();
})();
</script></body></html>
