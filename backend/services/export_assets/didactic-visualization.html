<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visualização didática</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#0c1729;color:#eff6ff}body{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:10px;padding:14px}h1{font-size:clamp(20px,2.5vw,32px);margin:3px 0}p{margin:4px 0;font-size:clamp(14px,1.5vw,18px);line-height:1.35}header small{color:#73e4db;text-transform:uppercase;font-weight:bold}main{display:grid;grid-template-columns:minmax(0,3fr) minmax(220px,1fr);gap:12px;min-height:0}figure{margin:0;border:1px solid #536f8a;border-radius:14px;overflow:hidden;min-height:0;position:relative}svg{display:block;width:100%;height:100%}aside{background:#162c45;border-radius:12px;padding:12px;overflow:auto}aside h2{font-size:18px;margin:0 0 8px}.items{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}button,select,input{font:inherit}button,select{background:#233f5c;color:#fff;border:1px solid #7998b3;border-radius:8px;padding:8px 12px;min-height:36px;cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid #ffce56;outline-offset:2px}button[aria-pressed=true]{background:#146d78}footer{display:flex;align-items:center;gap:10px;flex-wrap:wrap}footer label{display:flex;align-items:center;gap:7px}footer input[type=range]{width:clamp(100px,18vw,300px)}#detail{padding:8px;background:#0c2236;border-radius:8px}#notice{font-size:14px;color:#ffe2a0}#subtitle{max-height:3em;overflow:auto}.items button{font-size:14px;padding:6px 8px}#progress{font-variant-numeric:tabular-nums;min-width:75px}@media(max-width:650px){body{padding:8px;gap:6px}main{grid-template-columns:minmax(0,1fr) 190px;gap:6px}aside{padding:8px}.items{max-height:80px;overflow:auto}footer{gap:6px}button,select{padding:6px}h1{font-size:20px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body data-sim-engine="didactic-visualization-v1"><header><small>Visualização didática · explorar e observar</small><h1 id="title"></h1><p id="subtitle"></p></header><main><figure><svg id="scene" viewBox="0 0 800 450" role="img" aria-label="Cena animada"></svg></figure><aside><h2>Observe e explore</h2><p id="goal"></p><div class="items" id="items" aria-label="Objetos da cena"></div><p id="detail" role="status">Selecione um objeto para consultar sua explicação.</p><details><summary>Modelo e limites científicos</summary><p id="notice"></p></details></aside></main><footer aria-label="Controles da visualização"><button id="play" aria-pressed="false">Iniciar</button><button id="reset">Reiniciar</button><label>Velocidade <select id="speed"><option value="0.5">0,5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label><label>Tempo <input id="time" type="range" min="0" max="1000" value="0" step="1"></label><output id="progress">0,0 s</output><button id="labels" aria-pressed="true">Legendas</button></footer><script id="scormify-visualization-plan" type="application/json">__VISUAL_DATA__</script><script>
(function(){'use strict';var data=JSON.parse(document.getElementById('scormify-visualization-plan').textContent),ns='http://www.w3.org/2000/svg',scene=document.getElementById('scene'),time=0,playing=false,last=null,raf=null,nodes={},groups={},labels=[],destroyed=false;
function $(id){return document.getElementById(id)}$('title').textContent=data.title;document.title=data.title;$('subtitle').textContent=data.subtitle;$('goal').textContent=data.learningGoal;$('notice').textContent=data.scientificNote;scene.style.background=data.background;scene.setAttribute('aria-label',data.title+'. '+data.learningGoal);
var map={x:'cx',y:'cy',strokeWidth:'stroke-width',fontSize:'font-size',fontWeight:'font-weight',anchor:'text-anchor'};
data.nodes.forEach(function(n){var g=document.createElementNS(ns,'g'),el=document.createElementNS(ns,n.type);g.setAttribute('role','button');g.setAttribute('tabindex','0');g.setAttribute('aria-label',n.label);Object.keys(n.attrs).forEach(function(k){var v=n.attrs[k];if(k==='text'){el.textContent=v;return}if(k==='points')v=v.map(function(p){return p.join(',')}).join(' ');var attr=(k==='x'||k==='y')?(n.type==='circle'||n.type==='ellipse'?map[k]:(k==='x'&&n.type==='line'?'x1':k==='y'&&n.type==='line'?'y1':k)):(map[k]||k);el.setAttribute(attr,v)});g.appendChild(el);scene.appendChild(g);nodes[n.id]=el;groups[n.id]=g;if(n.type==='text')labels.push(g);function select(){$('detail').textContent=n.label+': '+n.explanation}g.addEventListener('click',select);g.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();select()}});var b=document.createElement('button');b.textContent=n.label;b.addEventListener('click',select);$('items').appendChild(b)});
function draw(){data.motions.forEach(function(m){var a=2*Math.PI*m.cycles*time/data.duration+m.phase*Math.PI/180,g=groups[m.node];g.removeAttribute('transform');g.removeAttribute('opacity');if(m.kind==='orbit'){var definition=data.nodes.find(function(n){return n.id===m.node}),x=m.origin==='center'?m.cx-(definition.attrs.x||0):0,y=m.origin==='center'?m.cy-(definition.attrs.y||0):0;g.setAttribute('transform','translate('+(x+m.dx*Math.cos(a))+' '+(y+m.dy*Math.sin(a))+')')}if(m.kind==='translate')g.setAttribute('transform','translate('+(m.dx*Math.sin(a))+' '+(m.dy*Math.sin(a))+')');if(m.kind==='rotate')g.setAttribute('transform','rotate('+(a*180/Math.PI)+' '+m.cx+' '+m.cy+')');if(m.kind==='pulse')g.setAttribute('opacity',.55+.45*(1+Math.sin(a))/2)});$('time').value=Math.round(time/data.duration*1000);$('progress').textContent=time.toFixed(1).replace('.',',')+' s / '+data.duration+' s'}
function pause(){playing=false;last=null;if(raf!==null)cancelAnimationFrame(raf);raf=null;$('play').textContent='Iniciar';$('play').setAttribute('aria-pressed','false')}
function tick(now){raf=null;if(!playing||destroyed)return;if(last!==null)time=Math.min(data.duration,time+Math.max(0,Math.min(.1,(now-last)/1000))*Number($('speed').value));last=now;draw();if(time>=data.duration){pause();return}raf=requestAnimationFrame(tick)}
$('play').addEventListener('click',function(){if(playing){pause();return}if(time>=data.duration)time=0;playing=true;last=null;$('play').textContent='Pausar';$('play').setAttribute('aria-pressed','true');raf=requestAnimationFrame(tick)});$('reset').addEventListener('click',function(){pause();time=0;draw();$('detail').textContent='Selecione um objeto para consultar sua explicação.'});$('time').addEventListener('input',function(){pause();time=Number(this.value)/1000*data.duration;draw()});$('labels').addEventListener('click',function(){var visible=this.getAttribute('aria-pressed')!=='true';this.setAttribute('aria-pressed',String(visible));labels.forEach(function(g){g.style.display=visible?'':'none'})});document.addEventListener('visibilitychange',function(){if(document.hidden)pause()});window.addEventListener('pagehide',function(){destroyed=true;pause()});draw();
window.addEventListener('pageshow',function(){destroyed=false;pause()});
})();
</script></body></html>
