<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PptxGenJS Presentation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #fff;
            overflow: hidden;
        }
        
        #player-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* Sidebar Navigation Styles */
        #slide-sidebar {
            position: fixed;
            left: -280px;
            top: 0;
            width: 280px;
            height: calc(100vh - 60px);
            background: #16213e;
            z-index: 500;
            transition: left 0.3s ease;
            display: flex;
            flex-direction: column;
            box-shadow: 4px 0 20px rgba(0,0,0,0.3);
        }
        
        #slide-sidebar.open {
            left: 0;
        }
        
        .sidebar-header {
            padding: 20px;
            background: #0f3460;
            border-bottom: 1px solid #1a4980;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .sidebar-header h3 {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
            color: #f1f5f9;
        }
        
        .sidebar-close {
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 20px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            transition: all 0.2s;
        }
        
        .sidebar-close:hover {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }
        
        #sidebar-slides {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        
        #sidebar-slides::-webkit-scrollbar {
            width: 6px;
        }
        
        #sidebar-slides::-webkit-scrollbar-track {
            background: #0f3460;
        }
        
        #sidebar-slides::-webkit-scrollbar-thumb {
            background: #1a4980;
            border-radius: 3px;
        }
        
        .sidebar-slide-item {
            display: flex;
            align-items: center;
            padding: 10px;
            margin-bottom: 8px;
            background: #0f3460;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
        }
        
        .sidebar-slide-item:hover {
            background: #1a4980;
        }
        
        .sidebar-slide-item.active {
            border-color: #7c3aed;
            background: linear-gradient(135deg, rgba(124, 58, 237, 0.2), rgba(6, 182, 212, 0.1));
        }
        
        .sidebar-thumbnail {
            width: 80px;
            height: 45px;
            border-radius: 4px;
            background-size: cover;
            background-position: center;
            flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .sidebar-slide-info {
            margin-left: 12px;
            flex: 1;
            min-width: 0;
        }
        
        .sidebar-slide-title {
            font-size: 14px;
            font-weight: 500;
            color: #f1f5f9;
            margin-bottom: 4px;
        }
        
        .sidebar-slide-status {
            font-size: 12px;
            color: #64748b;
        }
        
        .sidebar-slide-status.completed {
            color: #22c55e;
        }
        
        .sidebar-slide-status.current {
            color: #7c3aed;
        }
        
        /* Adjust main content when sidebar is open */
        #slide-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #0f0f1a;
            overflow: hidden;
            transition: margin-left 0.3s ease;
        }
        
        /* Mobile landscape optimization */
        @media screen and (orientation: landscape) and (max-height: 500px) {
            #slide-wrapper {
                padding: 5px;
            }
        }
        
        #slide-wrapper.sidebar-open {
            margin-left: 280px;
        }
        
        #slide-container {
            width: 1280px;
            height: 720px;
            background: #fff;
            position: relative;
            overflow: visible; /* Allow elements with negative positions to be visible */
            box-shadow: 0 10px 50px rgba(0,0,0,0.5);
            transform-origin: center center;
            /* Scale will be calculated dynamically by JS */
        }
        
        /* Mobile: reduce shadow for cleaner look */
        @media screen and (max-width: 900px) {
            #slide-container {
                box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            }
        }
        
        .slide-element {
            position: absolute !important;
            /* Removed overflow: hidden to allow proper rendering */
        }
        
        .text-element {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
        .image-element {
            object-fit: contain;
        }
        
        .image-element img {
            width: 100% !important;
            height: 100% !important;
            object-fit: contain !important;
        }
        
        .video-element {
            border: none !important;
            background: transparent !important;
        }
        
        .video-element iframe,
        .video-element video {
            width: 100% !important;
            height: 100% !important;
            border: none !important;
            background: transparent !important;
        }
        
        /* WebM videos with transparent background */
        .video-element video[src*=".webm"] {
            background: transparent !important;
        }
        
        /* Button Element Styles */
        .button-element {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .scorm-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
        }
        
        .scorm-button.primary {
            background: linear-gradient(135deg, #7c3aed, #06b6d4);
            color: white;
        }
        
        .scorm-button.primary:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.4);
        }
        
        .scorm-button.secondary {
            background: #4b5563;
            color: white;
        }
        
        .scorm-button.secondary:hover {
            background: #374151;
        }
        
        .scorm-button.outline {
            background: transparent;
            border: 2px solid #7c3aed;
            color: #7c3aed;
        }
        
        .scorm-button.outline:hover {
            background: rgba(124, 58, 237, 0.1);
        }
        
        .scorm-button.ghost {
            background: transparent;
            color: #374151;
        }
        
        .scorm-button.ghost:hover {
            background: rgba(0, 0, 0, 0.05);
        }
        
        .scorm-button .btn-icon {
            font-size: 1.2em;
        }
        
        /* HTML Element Styles */
        .html-element {
            background: transparent;
            border-radius: 4px;
            overflow: hidden;
        }
        
        .html-element iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
        }
        
        /* Flipbook Element Styles */
        .flipbook-element {
            background: #f0f0f0;
            border-radius: 4px;
            overflow: hidden;
        }
        
        .flipbook-element iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        .flipbook-images-container {
            width: 100%;
            height: 100%;
        }
        
        #controls {
            height: 60px;
            background: #16213e;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-top: 1px solid #0f3460;
        }
        
        /* Mobile: smaller controls */
        @media screen and (max-width: 900px) {
            #controls {
                height: 50px;
                padding: 0 10px;
            }
        }
        
        @media screen and (orientation: landscape) and (max-height: 500px) {
            #controls {
                height: 44px;
                padding: 0 8px;
            }
        }
        
        .nav-buttons {
            display: flex;
            gap: 10px;
        }
        
        @media screen and (max-width: 900px) {
            .nav-buttons {
                gap: 5px;
            }
        }
        
        .control-btn {
            background: #0f3460;
            border: none;
            color: #fff;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        
        /* Mobile: smaller buttons */
        @media screen and (max-width: 900px) {
            .control-btn {
                padding: 8px 12px;
                font-size: 12px;
                border-radius: 4px;
            }
        }
        
        @media screen and (orientation: landscape) and (max-height: 500px) {
            .control-btn {
                padding: 6px 10px;
                font-size: 11px;
            }
        }
        
        .control-btn:hover:not(:disabled) {
            background: #1a4980;
        }
        
        .control-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        #progress-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 20px;
        }
        
        .progress-dots {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .progress-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }
        
        .progress-dot:hover {
            background: rgba(255, 255, 255, 0.5);
        }
        
        .progress-dot.active {
            background: #06b6d4;
            transform: scale(1.2);
        }
        
        .progress-dot.completed {
            background: #10b981;
        }
        
        @media screen and (max-width: 900px) {
            .progress-dots {
                gap: 4px;
            }
            .progress-dot {
                width: 8px;
                height: 8px;
            }
        }
        
        #slide-counter {
            font-size: 14px;
            color: #94a3b8;
            min-width: 80px;
            text-align: center;
        }
        
        .icon-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            padding: 8px;
            cursor: pointer;
            border-radius: 4px;
            transition: color 0.2s, background 0.2s;
        }
        
        .icon-btn:hover {
            color: #fff;
            background: rgba(255,255,255,0.1);
        }
        
        #global-audio {
            display: none;
        }
        
        /* Volume control styles */
        .volume-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        
        #volume-control {
            display: none;
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            background: #16213e;
            padding: 15px 10px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            flex-direction: column;
            align-items: center;
            gap: 8px;
            z-index: 100;
        }
        
        #volume-control::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 8px solid #16213e;
        }
        
        #volume-slider {
            -webkit-appearance: none;
            width: 100px;
            height: 6px;
            border-radius: 3px;
            background: #0f3460;
            outline: none;
        }
        
        #volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7c3aed, #06b6d4);
            cursor: pointer;
            transition: transform 0.1s;
        }
        
        #volume-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }
        
        #volume-slider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7c3aed, #06b6d4);
            cursor: pointer;
            border: none;
        }
        
        #volume-value {
            font-size: 12px;
            color: #94a3b8;
            min-width: 40px;
            text-align: center;
        }
        
        /* Start overlay styles */
        #start-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 60px;
            background: rgba(15, 23, 42, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }
        
        .start-overlay-content {
            text-align: center;
            color: #fff;
            padding: 40px;
            max-width: 400px;
        }
        
        .start-overlay-icon {
            font-size: 64px;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }
        
        .start-overlay-content h2 {
            font-size: 24px;
            margin: 0 0 10px 0;
            color: #f1f5f9;
        }
        
        .start-overlay-content p {
            font-size: 14px;
            color: #94a3b8;
            margin: 0 0 30px 0;
        }
        
        .start-btn {
            background: linear-gradient(135deg, #7c3aed, #06b6d4);
            border: none;
            color: #fff;
            padding: 16px 40px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 18px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.4);
        }
        
        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(124, 58, 237, 0.6);
        }
        
        .start-btn:active {
            transform: translateY(0);
        }
        
        /* Mobile Orientation Overlay */
        #orientation-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            z-index: 99999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        
        /* Force display on mobile portrait mode using CSS media query */
        @media screen and (orientation: portrait) and (max-width: 900px) {
            #orientation-overlay {
                display: flex !important;
            }
            #player-container {
                display: none !important;
            }
        }
        
        /* Also detect by aspect ratio for devices that don't report orientation correctly */
        @media screen and (max-aspect-ratio: 4/5) and (max-width: 900px) {
            #orientation-overlay {
                display: flex !important;
            }
            #player-container {
                display: none !important;
            }
        }
        
        .orientation-content {
            text-align: center;
            padding: 30px;
            color: white;
            max-width: 90%;
        }
        
        .orientation-icon {
            font-size: 70px;
            margin-bottom: 10px;
            animation: shake 1.5s ease-in-out infinite;
        }
        
        .orientation-arrow {
            font-size: 50px;
            color: #7c3aed;
            margin-bottom: 15px;
            animation: rotate-hint 2s ease-in-out infinite;
        }
        
        @keyframes rotate-hint {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
        }
        
        @keyframes shake {
            0%, 100% { transform: rotate(-10deg); }
            50% { transform: rotate(10deg); }
        }
        
        .orientation-content h2 {
            font-size: 24px;
            margin-bottom: 12px;
            color: #fff;
        }
        
        .orientation-content p {
            font-size: 14px;
            color: #a0aec0;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        
        .orientation-hint {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
        }
        
        .phone-icon {
            font-size: 40px;
            transition: all 0.3s ease;
        }
        
        .phone-icon.vertical {
            opacity: 0.5;
        }
        
        .phone-icon.horizontal {
            transform: rotate(90deg);
            color: #7c3aed;
        }
        
        .orientation-hint .arrow {
            font-size: 24px;
            color: #7c3aed;
            animation: pulse-arrow 1s ease-in-out infinite;
        }
        
        @keyframes pulse-arrow {
            0%, 100% { transform: translateX(0); opacity: 1; }
            50% { transform: translateX(10px); opacity: 0.5; }
        }
    </style>
</head>
<body>
    <!-- Mobile Orientation Overlay -->
    <div id="orientation-overlay">
        <div class="orientation-content">
            <div class="orientation-icon">📱</div>
            <div class="orientation-arrow">↻</div>
            <h2>Rotacione seu dispositivo</h2>
            <p>Para uma melhor experiência, por favor visualize este conteúdo no modo horizontal (paisagem)</p>
            <div class="orientation-hint">
                <span class="phone-icon vertical">📱</span>
                <span class="arrow">→</span>
                <span class="phone-icon horizontal">📱</span>
            </div>
        </div>
    </div>
    
    <div id="player-container">
        <!-- Sidebar Navigation -->
        <div id="slide-sidebar">
            <div class="sidebar-header">
                <h3>📚 Navegação</h3>
                <button class="sidebar-close" onclick="CoursePlayer.toggleSidebar()" title="Fechar menu">✕</button>
            </div>
            <div id="sidebar-slides"></div>
        </div>
        
        <div id="slide-wrapper">
            <div id="slide-container"></div>
        </div>
        
        <!-- Start overlay for audio autoplay permission -->
        <div id="start-overlay" style="display: none;">
            <div class="start-overlay-content">
                <div class="start-overlay-icon">🔊</div>
                <h2>Este curso contém áudio</h2>
                <p>Clique no botão abaixo para iniciar o curso com áudio</p>
                <button class="start-btn" onclick="CoursePlayer.startCourse()">
                    ▶ Iniciar Curso
                </button>
            </div>
        </div>
        
        <div id="controls">
            <div class="nav-buttons">
                <button class="icon-btn" onclick="CoursePlayer.toggleSidebar()" title="Menu de Navegação">
                    ☰
                </button>
                <button class="control-btn" id="prev-btn" onclick="CoursePlayer.prev()">
                    ← Anterior
                </button>
            </div>
            <div id="progress-container">
                <div class="progress-dots" id="progress-dots"></div>
            </div>
            <div class="nav-buttons">
                <button class="control-btn" id="next-btn" onclick="CoursePlayer.next()">
                    Próximo →
                </button>
                <div class="volume-wrapper">
                    <button class="icon-btn" id="volume-btn" onclick="CoursePlayer.toggleVolumeSlider()" title="Volume">
                        🔊
                    </button>
                    <div id="volume-control">
                        <input type="range" id="volume-slider" min="0" max="100" value="100" 
                               oninput="CoursePlayer.setVolume(this.value); document.getElementById('volume-value').textContent = this.value + '%'">
                        <span id="volume-value">100%</span>
                    </div>
                </div>
                <button class="icon-btn" onclick="CoursePlayer.fullscreen()" title="Tela Cheia">
                    ⛶
                </button>
            </div>
        </div>
    </div>
    <audio id="global-audio"></audio>
    <script src="scripts/scorm-api.js"></script>
    <script src="scripts/quiz-controller.js"></script>
    <script src="scripts/player.js"></script>
</body>
</html>
