<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PptxGenJS Presentation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #fff;
            overflow: hidden;
        }
        
        #player-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        #slide-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #0f0f1a;
            overflow: hidden; /* Clip at wrapper level */
        }
        
        #slide-container {
            width: 1280px;
            height: 720px;
            background: #fff;
            position: relative;
            overflow: visible; /* Allow elements with negative positions to be visible */
            box-shadow: 0 10px 50px rgba(0,0,0,0.5);
            transform-origin: center center;
            /* Scale will be calculated dynamically by JS */
        }
        
        .slide-element {
            position: absolute !important;
            /* Removed overflow: hidden to allow proper rendering */
        }
        
        .text-element {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
        .image-element {
            object-fit: contain;
        }
        
        .image-element img {
            width: 100% !important;
            height: 100% !important;
            object-fit: contain !important;
        }
        
        .video-element {
            border: none !important;
            background: #000 !important;
        }
        
        .video-element iframe,
        .video-element video {
            width: 100% !important;
            height: 100% !important;
            border: none !important;
        }
        
        #controls {
            height: 60px;
            background: #16213e;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-top: 1px solid #0f3460;
        }
        
        .nav-buttons {
            display: flex;
            gap: 10px;
        }
        
        .control-btn {
            background: #0f3460;
            border: none;
            color: #fff;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        
        .control-btn:hover:not(:disabled) {
            background: #1a4980;
        }
        
        .control-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        #progress-container {
            flex: 1;
            margin: 0 20px;
            height: 6px;
            background: #0f3460;
            border-radius: 3px;
            overflow: hidden;
        }
        
        #progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #7c3aed, #06b6d4);
            width: 0%;
            transition: width 0.3s ease;
        }
        
        #slide-counter {
            font-size: 14px;
            color: #94a3b8;
            min-width: 80px;
            text-align: center;
        }
        
        .icon-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            padding: 8px;
            cursor: pointer;
            border-radius: 4px;
            transition: color 0.2s, background 0.2s;
        }
        
        .icon-btn:hover {
            color: #fff;
            background: rgba(255,255,255,0.1);
        }
        
        #global-audio {
            display: none;
        }
        
        /* Volume control styles */
        .volume-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        
        #volume-control {
            display: none;
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            background: #16213e;
            padding: 15px 10px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            flex-direction: column;
            align-items: center;
            gap: 8px;
            z-index: 100;
        }
        
        #volume-control::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 8px solid #16213e;
        }
        
        #volume-slider {
            -webkit-appearance: none;
            width: 100px;
            height: 6px;
            border-radius: 3px;
            background: #0f3460;
            outline: none;
        }
        
        #volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7c3aed, #06b6d4);
            cursor: pointer;
            transition: transform 0.1s;
        }
        
        #volume-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }
        
        #volume-slider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7c3aed, #06b6d4);
            cursor: pointer;
            border: none;
        }
        
        #volume-value {
            font-size: 12px;
            color: #94a3b8;
            min-width: 40px;
            text-align: center;
        }
        
        /* Start overlay styles */
        #start-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 60px;
            background: rgba(15, 23, 42, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }
        
        .start-overlay-content {
            text-align: center;
            color: #fff;
            padding: 40px;
            max-width: 400px;
        }
        
        .start-overlay-icon {
            font-size: 64px;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }
        
        .start-overlay-content h2 {
            font-size: 24px;
            margin: 0 0 10px 0;
            color: #f1f5f9;
        }
        
        .start-overlay-content p {
            font-size: 14px;
            color: #94a3b8;
            margin: 0 0 30px 0;
        }
        
        .start-btn {
            background: linear-gradient(135deg, #7c3aed, #06b6d4);
            border: none;
            color: #fff;
            padding: 16px 40px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 18px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.4);
        }
        
        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(124, 58, 237, 0.6);
        }
        
        .start-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div id="player-container">
        <div id="slide-wrapper">
            <div id="slide-container"></div>
        </div>
        
        <!-- Start overlay for audio autoplay permission -->
        <div id="start-overlay" style="display: none;">
            <div class="start-overlay-content">
                <div class="start-overlay-icon">🔊</div>
                <h2>Este curso contém áudio</h2>
                <p>Clique no botão abaixo para iniciar o curso com áudio</p>
                <button class="start-btn" onclick="CoursePlayer.startCourse()">
                    ▶ Iniciar Curso
                </button>
            </div>
        </div>
        
        <div id="controls">
            <div class="nav-buttons">
                <button class="control-btn" id="prev-btn" onclick="CoursePlayer.prev()">
                    ← Previous
                </button>
                <button class="control-btn" id="next-btn" onclick="CoursePlayer.next()">
                    Next →
                </button>
            </div>
            <div id="progress-container">
                <div id="progress-bar"></div>
            </div>
            <span id="slide-counter">1 / 1</span>
            <div class="nav-buttons">
                <div class="volume-wrapper">
                    <button class="icon-btn" id="volume-btn" onclick="CoursePlayer.toggleVolumeSlider()" title="Volume">
                        🔊
                    </button>
                    <div id="volume-control">
                        <input type="range" id="volume-slider" min="0" max="100" value="100" 
                               oninput="CoursePlayer.setVolume(this.value); document.getElementById('volume-value').textContent = this.value + '%'">
                        <span id="volume-value">100%</span>
                    </div>
                </div>
                <button class="icon-btn" onclick="CoursePlayer.fullscreen()" title="Fullscreen">
                    ⛶
                </button>
            </div>
        </div>
    </div>
    <audio id="global-audio"></audio>
    <script src="scripts/scorm-api.js"></script>
    <script src="scripts/player.js"></script>
</body>
</html>
