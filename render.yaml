services:
  - type: web
    name: scormify-api
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # Keep production aligned with the linked Git branch. With this disabled,
    # SCORM exports kept packaging an older player.js even after fixes were
    # published to agent/render-bootstrap.
    autoDeployTrigger: commit
    envVars:
      - key: KLING_API_KEY
        sync: false
      - key: KLING_API_BASE_URL
        value: https://api-singapore.klingai.com
      - key: KLING_MAX_VIDEO_BYTES
        value: "188743680"
